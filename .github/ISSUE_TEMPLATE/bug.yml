name: Bug
description: Something Jig does today is wrong.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `claude plugin list` or `codex plugin list`, or the tag you pinned.
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Where you installed it from
      description: The ref in `claude plugin marketplace list --json`, or under `[marketplaces.jig]` in Codex's config.toml.
      options:
        - stable
        - latest
        - a pinned tag
        - main
        - a local checkout
    validations:
      required: true
  - type: input
    id: last-working
    attributes:
      label: Last version it worked in
      description: If it worked before, the version it last worked in. Leave empty if it never did.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The skill or gate, the command you ran, and what it did. Paste output in a code block. Leave out anything from your repository you would not publish.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: Agent tool and operating system
      placeholder: Claude Code 2.1.300 on macOS 26; Codex 0.160 on Ubuntu 24.04
