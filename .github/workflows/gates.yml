# PROBE ONLY, never merged: gates.yml in the mirror form, with the heavy steps
# stubbed. probe.txt holds "<pass|fail> <seconds the gate set sleeps>".
name: gates
run-name: ${{ github.event.label.name && github.event.label.name != 'ci:hold' && format('gates mirror for the {0} label', github.event.label.name) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.event.label.name && github.event.label.name != 'ci:hold' && format('mirror-{0}', github.run_id) || github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  areas:
    name: ${{ 'change areas' }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:hold') && !(github.event.label.name && github.event.label.name != 'ci:hold') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.resolve.outputs.areas }}
    steps:
      - name: Resolve the changed files to areas
        id: resolve
        run: echo 'areas=["drive-pr"]' >> "$GITHUB_OUTPUT"

  gate-set:
    name: ${{ 'gates (linux)' }}
    needs: areas
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:hold') && !(github.event.label.name && github.event.label.name != 'ci:hold') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Run gate set
        run: |
          read -r result pause < probe.txt
          echo "probe: $result after ${pause}s"
          sleep "$pause"
          test "$result" = pass

  drive-pr-suite:
    name: drive-pr suite (linux, ${{ matrix.shard }}/3)
    needs: areas
    if: ${{ contains(needs.areas.outputs.areas, '"drive-pr"') && !contains(github.event.pull_request.labels.*.name, 'ci:hold') && !(github.event.label.name && github.event.label.name != 'ci:hold') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run this shard of the drive-pr suite
        run: echo "shard ${{ matrix.shard }}"

  gates:
    needs: [areas, gate-set, drive-pr-suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: ${{ github.event.label.name && github.event.label.name != 'ci:hold' && 8 || 5 }}
    permissions:
      actions: write
    steps:
      - name: Stop while the CI hold is on
        if: ${{ contains(github.event.pull_request.labels.*.name, 'ci:hold') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::held: this pull request carries the ci:hold label, so its heavy jobs were skipped."
          if curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$RUN_URL/cancel" > /dev/null; then
            deadline=$((SECONDS + 120))
            while [ "$SECONDS" -lt "$deadline" ]; do sleep 5; done
            echo "::error::the run's cancellation did not arrive within two minutes"
          fi
          exit 1
      - name: Mirror the newest real run on this head
        if: ${{ github.event.label.name && github.event.label.name != 'ci:hold' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF: ${{ github.run_id }}
          MIRROR: gates mirror for the
        run: |
          deadline=$((SECONDS + 300))
          grace=$((SECONDS + 60))
          misses=0
          read_api() {
            if out=$(timeout 30 gh api "$@"); then misses=0; return 0; fi
            misses=$((misses + 1))
            if [ "$misses" -ge 3 ]; then
              echo "::error::the API did not answer three reads in a row, so this label event cannot show the head's gates result. Push, or change the label again, to run CI."
              exit 1
            fi
            return 1
          }
          while :; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no real gates run on $HEAD_SHA completed within five minutes. Push, or change the label again, to run CI."
              exit 1
            fi
            if read_api "repos/$GITHUB_REPOSITORY/actions/workflows/gates.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[] | select(.id != (env.SELF | tonumber) and (.display_title | startswith(env.MIRROR) | not))] | if length == 0 then "none" else (max_by(.id) | "\(.id) \(.status)") end'; then
              newest=$out
              if [ "$newest" = none ]; then
                if [ "$SECONDS" -ge "$grace" ]; then
                  echo "::error::no real gates run exists on $HEAD_SHA, so this label event has no result to show. Push to run CI."
                  exit 1
                fi
              else
                set -- $newest
                run=$1
                if [ "$2" = completed ] && read_api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
                  --jq '[.jobs[] | select(.name == "gates")] | if length == 1 then .[0].conclusion // "none" else "missing" end'; then
                  conclusion=$out
                  url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
                  if [ "$conclusion" = success ]; then
                    echo "::notice::the newest real gates run on this head passed: $url"
                    exit 0
                  fi
                  echo "::error::the newest real gates run on this head did not pass (its gates job: $conclusion): $url"
                  exit 1
                fi
              fi
            fi
            sleep 10
          done
      - name: Require every selected job
        if: ${{ !(github.event.label.name && github.event.label.name != 'ci:hold') }}
        env:
          AREAS: ${{ needs.areas.result }}
          GATE_SET: ${{ needs.gate-set.result }}
          DRIVE_PR: ${{ needs.drive-pr-suite.result }}
          DRIVE_PR_SELECTED: ${{ contains(needs.areas.outputs.areas, '"drive-pr"') }}
        run: |
          failed=""
          [ "$AREAS" = success ] || failed="$failed areas($AREAS)"
          [ "$GATE_SET" = success ] || failed="$failed gate-set($GATE_SET)"
          if [ "$DRIVE_PR_SELECTED" = true ]; then
            [ "$DRIVE_PR" = success ] || failed="$failed drive-pr-suite($DRIVE_PR)"
          else
            [ "$DRIVE_PR" = skipped ] || failed="$failed drive-pr-suite($DRIVE_PR)"
          fi
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not pass:$failed"
            exit 1
          fi
