# PROBE ONLY, never merged: gates.yml's triggers, concurrency, job names and
# conditions in the label-skip form, with the heavy steps stubbed. probe.txt
# holds "<pass|fail> <seconds the gate set sleeps>".
name: gates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.event.label.name && github.event.label.name != 'ci:hold' && format('label-{0}', github.run_id) || github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  areas:
    name: ${{ github.event.label.name && github.event.label.name != 'ci:hold' && 'change areas [label event]' || 'change areas' }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:hold') && !(github.event.label.name && github.event.label.name != 'ci:hold') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.resolve.outputs.areas }}
    steps:
      - name: Resolve the changed files to areas
        id: resolve
        run: echo 'areas=["drive-pr"]' >> "$GITHUB_OUTPUT"

  gate-set:
    name: ${{ github.event.label.name && github.event.label.name != 'ci:hold' && 'gates (linux) [label event]' || 'gates (linux)' }}
    needs: areas
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:hold') && !(github.event.label.name && github.event.label.name != 'ci:hold') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Run gate set
        run: |
          read -r result pause < probe.txt
          echo "probe: $result after ${pause}s"
          sleep "$pause"
          test "$result" = pass

  drive-pr-suite:
    name: ${{ github.event.label.name && github.event.label.name != 'ci:hold' && 'drive-pr suite [label event]' || format('drive-pr suite (linux, {0}/3)', matrix.shard) }}
    needs: areas
    if: ${{ contains(needs.areas.outputs.areas, '"drive-pr"') && !contains(github.event.pull_request.labels.*.name, 'ci:hold') && !(github.event.label.name && github.event.label.name != 'ci:hold') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run this shard of the drive-pr suite
        run: echo "shard ${{ matrix.shard }}"

  literal-matrix:
    name: literal matrix (${{ matrix.shard }}/2)
    needs: areas
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:hold') && !(github.event.label.name && github.event.label.name != 'ci:hold') }}
    strategy:
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "shard ${{ matrix.shard }}"

  gates:
    name: ${{ github.event.label.name && github.event.label.name != 'ci:hold' && 'gates [label event]' || 'gates' }}
    needs: [areas, gate-set, drive-pr-suite]
    if: ${{ !cancelled() && !(github.event.label.name && github.event.label.name != 'ci:hold') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Stop while the CI hold is on
        if: ${{ contains(github.event.pull_request.labels.*.name, 'ci:hold') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::held: this pull request carries the ci:hold label, so its heavy jobs were skipped."
          if curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$RUN_URL/cancel" > /dev/null; then
            deadline=$((SECONDS + 120))
            while [ "$SECONDS" -lt "$deadline" ]; do sleep 5; done
            echo "::error::the run's cancellation did not arrive within two minutes"
          fi
          exit 1
      - name: Require every selected job
        env:
          AREAS: ${{ needs.areas.result }}
          GATE_SET: ${{ needs.gate-set.result }}
          DRIVE_PR: ${{ needs.drive-pr-suite.result }}
          DRIVE_PR_SELECTED: ${{ contains(needs.areas.outputs.areas, '"drive-pr"') }}
        run: |
          failed=""
          [ "$AREAS" = success ] || failed="$failed areas($AREAS)"
          [ "$GATE_SET" = success ] || failed="$failed gate-set($GATE_SET)"
          if [ "$DRIVE_PR_SELECTED" = true ]; then
            [ "$DRIVE_PR" = success ] || failed="$failed drive-pr-suite($DRIVE_PR)"
          else
            [ "$DRIVE_PR" = skipped ] || failed="$failed drive-pr-suite($DRIVE_PR)"
          fi
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not pass:$failed"
            exit 1
          fi
