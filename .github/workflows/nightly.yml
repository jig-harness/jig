# Once a day, the gate set and the drive-pr suite run on macOS and Windows
# against main. Pull requests and pushes to main run on Linux only
# (gates.yml): a run on every platform per change costs several times the
# Linux run and is the slowest part of it, while what breaks only on macOS or
# Windows is rare enough that finding it within a day is soon enough.
#
# The website parser tests run in their own job on both platforms, with the
# website dependencies installed. The drive-pr suite runs in its own jobs, one
# per platform, split into parallel shards; the do-item suite runs inside the
# gate set on both. On Windows the gate script leaves out only the POSIX-only
# suites (see SEPARATE_SUITES and POSIX_ONLY_SUITES in scripts/gates.ts), and
# the gate set runs as parallel jobs, each taking a part of the test files.
# Before its gates, Windows exercises the documented pickup and drive
# commands in PowerShell against local fake services. The normal gate set
# runs the same smoke with native argument arrays.
# Every `bun run test`, including each platform gate shard's test stage,
# writes a fresh JUnit report and checks tests executed (scripts/test.ts).
#
# Tests known to fail on a platform are recorded, each group with its reason
# and the issue that owns the fix, in the known-failure baseline
# (.config/nightly-baseline.yaml). Each job's test step names the baseline in
# JIG_NIGHTLY_BASELINE: the step passes when every failing test is recorded
# for its platform and fails on any that is not, and a recorded test that
# passes is reported as stale, as a warning and in the job summary, so its
# entry is removed. A failure the report cannot tie to a named test, such as a
# test file that fails to load, keeps the step red. `bun run gates` checks
# that every entry still names a test (scripts/check-nightly-baseline.ts).
#
# Nothing waits for this run. On main, its last job reads how every job ended
# and what each test step found, and keeps one tracking issue
# (scripts/nightly/report.ts): a failing run opens it, or comments on it with
# the run link, the jobs that failed and their new failures; the next passing
# run comments and closes it. workflow_dispatch runs it on demand, against
# any branch, before merging a change that is likely to break on one of these
# platforms; a run on another branch leaves the issue alone.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-gates:
    name: gates (${{ matrix.os }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          # Windows runs test files one at a time and starts processes several
          # times slower, so its test stage, about an hour whole, is split
          # into parts. Bun deals the files out in turn, and the
          # resolve-conflicts suite alone takes some 25 minutes there, its
          # check-resolution file 10, so fewer parts leave one that holds
          # several of its files near the job's budget. Each part also runs
          # the rest of the gate set, a few minutes, so each reports on its
          # own as the macOS job does.
          - { os: windows, runner: windows-latest, shard: 1/7 }
          - { os: windows, runner: windows-latest, shard: 2/7 }
          - { os: windows, runner: windows-latest, shard: 3/7 }
          - { os: windows, runner: windows-latest, shard: 4/7 }
          - { os: windows, runner: windows-latest, shard: 5/7 }
          - { os: windows, runner: windows-latest, shard: 6/7 }
          - { os: windows, runner: windows-latest, shard: 7/7 }
    runs-on: ${{ matrix.runner }}
    # A Windows part takes the longest, up to about 17 minutes on the
    # standard image.
    timeout-minutes: 25
    env:
      # The drive-pr-suite, drive-pr-suite-windows and website jobs below run
      # the separate suites; on Windows the gate script also leaves out the
      # POSIX-only suites.
      JIG_GATES_SKIP_SEPARATE_SUITES: "1"
      # The part of the test files this job runs (scripts/gates.ts); empty,
      # on macOS, runs them all.
      JIG_GATES_TEST_SHARD: ${{ matrix.shard }}
      # Every runner image has Google Chrome, so a sheet's browser checks
      # fail here when it is missing instead of being skipped with a warning.
      JIG_REQUIRE_BROWSER: "1"
      # The job's name, as its test results and the tracking issue give it.
      JIG_NIGHTLY_JOB: gates (${{ matrix.os }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ratchet and fallow's audit compare against the merge base
          # with main, which a shallow checkout does not have.
          fetch-depth: 0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Create the /tmp directory Git Bash expects
        if: matrix.os == 'windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\Program Files\Git\tmp" | Out-Null
      - name: Install locked dependencies, scripts off
        run: bun install --frozen-lockfile --ignore-scripts
      # This small smoke uses a local repository and strict fake services. It
      # checks the installed artifact's documented pickup and drive commands
      # in the actual Windows shell, independently of an authenticated agent.
      # One part runs it.
      - name: Run documented skill commands in PowerShell
        if: matrix.shard == '1/7'
        shell: pwsh
        env:
          JIG_TEST_PWSH: "1"
        run: bun run test --timeout 60000 tools/plugin/powershell-smoke.test.ts --test-name-pattern PowerShell
      - name: Run gate set
        env:
          JIG_NIGHTLY_BASELINE: .config/nightly-baseline.yaml
          JIG_NIGHTLY_RESULTS: ${{ runner.temp }}/nightly-results
        run: bun run gates
      - name: Keep this job's test results for the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-results
          if-no-files-found: ignore
          retention-days: 7

  drive-pr-suite:
    name: drive-pr suite (macos, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-latest
    # A shard takes up to about 3 minutes.
    timeout-minutes: 15
    env:
      JIG_NIGHTLY_JOB: drive-pr suite (macos, ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The summary-findings tests position a reviewer against real commits
          # of this repository, which a shallow checkout does not have.
          fetch-depth: 0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install locked dependencies, scripts off
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run this shard of the drive-pr suite
        env:
          JIG_NIGHTLY_BASELINE: .config/nightly-baseline.yaml
          JIG_NIGHTLY_RESULTS: ${{ runner.temp }}/nightly-results
        run: bun run test --shard=${{ matrix.shard }}/4 ./plugin/skills/drive-pr/
      - name: Keep this job's test results for the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-results
          if-no-files-found: ignore
          retention-days: 7

  drive-pr-suite-windows:
    name: drive-pr suite (windows, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    # Serial native fixture execution and teardown need a larger job budget;
    # each test retains the test runner's independent deadline. A shard
    # takes 29 to 35 minutes while its known failures wait out their
    # deadlines, so the budget leaves room above that.
    timeout-minutes: 45
    env:
      JIG_NIGHTLY_JOB: drive-pr suite (windows, ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The summary-findings tests position a reviewer against real commits
          # of this repository, which a shallow checkout does not have.
          fetch-depth: 0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Create the /tmp directory Git Bash expects
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\Program Files\Git\tmp" | Out-Null
      - name: Install locked dependencies, scripts off
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Enable Windows drive timing spans
        shell: pwsh
        run: |
          "JIG_TRACE=1" >> $env:GITHUB_ENV
          "JIG_TRACE_FILE=$env:RUNNER_TEMP/drive-pr-trace.jsonl" >> $env:GITHUB_ENV
      - name: Run this shard of the drive-pr suite
        env:
          JIG_NIGHTLY_BASELINE: .config/nightly-baseline.yaml
          JIG_NIGHTLY_RESULTS: ${{ runner.temp }}/nightly-results
        run: bun run test --shard=${{ matrix.shard }}/4 ./plugin/skills/drive-pr/
      - name: Keep this job's test results for the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Print Windows drive timing spans on failure
        if: failure()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP/drive-pr-trace.jsonl" -ErrorAction SilentlyContinue

  website:
    name: website (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      JIG_NIGHTLY_JOB: website (${{ matrix.os }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install locked dependencies, scripts off
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the website's locked dependencies, scripts off
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test the document parsers
        env:
          JIG_NIGHTLY_BASELINE: .config/nightly-baseline.yaml
          JIG_NIGHTLY_RESULTS: ${{ runner.temp }}/nightly-results
        run: bun run test ./website/
      - name: Keep this job's test results for the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-results-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-results
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: report
    needs: [platform-gates, drive-pr-suite, drive-pr-suite-windows, website]
    # Runs whether the jobs passed or failed, but not for a run a newer one
    # cancelled, and only on main: a dispatch against a branch leaves the
    # tracking issue alone. The concurrency group keeps two reports from
    # opening an issue at once.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The run's job listing says how each job ended.
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Test the reporter before it maintains an issue
        run: bun run test ./scripts/nightly/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A job that ended before its tests reported uploaded nothing; the
        # report names it from the job listing.
        continue-on-error: true
        with:
          pattern: nightly-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/nightly-results
      - name: Report the run and reconcile its tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/nightly/report.ts --results "$RUNNER_TEMP/nightly-results"
