# Deploys jig-harness.dev from main. The site renders the repository's
# documents, so every push to main deploys: a static build takes about a
# minute and a deploy that changes nothing is harmless. The Worker serves
# only its custom domain (website/worker/index.ts). Needs the
# CLOUDFLARE_API_TOKEN secret of the `website` environment, a token limited
# to this account's Workers scripts and the zone's routes and DNS.
name: website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: website
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # No later step pushes, and the job holds the deploy token, so the
          # checkout token is not kept for the build's scripts to read.
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install locked dependencies, scripts off
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the website's locked dependencies, scripts off
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the site and check its links
        working-directory: website
        run: bun run build
      - name: Deploy to Cloudflare
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx --bun wrangler deploy
