# Deploys jig-harness.dev from main. The site renders the repository's
# documents, so every push to main deploys: a static build takes about a
# minute and a deploy that changes nothing is harmless. The Worker serves
# only its custom domain (website/worker/index.ts). Needs the
# CLOUDFLARE_API_TOKEN secret of the `website` environment, a token limited
# to this account's Workers scripts and the zone's routes and DNS.
name: website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-ref:
    # GitHub expressions compare strings case-insensitively, so validate the
    # raw ref in the runner before allowing a job to use the deploy environment.
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require the exact main ref
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != 'refs/heads/main' ]; then
            echo 'Dispatch website from main.' >&2
            exit 1
          fi
  deploy:
    needs: reject-ref
    # Only the validated production deployment takes this lock. A rejected
    # dispatch cannot replace a pending main deployment.
    concurrency:
      group: website-deploy-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, and the job holds the deploy token, so the
          # checkout token is not kept for the build's scripts to read.
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install locked dependencies, scripts off
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the website's locked dependencies, scripts off
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the site and check its links
        working-directory: website
        run: bun run build
      - name: Deploy to Cloudflare
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx --bun wrangler deploy
