<title>Dispatch</title>
<style>:root { color-scheme: light dark; }
body { margin: 0; }
.dd {
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --r-tag: 4px; --r: 8px; --r-card: 12px; --r-panel: 14px; --tap: 44px;
  --outer: light-dark(#e8e4dd, #0d0b09);
  --bg: light-dark(#f9f6f1, #1a1713);
  --card: light-dark(#fffdfa, #23201c);
  --sunk: light-dark(#f0ece5, #13100d);
  --ink: light-dark(#251e18, #ebe7e0);
  --muted: light-dark(#59514a, #b8b3ac);
  --line: light-dark(#d5d0c8, #433f3a);
  --line-strong: light-dark(#867f77, #847f78);
  --accent: light-dark(#1a6444, #82d2a8);
  --accent-hover: light-dark(#005031, #9fe7c0);
  --on-accent: light-dark(#fcfaf6, #0e1913);
  --accent-soft: light-dark(#dbf2e4, #1b3427);
  --hl: light-dark(#f7e8af, #4e3e09);
  --hl-line: light-dark(#815b1f, #ddc276);
  --focus: light-dark(#0267c7, #7dbaff);
  --focus-soft: light-dark(#e3eefb, #1b2a3c);
  --bad: light-dark(#a8201a, #ff9e94);
  --wait: light-dark(#6a3a9e, #cdb4f5);
  --small: 14px;
  container: page / inline-size;
  min-height: 100vh; box-sizing: border-box;
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 var(--sans);
  -webkit-text-size-adjust: 100%;
}
.dd *, .dd *::before { box-sizing: border-box; }
.dd a { color: var(--accent); text-underline-offset: 2px; }
.dd a:hover { color: var(--accent-hover); }
.dd :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.dd h1, .dd h2, .dd h3, .dd p { margin: 0; }
.dd h2 { font: 600 20px/1.2 var(--serif); }
.dd h3 { font: 600 var(--small)/1.3 var(--sans); }
.m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
a.tgt { display: inline-flex; align-items: center; min-height: 44px; }
.mut { color: var(--muted); }
.sm { font-size: var(--small); }
.nowrap { white-space: nowrap; }
#line, #queue, #history, #legend, .panel { scroll-margin-top: 104px; }

/* status strip: sticky on every viewport, carries the newest tick */
.strip { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.strip.alarm { background: var(--sunk); border-bottom: 2px solid var(--line-strong); }
.stripIn { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; max-width: 1200px; margin: 0 auto; padding: 2px 16px 0; min-height: 48px; }
.brand { display: flex; align-items: center; gap: 6px; flex: none; font: 600 18px/1 var(--serif); }
.brand svg { width: 28px; height: 28px; display: block; }
.brand span { display: none; }
.tick { flex: 1 1 auto; min-width: 0; display: flex; justify-content: flex-end; font-size: 14px; line-height: 1.25; }
.stripTools { flex: none; display: flex; align-items: center; }

/* how fresh the page is: a dot and a few words, the facts one hover or tap away */
.fresh { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 0; padding: 0; background: none; border: 0; color: var(--muted); font: 400 14px/1.25 var(--sans); text-align: left; cursor: help; }
.fresh .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.fresh.late { color: var(--ink); font-weight: 600; }
.fresh.late .dot { background: var(--bad); }

/* the views: Merge, Needs you, Running, Queue, History, then Help */
.views { order: 9; flex-basis: 100%; display: flex; gap: 4px; margin: 0 -10px; overflow-x: auto; scrollbar-width: none; }
.viewTab { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; white-space: nowrap; border-bottom: 2px solid transparent; color: var(--muted); text-decoration: none; font: 400 15px/1 var(--sans); }
.dd .viewTab { color: var(--muted); text-decoration: none; }
.dd .viewTab:hover { color: var(--ink); }
.dd .viewTab[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid var(--hl-line); border-radius: 10px; background: var(--hl); color: var(--ink); font: 600 12px/1 var(--mono); }
.badge.quiet { border-color: var(--line); background: transparent; color: var(--muted); font-weight: 400; }
.themeBtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; justify-content: center; padding: 0 8px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-tag); font: 400 14px/1 var(--sans); cursor: pointer; }
.themeBtn:hover { border-color: var(--line-strong); }
.themeWord { display: none; }

/* the status mark: one role, one key cap */
.mk { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 18px; height: 18px; border: 1px solid currentColor; border-radius: 3px; font: 700 14px/1 var(--mono); vertical-align: -3px; }
.r-needs { color: var(--hl-line); }
.mk.r-needs { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mk.r-needs::before { content: ""; width: 12px; height: 13px; background: radial-gradient(circle at 50% 26%, currentColor 0 24%, transparent 26%), radial-gradient(ellipse 50% 44% at 50% 100%, currentColor 0 98%, transparent 100%); }
.r-working, .r-well { color: var(--accent); }
.r-waiting { color: var(--wait); }
.r-held, .r-stale, .r-unknown { color: var(--muted); }
.r-badly { color: var(--bad); }
.mk.plan { border-style: dashed; color: var(--muted); }

/* chip: a closed vocabulary */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border: 1px solid var(--line); border-radius: var(--r-tag); font: 400 14px/1.35 var(--mono); color: var(--muted); white-space: nowrap; }
.chip b { font-weight: 700; color: var(--ink); }

/* term popover: tap, click or focus; never hover alone */
.terms { display: flex; flex-wrap: wrap; gap: 0 10px; margin: -4px 0 6px; align-items: center; }
.termBtn { min-height: 44px; display: inline-flex; align-items: center; padding: 0; background: none; border: 0; color: inherit; font: inherit; cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }
/* a hint's chip: a 44 px target on a phone that adds nothing to its row's height */
.chipBtn { display: inline-flex; align-items: center; min-height: 44px; margin-block: -11px; padding: 0; background: none; border: 0; font: inherit; color: inherit; cursor: help; }
.chipBtn:hover .chip, .chipBtn[data-popup-open] .chip { border-color: var(--line-strong); color: var(--ink); }
.helpBtn { align-self: center; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; margin: -12px -10px; padding: 0; background: none; border: 0; color: var(--muted); cursor: help; }
.helpBtn span { width: 20px; height: 20px; border: 1px solid var(--line-strong); border-radius: 50%; font: 600 12px/18px var(--sans); text-align: center; }
.helpBtn:hover span, .helpBtn[data-popup-open] span { color: var(--ink); border-color: var(--ink); }
.pipsBtn { min-height: 44px; margin-block: -13px; align-items: center; padding: 0; background: none; border: 0; cursor: help; }
.br { flex-basis: 100%; height: 0; }
.slotLow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 10px; }
.slotLow .fold[data-open] { flex-basis: 100%; }
.popPos { z-index: 8; }
.pop p + p { margin-top: 6px; }
.pop { max-width: min(360px, calc(100cqw - 24px)); padding: 8px 12px; background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r); font: 400 14px/1.4 var(--sans); color: var(--ink); box-shadow: 0 2px 10px light-dark(rgba(37,30,24,.12), rgba(0,0,0,.45)); }
.dd .pop:focus-visible { outline: none; }

.main { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* the answer: the first question, stated */
.answer { display: flex; flex-direction: column; gap: 4px; }
.answer h1 { font: 600 24px/1.2 var(--serif); }
.answer.loud { background: var(--hl); border: 1px solid var(--hl-line); border-radius: var(--r-panel); padding: 12px 16px; }
.answer.loud p { color: var(--ink); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; background: var(--sunk); border: 2px solid var(--line-strong); border-radius: var(--r-card); }
.banner h2 { font-size: 18px; }
.bannerBody { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.panel { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 12px 12px 14px; min-width: 0; }
.panelHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 8px; }
.lede { font-size: var(--small); color: var(--muted); margin-bottom: 8px; }
.defect { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: var(--small); }

/* a person's list */
.needList { display: flex; flex-direction: column; gap: 0; }
.need { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
.need:first-child { border-top: 0; padding-top: 2px; }
.rowTop { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.rowTop .end { margin-left: auto; }
.tgt { font: 600 15px/1.3 var(--mono); }
.need .q { font-size: 15px; }
.act { flex: none; padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 10px; font: 600 13px/1.35 var(--sans); color: var(--ink); background: var(--sunk); }
.actDecide { border-color: var(--focus); }
.actAuthorize { border-color: var(--hl-line); background: var(--hl); }
.actInvestigate { border-color: var(--bad); }
.actReply { border-color: var(--wait); }
.actMerge { border-color: var(--accent); background: var(--accent-soft); }
.need .rec strong { font-weight: 700; }
.personFilter { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); }
.personFilter select { min-height: var(--tap); font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-tag); }
.foldPanel .options ul, .foldPanel .steps ul { margin: 2px 0 8px; padding-left: 18px; }
.foldPanel .steps ul { list-style: none; padding-left: 0; }
.foldPanel .steps input { flex: none; width: 20px; height: var(--tap); margin: 0; }
.foldPanel .steps label { display: inline-flex; gap: 6px; align-items: center; min-height: var(--tap); }
.groupHead { padding-top: 10px; margin-top: 4px; border-top: 1px solid var(--line-strong); color: var(--muted); font: 600 14px/1.3 var(--sans); }
.groupHead.first { border-top: 0; margin-top: 0; padding-top: 0; }
.need.rest, .groupHead.rest { display: none; }
.needList.all .need.rest { display: flex; }
.needList.all .groupHead.rest { display: block; }
.moreBtn { min-height: 44px; margin-top: 6px; width: 100%; background: transparent; color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r); font: 400 15px var(--sans); cursor: pointer; }
.moreRow { display: flex; gap: 8px; margin-top: 6px; }
.panelHead .headMore { width: auto; margin: 0 0 0 auto; min-height: 44px; padding: 0 12px; font-size: var(--small); }
.moreRow .moreBtn { margin-top: 0; }
.goto { display: flex; flex-wrap: wrap; gap: 0 14px; align-items: center; font-size: var(--small); }
.goto a { display: inline-flex; align-items: center; min-height: 44px; }
.goto .noLink { color: var(--muted); padding-block: 4px; }
.fold summary, .foldBtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0; background: none; border: 0; cursor: pointer; font: inherit; font-size: var(--small); color: var(--muted); text-align: left; }
.quote { margin: 4px 0 6px; padding: 8px 10px; background: var(--sunk); border-radius: var(--r); font: 400 14px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.path { user-select: all; overflow-wrap: anywhere; }

/* the whole decision: Markdown a drive wrote, so its text is shown and nothing in it runs */
.quote.md { font-family: var(--sans); white-space: normal; }
.quote.md h1, .quote.md h2, .quote.md h3, .quote.md h4, .quote.md h5, .quote.md h6 { margin: 8px 0 2px; font: 600 14px/1.3 var(--sans); }
.quote.md.lines { white-space: pre-line; }
.quote.md > :first-child { margin-top: 0; }
.quote.md p { margin: 0 0 4px; }
.quote.md ul, .quote.md ol { margin: 0 0 4px; padding-inline-start: 20px; }
.quote.md code { font-family: var(--mono); font-size: 13px; }
.quote.md pre { margin: 0 0 4px; white-space: pre-wrap; font-family: var(--mono); }
.quote.md blockquote { margin: 0 0 4px; padding-inline-start: 10px; border-inline-start: 2px solid var(--line-strong); }
.quote.md table { border-collapse: collapse; margin: 0 0 4px; }
.quote.md th, .quote.md td { padding: 2px 6px; border: 1px solid var(--line); text-align: left; }

/* Copy icons write only to the reader's clipboard. */
.copy { flex: none; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 56px; padding: 2px 8px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-tag); font: 400 14px/1.2 var(--sans); cursor: pointer; white-space: nowrap; }
.copy:hover { border-color: var(--line-strong); }
.copyRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 6px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.clip, .say { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; overflow: hidden; pointer-events: none; }
.goto .fold { order: 9; }
.goto .fold[data-open] { flex-basis: 100%; }
.kv dd { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.kv dd span { min-width: 0; overflow-wrap: anywhere; user-select: text; }
.qTools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }

/* reply drafts: kept in this browser, joined to their keys by Copy */
.replies { order: 10; flex-basis: 100%; display: flex; flex-direction: column; gap: 6px; margin: 2px 0 6px; }
.reply { display: flex; flex-direction: column; gap: 2px; }
.reply textarea { width: 100%; min-height: 44px; padding: 6px 8px; background: var(--card); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r); font: 400 15px/1.4 var(--sans); resize: vertical; }

/* an account row: the row is the cap, each cell one slot */
.acct { padding: 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.acct:first-child { border-top: 0; padding-top: 0; }
.acctHead { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.acctName { font-weight: 600; }
.acctHead .end { margin-left: auto; }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 10px; height: 10px; border: 1px solid var(--line-strong); border-radius: 2px; }
.pip.on { background: var(--ink); border-color: var(--ink); }
.slots { display: flex; flex-direction: column; gap: 6px; }
.slot { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.slotFact { font-size: var(--small); line-height: 1.3; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; margin: 0 0 6px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv dd.prose { font-family: var(--sans); }
.wallLine { font-size: var(--small); }

/* queue */
.qGroup { padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--line); }
.qGroup.first { border-top: 0; margin-top: 0; padding-top: 0; }
.qItem { display: flex; flex-direction: column; gap: 1px; padding: 5px 0; }
.qItem.rest { display: none; }
.qList.all .qItem.rest { display: flex; }
.ghost { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line-strong); color: var(--muted); font-size: var(--small); }

/* the tick strip: one row per recent tick, its own phases as a bar beside the longest shown */
.dd { --ph-start: var(--line-strong); --ph-read: var(--accent); --ph-wait: var(--wait); --ph-act: var(--hl-line); --ph-close: var(--muted); }
.ph-start { background: var(--ph-start); }
.ph-repos, .ph-observe { background: var(--ph-read); }
.ph-wait { background: var(--ph-wait); }
.ph-act { background: var(--ph-act); }
.ph-close { background: var(--ph-close); }
.tkKey { display: flex; flex-wrap: wrap; gap: 0 12px; margin: -4px 0 4px; }
.tkKeyBtn { gap: 5px; text-decoration: none; }
.tkSw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.tkList { list-style: none; margin: 0; padding: 0; }
.tkRow { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.tkRow:first-child { border-top: 0; }
.tkRow.rest { display: none; }
.tkList.all .tkRow.rest { display: grid; }
.tkAt { color: var(--muted); }
.tkTook { font-weight: 600; white-space: nowrap; }
.tkBar { display: block; min-width: 0; height: 10px; }
.tkBarIn { display: flex; height: 100%; min-width: 4px; border-radius: 2px; overflow: hidden; gap: 1px; }
.tkSeg { flex: 0 0 auto; flex-basis: 0; min-width: 0; }
.tkBarNone { min-width: 0; }
.tkSlow, .tkMarks, .tkDetail { grid-column: 1 / -1; min-width: 0; }
.tkSlow { overflow-wrap: anywhere; }
.tkSlow:empty, .tkMarks:empty, .tkBudget:empty { display: none; }
.tkMarks { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; }
.tkMark.r-badly, .tkMark.r-waiting { border-color: currentColor; font-weight: 600; }
.tkMark.r-badly { color: var(--bad); }
.tkMark.r-waiting { color: var(--wait); }
.tkBudget, .tkScope { white-space: nowrap; }
.tkBudget { grid-column: 1 / 3; }
.tkScope { grid-column: 3; }
.tkDetail { display: block; }
.tkKv { margin-top: 2px; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.tkKv dt { overflow-wrap: anywhere; }

/* window and log */
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.segClasses { margin-top: 6px; }
.fbtn { min-height: 44px; padding: 4px 10px; background: var(--card); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-tag); font: 400 14px/1.2 var(--sans); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.fbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.fbtn[aria-pressed="true"] .mk { color: var(--bg); border-color: var(--bg); }
.fbtn[aria-pressed="true"] .mk.r-needs { background: var(--bg); color: var(--ink); }
.fbtn[aria-pressed="true"] .ct { color: var(--bg); }
.fbtn:disabled { cursor: not-allowed; border-style: dotted; color: var(--muted); }
.fbtn .ct { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 8px; margin-top: 10px; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--muted); min-width: 0; }
.selBtn, .fields input { width: 100%; min-height: 44px; padding: 4px 8px; background: var(--card); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r); font: 400 15px var(--sans); }
.selBtn { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-inline: 12px 2px; text-align: left; cursor: default; }
.selVal { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selIcon { display: flex; flex: none; }
.selIcon svg { display: block; }
.selBtn:disabled, .selBtn[data-disabled], .fields input:disabled { cursor: not-allowed; border-style: dotted; color: var(--muted); }
.selPos { z-index: 8; }
.selPop { min-width: var(--anchor-width); background: var(--card); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 2px 10px light-dark(rgba(37,30,24,.12), rgba(0,0,0,.45)); font: 400 15px var(--sans); }
.selList { max-height: min(320px, var(--available-height)); overflow-y: auto; padding: 4px; }
.selItem { display: flex; align-items: center; min-height: 44px; padding: 4px 8px; border-radius: var(--r-tag); cursor: default; overflow-wrap: anywhere; }
.selItem[data-highlighted] { background: var(--accent-soft); }
.selItem[data-selected] { font-weight: 600; }
.active { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: var(--small); }
.linkLine { margin-top: 6px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.meta { margin: 10px 0 2px; font-size: var(--small); color: var(--muted); }
.recur { margin-top: 10px; padding: 8px 10px; background: var(--sunk); border-radius: var(--r); display: flex; flex-direction: column; gap: 2px; }
.recurRow { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; min-height: 44px; }
.rows { position: relative; margin-top: 4px; }
.row { position: absolute; top: 0; left: 0; width: 100%; border-top: 1px solid var(--line); }
.rowSum { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; width: 100%; padding: 8px 2px; min-height: 44px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.cell-cls { grid-column: 1; grid-row: 1; min-width: 0; font-weight: 600; font-size: 14px; }
.cell-time { grid-column: 2; grid-row: 1; color: var(--muted); font-size: 14px; }
.cell-tgt { grid-column: 1 / -1; font-size: 14px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; min-width: 0; }
.cell-acct, .cell-len { font-size: 14px; color: var(--muted); }
.cell-acct { grid-column: 1; }
.cell-len { grid-column: 2; }
.cell-why { grid-column: 1 / -1; font-size: 14px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rowBody { padding: 0 2px 10px; }
.foot { max-width: 1200px; margin: 0 auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 12px; }
.legend { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.lgRole { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.lgRole .set { color: var(--muted); }
.dd .lgMeta { margin-top: 4px; }
.colophon { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px; }
.colophon a { display: inline-flex; align-items: center; min-height: 44px; }
.helpText { max-width: 72ch; margin-top: 6px; font-size: 15px; }
.helpText p + p { margin-top: 8px; }
.dd .helpHead { margin: 12px 0 4px; }
.emptyLine { color: var(--muted); font-size: var(--small); }
.dd .refusalBody { margin-top: 6px; }

@container page (min-width: 900px) {
  .dd { --small: 13px; }
  .m { font-size: 0.93em; }
  .mk { font-size: 12px; }
  a.tgt { min-height: 0; }
  .chip { font-size: 13px; }
  .stripIn { flex-wrap: nowrap; padding: 0 24px; min-height: 48px; }
  .brand span { display: inline; }
  .views { order: 0; flex-basis: auto; margin: 0 0 0 12px; align-self: stretch; }
  .viewTab { min-height: 48px; font-size: 14px; }
  .fresh { min-height: 32px; font-size: 13px; }
  .themeBtn { min-height: 30px; min-width: 0; font-size: 13px; }
  .themeWord { display: inline; }
  .helpBtn { min-width: 24px; min-height: 24px; margin: -2px 0; }
  .pipsBtn { min-height: 22px; margin-block: 0; }
  .chipBtn { min-height: 0; margin-block: 0; }
  .panelHead .headMore { min-height: 26px; padding: 0 8px; font-size: 13px; }
  .reply textarea { min-height: 32px; font-size: 14px; }
  .main { padding: 14px 24px; gap: 12px; }
  .foot { padding-inline: 24px; }
  .answer { flex-direction: row; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .answer.loud { padding: 8px 14px; }
  .answer h1 { font-size: 22px; }
  .need { padding: 5px 0; gap: 1px; }
  .br { display: none; }
  .need .rowTop .end { order: 9; }
  .termBtn { min-height: 22px; }
  .terms { margin: -6px 0 2px; }
  .acct { padding: 4px 0; gap: 3px; }
  .slot { padding: 4px 8px; }
  .fold summary, .foldBtn { min-height: 22px; }
  .qItem { padding: 3px 0; }
  .qGroup { padding-top: 5px; margin-top: 5px; }
  .qItem .sm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ghost { margin-top: 5px; padding-top: 5px; }
  .panel { padding: 10px 12px; }
  .panelHead { margin-bottom: 4px; }
  .need .q, .tgt { font-size: 14px; }
  .need.rest, .qItem.rest { display: flex; }
  .groupHead.rest { display: block; }
  .moreBtn { display: none; }
  .moreBtn.deskToo { display: block; }
  .goto a, .fold summary, .foldBtn, .colophon a { min-height: 24px; }
  .copy { min-height: 22px; min-width: 0; padding: 0 6px; font-size: 13px; }
  .kv dd { justify-content: flex-start; }
  .fbtn { min-height: 26px; padding: 1px 7px; font-size: 13px; }
  .winSeg { margin-left: auto; }
  .fields { grid-template-columns: 1.1fr 0.8fr 0.9fr 1.3fr 1.2fr 1.2fr; }
  .selBtn, .fields input { min-height: 32px; font-size: 14px; }
  .selItem { min-height: 30px; font-size: 14px; }
  .recurRow { min-height: 30px; }
  .rowSum { grid-template-columns: 92px 170px minmax(0, 1fr) 136px 176px; align-items: baseline; padding: 5px 2px; min-height: 30px; }
  .cell-time { grid-column: 1; grid-row: 1; font-size: 13px; }
  .cell-cls { grid-column: 2; grid-row: 1; font-size: 13px; }
  .cell-tgt { grid-column: 3; grid-row: 1; font-size: 13px; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
  .cell-acct { grid-column: 4; grid-row: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell-len { grid-column: 5; grid-row: 1; font-size: 13px; }
  .cell-why { grid-column: 2 / -1; grid-row: 2; font-size: 13px; -webkit-line-clamp: 1; }
  .colophon { font-size: 13px; }
  .lgRole { font-size: 13px; }
  .tkRow { grid-template-columns: 44px 84px minmax(80px, 1fr) minmax(0, 1.6fr) 104px 128px 140px 64px; padding: 3px 0; gap: 0 12px; }
  .tkSlow, .tkMarks, .tkBudget, .tkScope, .tkDetail { grid-column: auto; }
  .tkSlow:empty, .tkMarks:empty, .tkBudget:empty { display: block; }
  .tkSlow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tkBudget, .tkScope { overflow: hidden; text-overflow: ellipsis; }
  .tkDetail { justify-self: end; }
  .tkDetail:has(.fold[data-open]) { grid-column: 1 / -1; justify-self: stretch; }
  .tkKeyBtn { min-height: 24px; }
}

/* Shared PR identity and compact, accessible icon controls. */
.prIdentity { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.prState { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; min-height: 24px; }
.prState.tone-go, .prLabel.tone-go { color: var(--accent); }
.prState.tone-wait, .prLabel.tone-wait { color: var(--hl-line); }
.prState.tone-needs, .prLabel.tone-needs { color: var(--bad); }
.prState.tone-done, .prLabel.tone-done { color: var(--wait); }
.prState.tone-bad, .prLabel.tone-bad { color: var(--bad); }
.prState.tone-quiet, .prLabel.tone-quiet { color: var(--muted); }
.prState { min-width: 24px; justify-content: center; }
.prLabel { display: flex; align-items: center; gap: 5px; font-weight: 600; margin: 4px 0; }
.prFacts { margin: 0 0 6px; padding-left: 18px; font-size: var(--small); }
.prFacts:empty { display: none; }
.prIdentity .copy { min-width: 24px; }
.copy svg { flex: none; }
.disclosure { justify-content: center; min-width: 28px; border: 1px solid var(--line); border-radius: var(--r-tag); color: var(--ink); }
.disclosure svg { transition: transform .15s; }
.disclosure[aria-expanded="true"] svg { transform: rotate(90deg); }
.fold { display: contents; }
.foldPanel { flex-basis: 100%; min-width: 0; }
.rowSum { cursor: default; position: relative; padding-right: 32px; }
.rowExpand { position: absolute; right: 0; top: 4px; }
@media (max-width: 899px) {
  .prState, a.m.sm.mut { min-height: 44px; display: inline-flex; align-items: center; }
}
@media (max-width: 899px) {
  .kv a, .pop a { min-height: 44px; display: inline-flex; align-items: center; overflow-wrap: anywhere; }
}
.followupSummary { display: flex; align-items: baseline; gap: 6px; color: var(--muted); }
.followupSummary svg, .followupBadge svg { flex: none; align-self: center; }
.followupBadge { display: inline-flex; align-items: center; gap: 4px; white-space: normal; }

/* the merge flash, the view's filter, the palette and the keys */
.flash { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 14px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--r-card); }
.flashText { flex: 1 1 16em; font-weight: 600; }
.dd .flashGo { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
.flashGo kbd { display: none; }
.flashOff { min-height: 44px; padding: 0 10px; background: transparent; color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-tag); font: 400 14px/1 var(--sans); cursor: pointer; }
.viewFilter { display: flex; align-items: center; gap: 10px; }
.viewFilter input { flex: 1 1 auto; max-width: 420px; min-height: 44px; padding: 4px 10px; background: var(--card); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r); font: 400 15px var(--sans); }
.dd kbd { display: inline-block; min-width: 1.4em; padding: 0 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: var(--r-tag); background: var(--sunk); color: var(--ink); font: 400 12px/1.5 var(--mono); text-align: center; }
[data-card] { scroll-margin: 112px 0 72px; }
.dd [data-card][hidden] { display: none !important; }
.main.filtering .need.rest, .main.filtering .qItem.rest { display: flex; }
.main.filtering .groupHead.rest { display: block; }
/* the card j and k rest on: a tinted fill reaching into the gutter, an accent bar, and the bar that names its keys */
:where([data-card]) { position: relative; }
.dd [data-card]:focus { outline: none; }
.dd [data-card]:is(:focus-visible, :has(:focus-visible)) { --bleed: 8px; background: var(--focus-soft); box-shadow: calc(-1 * var(--bleed)) 0 0 var(--focus-soft), var(--bleed) 0 0 var(--focus-soft); }
.dd [data-card]:is(:focus-visible, :has(:focus-visible))::before { content: ""; position: absolute; inset-block: 0; left: calc(-1 * var(--bleed)); width: 4px; border-radius: 2px; background: var(--focus); }
.dd .slot:is(:focus-visible, :has(:focus-visible)) { --bleed: 0px; border-color: var(--focus); box-shadow: none; }
@media (forced-colors: active) {
  .dd [data-card]:is(:focus-visible, :has(:focus-visible)) { outline: 2px solid Highlight; outline-offset: 2px; }
}
.keyBar { display: none; }
@media (hover: hover) and (pointer: fine) {
  .keyBar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; position: fixed; left: 16px; bottom: 16px; z-index: 10; max-width: min(640px, calc(100vw - 32px)); padding: 6px 12px; background: var(--card); color: var(--ink); border: 1px solid var(--focus); border-radius: var(--r); box-shadow: 0 2px 10px light-dark(rgba(37,30,24,.12), rgba(0,0,0,.45)); font: 400 13px/1.5 var(--sans); pointer-events: none; }
  .barTarget { font-weight: 600; }
}
.mTitle { display: block; }
.mCommand { overflow-wrap: anywhere; user-select: all; }
.mConds { margin: 4px 0 6px; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.mNotes { margin-top: 8px; padding-left: 18px; }
.mLane + .mLane .groupHead { margin-top: 8px; }
.keyList dt { white-space: nowrap; }
.keyToast { position: fixed; right: 16px; bottom: 16px; z-index: 20; max-width: min(520px, calc(100vw - 32px)); padding: 6px 12px; background: var(--ink); color: var(--bg); border-radius: var(--r); overflow-wrap: anywhere; pointer-events: none; }
.paletteBack { position: fixed; inset: 0; z-index: 30; display: flex; justify-content: center; align-items: flex-start; padding: 64px 12px 12px; background: light-dark(rgba(37,30,24,.28), rgba(0,0,0,.55)); }
.palette { width: min(560px, 100%); max-height: calc(100vh - 96px); display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r-card); box-shadow: 0 6px 24px light-dark(rgba(37,30,24,.18), rgba(0,0,0,.6)); }
.paletteField { width: 100%; min-height: 44px; padding: 4px 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r); font: 400 16px var(--sans); }
.paletteList { margin: 0; padding: 0; list-style: none; overflow-y: auto; }
.paletteOpt { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 4px 8px; border-radius: var(--r-tag); cursor: pointer; }
.paletteOpt.on { background: var(--sunk); outline: 1px solid var(--line-strong); }
.paletteLabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paletteNone { padding: 4px 8px; }
@container page (min-width: 900px) {
  .flash { padding: 6px 14px; }
  .dd .flashGo, .flashOff { min-height: 30px; }
  .dd .flashGo kbd { display: inline-block; }
  .viewFilter input { min-height: 32px; font-size: 14px; }
  .paletteOpt { min-height: 30px; }
}
