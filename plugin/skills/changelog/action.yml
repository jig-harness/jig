# The `changelog` skill as a composite action, for CI, where no plugin is
# installed: GitHub fetches this directory at the commit a workflow pins, so
# the scripts and their plugin version arrive with no separate checkout and
# no token. It sets up Bun at the version Jig tests with, then runs one
# command of the skill on the repository the job checked out:
#
#   check    the branch check of a pull request (scripts/check.ts); needs the
#            whole history (actions/checkout with fetch-depth: 0)
#   release  the release step (scripts/release.ts) on the integration branch,
#            `after_version` included, then commits what it wrote and writes
#            that commit to a git bundle for a later job to push. Use it only
#            in a job that holds no key: `after_version` is the repository's
#            own command, and the release lets it run in CI only here
#   tag      the tag plan (scripts/tag.ts): which released versions can be
#            tagged now, the `ready` list a later job tags
#
# It never pushes, tags or opens a pull request: the workflow template
# (templates/github/changelog.yml) does that in jobs that run nothing from the
# repository. Bun reads its settings from the directory it starts in and
# that directory's parents (bunfig.toml, .env files, and a tsconfig.json whose
# `paths` can even replace the script it was asked to run), so it never starts
# in the checkout: each script runs from a directory of the runner's own
# temporary folder holding an empty bunfig.toml and an empty tsconfig.json,
# with --config naming that bunfig.toml and .env files off, and is given the
# checkout by its absolute path (--root). Git runs on the checkout as data.
# So `check` and `tag` run only this action's code, and a tag job that holds
# a token with Actions write runs nothing the repository wrote.
name: jig changelog
description: Change notes in CI with Jig's changelog skill — the branch check, the release step and the tag plan.

inputs:
  command:
    description: "The command to run: check, release or tag."
    required: true
  root:
    description: The repository's checkout, relative to the workspace.
    required: false
    default: "."
  base:
    description: "check: the revision the branch is compared with; by default the base of the pull request that started the job."
    required: false
    default: ""
  head-ref:
    description: "check: the branch the change comes from; by default the head of the pull request that started the job."
    required: false
    default: ""
  rerun:
    description: "tag: run the cancelled required checks' workflow runs again, once (true or false); needs a token with Actions write."
    required: false
    default: "false"
  token:
    description: "check and tag: the token the hosting service is read with (and, for tag with rerun, re-runs checks with)."
    required: false
    default: ${{ github.token }}
  git-user-name:
    description: "release: the name the release commit is authored and committed by."
    required: false
    default: github-actions[bot]
  git-user-email:
    description: "release: the email the release commit is authored and committed by."
    required: false
    default: 41898282+github-actions[bot]@users.noreply.github.com

outputs:
  changed:
    description: "release: true when the release step wrote something and the commit is in the bundle."
    value: ${{ steps.release.outputs.changed }}
  version:
    description: "release: the version released; empty when the notes went under Unreleased or nothing was written."
    value: ${{ steps.release.outputs.version }}
  notes:
    description: "release: how many change notes the release wrote in."
    value: ${{ steps.release.outputs.notes }}
  start:
    description: "release: the commit the release step ran on (the integration branch's tip it checked out)."
    value: ${{ steps.release.outputs.start }}
  commit:
    description: "release: the release commit, a child of start; empty when nothing changed."
    value: ${{ steps.release.outputs.commit }}
  bundle:
    description: "release: the path of the git bundle holding start..commit; empty when nothing changed."
    value: ${{ steps.release.outputs.bundle }}
  push:
    description: "release: changelog.release.push, how the release reaches the integration branch (direct or pull-request)."
    value: ${{ steps.release.outputs.push }}
  release-branch:
    description: "release: changelog.release.branch, the branch a release pull request comes from."
    value: ${{ steps.release.outputs.release-branch }}
  plan:
    description: "tag: the path of the plan tag.ts printed as JSON."
    value: ${{ steps.tag.outputs.plan }}
  ready:
    description: "tag: the plan's ready list as compact JSON, [{tag, commit, message}]; also set when a version failed."
    value: ${{ steps.tag.outputs.ready }}
  failed:
    description: "tag: true when a releasing commit failed its required checks; the job that uses the action fails itself after passing ready on."
    value: ${{ steps.tag.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Refuse an unknown command
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        RERUN: ${{ inputs.rerun }}
      run: |
        case "$COMMAND" in
          check | release | tag) ;;
          *)
            echo "::error::jig changelog: command must be check, release or tag, not '$COMMAND'"
            exit 2
            ;;
        esac
        case "$RERUN" in
          true | false) ;;
          *)
            echo "::error::jig changelog: rerun must be true or false, not '$RERUN'"
            exit 2
            ;;
        esac
        # The directory Bun starts in: its settings come from these empty
        # files, never from the checkout, which the scripts read through --root.
        bun_dir="$RUNNER_TEMP/jig-changelog-bun"
        rm -rf "$bun_dir"
        mkdir -p "$bun_dir"
        : > "$bun_dir/bunfig.toml"
        echo '{}' > "$bun_dir/tsconfig.json"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # The Bun Jig tests with: mise.toml's pin, which `bun run pins`
        # holds this to (.config/toolchain-pins.yaml).
        bun-version: 1.4.3
    - name: Check the branch's change notes
      if: inputs.command == 'check'
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        BASE: ${{ inputs.base }}
        HEAD_REF: ${{ inputs.head-ref }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        args=(--root "$PWD")
        if [ -n "$BASE" ]; then args+=(--base "$BASE"); fi
        if [ -n "$HEAD_REF" ]; then args+=(--head-ref "$HEAD_REF"); fi
        cd "$RUNNER_TEMP/jig-changelog-bun" || exit 2
        bun --no-env-file --config=./bunfig.toml \
          "$GITHUB_ACTION_PATH/scripts/check.ts" "${args[@]}"
    - name: Write and commit the change notes
      id: release
      if: inputs.command == 'release'
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        # This job holds no key, which is what lets the repository's
        # after_version run in it (scripts/release.ts).
        JIG_AFTER_VERSION_IN_CI: "1"
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail
        # The commit takes everything the release step leaves in the tree,
        # so the tree must hold nothing else when it starts.
        if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
          echo "::error::jig changelog: the checkout has changes before the release step runs; release from a clean checkout"
          git status --short
          exit 1
        fi
        start=$(git rev-parse HEAD)
        report="$RUNNER_TEMP/jig-changelog-release.json"
        root=$PWD
        (cd "$RUNNER_TEMP/jig-changelog-bun" &&
          bun --no-env-file --config=./bunfig.toml \
            "$GITHUB_ACTION_PATH/scripts/release.ts" --root "$root" --json) > "$report"
        cat "$report"
        notes=$(jq '.notes | length' "$report")
        version=$(jq -r '.version // empty' "$report")
        changelog=$(jq -r '.changelog // empty' "$report")
        {
          echo "start=$start"
          echo "notes=$notes"
          echo "version=$version"
          echo "push=$(jq -r '.release.push // empty' "$report")"
          echo "release-branch=$(jq -r '.release.branch // empty' "$report")"
        } >> "$GITHUB_OUTPUT"
        if [ "$notes" = 0 ]; then
          echo "no change notes to write"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Everything the release step wrote: the notes it deleted, the
        # changelog, the version files, the files whose placeholder it filled
        # in and what after_version changed.
        git add -A
        # The identity is the inputs', whatever the runner's git settings say.
        export GIT_AUTHOR_NAME="$GIT_USER_NAME" GIT_AUTHOR_EMAIL="$GIT_USER_EMAIL"
        export GIT_COMMITTER_NAME="$GIT_USER_NAME" GIT_COMMITTER_EMAIL="$GIT_USER_EMAIL"
        if [ -n "$version" ]; then
          git commit -q --no-verify -m "chore(release): $version" \
            -m "Writes $notes change note(s) into $changelog and moves the version to $version."
        else
          git commit -q --no-verify -m "docs(changelog): write $notes change note(s) under Unreleased"
        fi
        bundle="$RUNNER_TEMP/jig-changelog-release.bundle"
        git bundle create -q "$bundle" "$start..HEAD"
        {
          echo "changed=true"
          echo "commit=$(git rev-parse HEAD)"
          echo "bundle=$bundle"
        } >> "$GITHUB_OUTPUT"
    - name: Plan the tags
      id: tag
      if: inputs.command == 'tag'
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        RERUN: ${{ inputs.rerun }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -uo pipefail
        args=(--root "$PWD" --json)
        if [ "$RERUN" = true ]; then args+=(--rerun); fi
        plan="$RUNNER_TEMP/jig-changelog-tag.json"
        # The token reaches git for `git ls-remote origin` as this one
        # command's configuration, never written into the checkout's
        # .git/config; the empty value first drops any header the checkout
        # step persisted, so git sends one.
        if [ -n "$GH_TOKEN" ]; then
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL:-https://github.com}/.extraheader"
          export GIT_CONFIG_VALUE_0=""
          export GIT_CONFIG_KEY_1="$GIT_CONFIG_KEY_0"
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $basic"
        fi
        status=0
        cd "$RUNNER_TEMP/jig-changelog-bun" || exit 2
        bun --no-env-file --config=./bunfig.toml \
          "$GITHUB_ACTION_PATH/scripts/tag.ts" "${args[@]}" > "$plan" || status=$?
        cat "$plan"
        # 1 is a releasing commit that failed its checks: the plan is whole,
        # and its ready versions are still tagged. Anything else is an error.
        if [ "$status" != 0 ] && [ "$status" != 1 ]; then exit "$status"; fi
        ready=$(jq -c '.ready // []' "$plan") || exit 2
        {
          echo "plan=$plan"
          echo "ready=$ready"
          if [ "$status" = 1 ]; then echo "failed=true"; else echo "failed=false"; fi
        } >> "$GITHUB_OUTPUT"
