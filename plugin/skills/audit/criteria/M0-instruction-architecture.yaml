# Machine-evaluable criteria for M0 (instruction architecture).
# Schema: README.md in this folder. Each criterion is an
# observable repo fact, scored absent -> convention -> mechanical.
#
# No probe on the instruction file or the glossary: an equivalent may carry
# any name, so no file search can rule either out. The CI list is M1's
# ci-runs-gates-on-pr list; an anchor cannot reach across files, so every
# criteria file that carries it keeps its copy in step with M1's.
module: M0
name: instruction-architecture
purpose: >-
  Agents and new contributors find one set of instructions, in one vocabulary,
  close to where they work, instead of duplicated files that drift apart.
criteria:
  - id: universal-instruction-file
    level: lite
    requires: convention
    statement: >-
      A vendor-neutral universal instruction file (AGENTS.md or equivalent)
      exists at the repo root.
    observe:
      - "AGENTS.md (or documented equivalent) exists at repo root"
      - "file is not tool-specific (readable truth for every agent runtime)"

  - id: instruction-file-stays-small
    level: lite
    requires: convention
    statement: >-
      The universal instruction file stays small (on the order of 150 lines):
      what every session needs, with longer practice detail linked from it
      rather than written into it.
    observe:
      - "the universal instruction file is on the order of 150 lines or less"
      - "long content (full workflows, gate documentation, background) lives in documents the file links to"
      - "where shrinking the file means moving content the repository's own rules guard (a trust posture, a safety rule), a recommendation names that tension"
    since: next

  - id: gates-and-guardrails-listed
    level: lite
    requires: convention
    statement: >-
      The universal instruction file lists the quality gates (runnable
      commands) and the critical guardrails.
    observe:
      - "instruction file has a quality-gates section with runnable commands"
      - "instruction file has a guardrails section naming the failures prevented"

  - id: glossary-exists
    level: lite
    requires: convention
    statement: >-
      A one-page domain glossary exists with canonical terms and explicit
      avoid-aliases, and the universal instruction file points to it.
    observe:
      - "GLOSSARY.md or CONTEXT.md exists"
      - "entries carry explicit 'avoid' aliases"
      - "universal instruction file links to it"

  - id: tool-deltas-are-pointers
    level: standard
    requires: convention
    statement: >-
      Every tool-specific instruction file (CLAUDE.md, .cursor rules,
      copilot-instructions.md, ...) carries only runtime-specific content
      and brings in the universal file, maintaining none of it by hand,
      through the runtime's import or its native read of the universal file.
      Where a runtime has neither, the delta it needs is generated from it and
      checked for freshness, or the gap is recorded in the load model; a
      pointer line alone is not delivery.
    observe:
      - "each tool-specific file imports the universal file (Claude Code: an @AGENTS.md line), or its runtime reads the universal file natively"
      - "where a runtime has neither, its delta is generated from the universal file, or the gap is recorded where the load model is; a pointer line alone does not count"
      - "no rule text is maintained by hand in both the universal file and a tool delta; a delta generated from the universal file and checked for freshness is a projection of it, not a copy"
      - "before recommending an import, verify what the runtime already loads natively (the load model, or a session's loaded instructions): an import of a file the runtime already loads loads it twice"

  - id: per-directory-instructions
    level: standard
    requires: convention
    statement: >-
      Directories whose conventions differ from the repo default carry
      their own nested instruction file, and the universal file states that
      a nested file extends its parent and never contradicts it.
    observe:
      - "nested instruction files exist where apps/packages diverge"
      - "universal file states that nested files extend it and that a contradiction is a bug"

  - id: conditional-rules-documented
    level: standard
    requires: convention
    statement: >-
      If a conditional-rules directory exists, its README documents the
      loading semantics — path-frontmatter rules load on match,
      frontmatter-less rules always load — and each rule is scoped to the
      narrowest paths that cover it.
    observe:
      - "rules directory contains a README stating the loading model"
      - "rules carry path frontmatter unless deliberately universal"

  - id: load-model-recorded
    level: standard
    requires: convention
    statement: >-
      What each agent runtime the team uses actually loads is recorded in one
      place, with the date it was observed and a procedure to check it again,
      and which instruction file wins when two disagree is written as an
      authoring convention, not assumed runtime behaviour.
    observe:
      - "one document records which instruction files each runtime loads, and when"
      - "each observation carries a date (and the runtime version where known)"
      - "a procedure to re-check the observations is written beside them"
      - "precedence between instruction files is stated as a convention (a nested file extends its parent; a contradiction is a bug)"
    since: 0.22.0

  - id: dispositions-with-flip-conditions
    level: standard
    requires: convention
    statement: >-
      Behavioral defaults (dispositions) are written down, and every
      disposition states the condition under which it flips.
    observe:
      - "a dispositions document exists and is linked from the universal file"
      - "every disposition entry contains an explicit flip condition"

  - id: model-pins-are-family-aliases
    level: standard
    requires: mechanical
    statement: >-
      Every model tier an agent or skill declares lives in its metadata (or,
      for a judgment pass inside a skill, in that skill's configuration) as a
      family alias, never a versioned model id (where the runtime has no
      family aliases, the vendor's most general model name, or one central
      name mapped to a release in a single place), a CI check over that
      metadata enforces it, and any committed roster of the assignments is
      generated from the metadata and drift-checked (expected-absent for a
      repository whose agents and skills pin no model, in metadata or at
      invocation).
    observe:
      - "every model: value in agent and skill definitions that pins a model is a bare family alias (Claude Code: fable, opus, sonnet, haiku), not a versioned id with a date or release number; an inheritance selector (Claude Code: inherit) or an absent field pins nothing and is not a pin"
      - "where a runtime has no family aliases, the pin is the vendor's undated, most general model name, or one central name the repository maps to a release in a single place; no agent or skill carries a release of its own"
      - "a model setting in a skill's configuration for a judgment pass follows the same rule"
      - "no skill, prompt or script assigns a model at invocation time (Claude Code: the model parameter of a subagent call, a --model flag on a spawned CLI) other than from that metadata; such an override outranks the definition's own model: and is a declaration point outside it"
      - "a CI check reads that metadata and accepts the runtime's inheritance selector as unpinned, and rejects an unknown model family, a versioned id used as a pin, and a declared cost tier that contradicts the model; it runs whether or not a roster is kept"
      - "a roster of model assignments, where one is committed, is generated from the metadata and a CI check fails when it drifts; no per-agent assignment is kept by hand in prose"
      - "every Judgment-tier assignment records its A/B baseline and its admission next to it"
      - "a repository whose agents and skills pin no model, in metadata or at invocation, meets it"
    since: 0.40.0

  - id: instruction-freshness-checked
    level: strict
    requires: mechanical
    statement: >-
      Countable facts and referenced paths in instruction files are
      verified against reality by a CI check that fails on drift.
    observe:
      - "a CI job re-derives countable facts stated in instruction files"
      - "a CI job (or link checker) verifies referenced paths exist"
    probe:
      mechanical:
        files: &ci-config
          - ".github/workflows/*.yml"
          - ".github/workflows/*.yaml"
          - ".forgejo/workflows/*"
          - ".gitea/workflows/*"
          - ".gitlab-ci.yml"
          - ".circleci/config.yml"
          - ".circleci/config.yaml"
          - "azure-pipelines.yml"
          - "azure-pipelines.yaml"
          - ".azure-pipelines/**"
          - ".pipelines/**"
          - "bitbucket-pipelines.yml"
          - "Jenkinsfile"
          - "**/Jenkinsfile"
          - "**/*.jenkinsfile"
          - ".buildkite/**"
          - ".drone.yml"
          - ".drone.yaml"
          - ".woodpecker.yml"
          - ".woodpecker.yaml"
          - ".woodpecker/**"
          - ".travis.yml"
          - ".cirrus.yml"
          - ".cirrus.star"
          - "appveyor.yml"
          - ".appveyor.yml"
          - ".semaphore/**"
          - ".teamcity/**"
          - "bitrise.yml"
          - "codemagic.yaml"
          - "codefresh.yml"
          - "cloudbuild.yaml"
          - "cloudbuild.yml"
          - "buildspec.yml"
          - "buildspec.yaml"
          - ".tekton/**"
          - ".harness/**"
          - ".build.yml"
          - ".builds/**"
          - "**/*.gocd.yaml"
          - "**/*.gocd.yml"
          - ".concourse/**"
          - "ci/pipeline*.yml"
          - "ci/pipeline*.yaml"
          - ".onedev-buildspec.yml"

  - id: instruction-set-owned
    level: strict
    requires: convention
    statement: >-
      The instruction set has a named owner and a stated review cadence.
    observe:
      - "an owner is named in or alongside the universal instruction file"
      - "a review cadence is stated (and last-review date is plausible)"

  - id: context-budget-gated
    level: strict
    requires: mechanical
    statement: >-
      CI measures the always-loaded context against the smallest budget of
      every runtime and reviewer that reads it (the cumulative root-to-directory
      instruction chain, each skill and agent description, and the aggregate
      skill listing) in a step that runs before dependencies are installed,
      and fails when any is over.
    observe:
      - "a CI step measures every root-to-directory instruction chain against a byte budget no larger than the smallest consumer's (Codex: 32,768 bytes by default)"
      - "a CI step checks each skill and agent description against a per-item cap and the skill listing against an aggregate allowance"
      - "the steps run before the dependency install, on every pull request, with no path filter"
    probe:
      mechanical:
        files: *ci-config
    since: 0.22.0
