# Machine-evaluable criteria for M6 (feature-delivery pipeline).
# Schema: README.md in this folder. Each criterion is an
# observable repo fact, scored absent -> convention -> mechanical.
module: M6
name: feature-delivery-pipeline
purpose: >-
  An idea becomes shipped work through named stages, each with its own
  artifact and review, rather than decisions made inside a pull request.
criteria:
  - id: pipeline-stages-documented
    level: lite
    requires: convention
    statement: >-
      The pipeline stages — research spike, PRD, architecture, design-prototype
      loop, epic decomposition — are named in one document, with the per-stage
      review-then-de-scar rule stated.
    observe:
      - "a pipeline doc names the idea -> shipped stages in order"
      - "it states that each artifact is reviewed and de-scarred before the next stage consumes it"

  - id: stage-templates-committed
    level: lite
    requires: convention
    statement: >-
      Committed templates exist for the PRD, the architecture doc, and the
      research note, and the pipeline doc points each stage at its template.
    observe:
      - "prd, architecture, and research-note templates are committed in the repo"
      - "the PRD template keeps what-for-users separate from how (no stack talk)"

  - id: artifact-from-template-gated
    level: standard
    requires: mechanical
    statement: >-
      Each stage produces a named artifact from its committed template, and a
      required-sections check fails a stage artifact that is missing a required
      heading.
    observe:
      - "a sections manifest (or SECTIONS list) exists per artifact type"
      - "a required-sections check runs over changed stage docs"

  - id: per-stage-adversarial-review-contract
    level: standard
    requires: convention
    statement: >-
      Per-stage adversarial review is a documented contract — a fresh-context,
      red-team critique clears before the next stage consumes the artifact, and
      acceptance (status: accepted) records that it happened.
    observe:
      - "the pipeline doc requires a fresh-context adversarial review each stage"
      - "an accepted artifact carries a review record (reviewed: key or a ## Review section)"

  - id: descarring-applied
    level: standard
    requires: convention
    statement: >-
      Accepted artifacts are de-scarred — the finished document carries no
      review findings or reviewer dialogue, only the result.
    observe:
      - "accepted stage artifacts contain no finding-lists / addressed-annotations"
      - "the de-scarring rule references the docs-governance module (M4)"

  - id: stage-gates-self-tested-in-ci
    level: strict
    requires: mechanical
    statement: >-
      The required-sections gate and the stage-review-record gate each ship a
      self-test and run in CI, so a broken pipeline gate fails loudly.
    observe:
      - "each gate has a paired self-test exercising a known pass and a known fail"
      - "CI runs the gates (required-sections on changed stage docs; stage-review-record as a merge gate) and the self-tests"
    probe:
      mechanical:
        files: &ci-config
          - ".github/workflows/*.yml"
          - ".github/workflows/*.yaml"
          - ".forgejo/workflows/*"
          - ".gitea/workflows/*"
          - ".gitlab-ci.yml"
          - ".circleci/config.yml"
          - ".circleci/config.yaml"
          - "azure-pipelines.yml"
          - "azure-pipelines.yaml"
          - ".azure-pipelines/**"
          - ".pipelines/**"
          - "bitbucket-pipelines.yml"
          - "Jenkinsfile"
          - "**/Jenkinsfile"
          - "**/*.jenkinsfile"
          - ".buildkite/**"
          - ".drone.yml"
          - ".drone.yaml"
          - ".woodpecker.yml"
          - ".woodpecker.yaml"
          - ".woodpecker/**"
          - ".travis.yml"
          - ".cirrus.yml"
          - ".cirrus.star"
          - "appveyor.yml"
          - ".appveyor.yml"
          - ".semaphore/**"
          - ".teamcity/**"
          - "bitrise.yml"
          - "codemagic.yaml"
          - "codefresh.yml"
          - "cloudbuild.yaml"
          - "cloudbuild.yml"
          - "buildspec.yml"
          - "buildspec.yaml"
          - ".tekton/**"
          - ".harness/**"
          - ".build.yml"
          - ".builds/**"
          - "**/*.gocd.yaml"
          - "**/*.gocd.yml"
          - ".concourse/**"
          - "ci/pipeline*.yml"
          - "ci/pipeline*.yaml"
          - ".onedev-buildspec.yml"

  - id: epic-flag-labels-drive-gates
    level: strict
    requires: mechanical
    statement: >-
      Epic decomposition sets flag labels on sub-issues, and those labels drive
      which downstream reviews and gates fire (via the tasks and change-area
      modules), not a reviewer's memory.
    observe:
      - "sub-issues carry flag labels (e.g. has-migration, api-change, hitl)"
      - "the labels select downstream gates/reviews through M9 / M3, mechanically"

  - id: lifecycle-map-published
    level: lite
    requires: convention
    since: next
    statement: >-
      The delivery loop is published as one stage map, linked from the
      instruction file every session loads; each stage is named, not numbered,
      and names its owner and the artifact it hands on.
    observe:
      - "one document holds a table of the loop's stages, each with an owner and a handoff artifact"
      - "the universal instruction file links that document"

  - id: lifecycle-owners-resolve-gated
    level: standard
    requires: mechanical
    since: next
    statement: >-
      A check fails when the lifecycle map names a skill, command, script or
      document that does not resolve, and it runs in CI with its self-test.
    observe:
      - "a check reads the map's owners and resolves each against the repository's skills, scripts and files"
      - "CI runs the check on every pull request"
      - "CI runs the check's own self-test, so a broken check fails loudly"

  - id: lifecycle-skills-on-the-map
    level: strict
    requires: mechanical
    since: next
    statement: >-
      Every skill the repository ships appears on the lifecycle map, as a
      stage's owner or in its table of skills outside the loop, and the check
      fails when one is missing (expected-absent for a repository that ships
      no skill).
    observe:
      - "the lifecycle map check lists the directories of the skills the repository ships and fails a skill the map never names"

  - id: design-loop-feedback-contract
    level: strict
    requires: convention
    statement: >-
      The design-prototype loop's feedback into requirements and architecture is
      a written contract — the prototype may reopen the PRD and the architecture
      rather than being a rendering step at the end.
    observe:
      - "the pipeline doc allows the design loop to revise the PRD / architecture"
      - "the accepted prototype is imported in a standard form and the architecture re-checked"
