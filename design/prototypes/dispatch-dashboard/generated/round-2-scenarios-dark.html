<!DOCTYPE html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Round 2 scenarios, dark</title>
<style>/* Dispatch dashboard, round 2: the card system. Tokens are the built page's (reference-specs/tokens.md); nothing else is a colour. */
:root, .dd {
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --r-tag: 4px; --r: 8px; --r-card: 12px; --r-panel: 14px; --tap: 44px;
  --outer: light-dark(#e8e4dd, #0d0b09);
  --bg: light-dark(#f9f6f1, #1a1713);
  --card: light-dark(#fffdfa, #23201c);
  --sunk: light-dark(#f0ece5, #13100d);
  --ink: light-dark(#251e18, #ebe7e0);
  --muted: light-dark(#59514a, #b8b3ac);
  --line: light-dark(#d5d0c8, #433f3a);
  --line-strong: light-dark(#867f77, #847f78);
  --accent: light-dark(#1a6444, #82d2a8);
  --accent-hover: light-dark(#005031, #9fe7c0);
  --on-accent: light-dark(#fcfaf6, #0e1913);
  --accent-soft: light-dark(#dbf2e4, #1b3427);
  --hl: light-dark(#f7e8af, #4e3e09);
  --hl-line: light-dark(#815b1f, #ddc276);
  --focus: light-dark(#0267c7, #7dbaff);
  --focus-soft: light-dark(#e3eefb, #1b2a3c);
  --bad: light-dark(#a8201a, #ff9e94);
  --wait: light-dark(#6a3a9e, #cdb4f5);
  --small: 14px;
  --gut: 30px;
}
.dd { container: page / inline-size; min-height: 100vh; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
.dd *, .dd *::before, .dd *::after { box-sizing: border-box; }
.dd a { color: var(--accent); text-underline-offset: 2px; }
.dd a:hover { color: var(--accent-hover); }
.dd :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.dd h1, .dd h2, .dd h3, .dd p, .dd ul, .dd ol, .dd dl, .dd dd { margin: 0; }
.dd button { font: inherit; color: inherit; }
.m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mut { color: var(--muted); }
.sm { font-size: var(--small); }
.nowrap { white-space: nowrap; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ic { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }
.ic.s14 { width: 14px; height: 14px; vertical-align: -2px; }
.ic.dashed { stroke-dasharray: 2.5 2.5; }

/* prototype switch, not part of the page */
.proto { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 16px; background: var(--outer); font-size: 14px; color: var(--muted); }
.proto label { display: flex; gap: 6px; align-items: center; }
.proto select { min-height: 32px; }

/* strip */
.strip { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.stripIn { display: flex; align-items: center; gap: 4px 16px; max-width: 1200px; margin: 0 auto; padding: 0 16px; min-height: 48px; }
.brand { display: flex; align-items: center; gap: 6px; flex: none; font: 600 18px/1 var(--serif); }
.brand svg { width: 24px; height: 24px; display: block; }
.brand span { display: none; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
.tab { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; white-space: nowrap; color: var(--ink); font-size: 15px; }
.tab[aria-current="page"] { border-bottom-color: var(--accent); font-weight: 600; }
.count { font: 400 12px/1 var(--mono); min-width: 20px; padding: 3px 5px; border: 1px solid var(--line-strong); border-radius: 10px; text-align: center; color: var(--muted); }
.count.need { background: var(--hl); border-color: var(--hl-line); color: var(--ink); }
.fresh { flex: none; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
/* the logo is the menu */
.brandWrap { position: relative; flex: none; }
.dd .brand { min-height: 44px; min-width: 44px; padding: 0 4px; border: 0; background: none; color: var(--ink); cursor: pointer; border-radius: var(--r); }
.brand .caret { color: var(--muted); }
.menu { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; width: min(300px, calc(100vw - 24px)); display: flex; flex-direction: column; padding: 6px; background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r-card); box-shadow: 0 6px 20px light-dark(rgba(37,30,24,.16), rgba(0,0,0,.55)); }
.mi { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; background: none; border-radius: var(--r); cursor: pointer; text-align: left; font: 400 15px var(--sans); color: var(--ink); }
.mi:hover { background: var(--sunk); }
.mi span:first-of-type { flex: 1; }
.sw { position: relative; width: 34px; height: 20px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--sunk); flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); }
.sw.on { background: var(--ink); border-color: var(--ink); }
.sw.on::after { left: 16px; background: var(--bg); }
.minfo { margin: 4px 0 0 !important; padding: 8px 10px 4px; border-top: 1px solid var(--line); font: 400 13px/1.5 var(--mono); color: var(--muted); }
/* one-line banner, compact flash, compact band */
.bline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; }
.bline .btn { min-height: 44px; }
.banner { padding: 6px 12px; }
.flash a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; }
.flash { padding: 2px 10px; gap: 4px 10px; }
.band { padding: 6px 12px; gap: 2px; }
.band .facet { order: -1; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.bline > span { flex: 1 1 200px; }
.band .metrics a, .bandline a { display: inline-flex; align-items: center; min-height: 44px; }
.fresh.stale { color: var(--bad); }

.main { max-width: 1200px; margin: 0 auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
.flash { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--small); padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.banner { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 2px solid var(--line-strong); border-radius: var(--r-card); background: var(--sunk); }
.banner h2 { font: 600 18px/1.25 var(--serif); display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 4px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--card); cursor: pointer; font-size: 15px; }

/* view heading and the count line */
.vhead { display: flex; flex-direction: column; gap: 8px; }
.vtitle { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.vtitle h1 { font: 600 24px/1.2 var(--serif); }
.vtitle .sub { font-size: var(--small); color: var(--muted); }
.band { background: var(--hl); border: 1px solid var(--hl-line); border-radius: var(--r-panel); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.band h1 { font: 600 24px/1.2 var(--serif); }
.metrics { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: var(--small); }

/* filters: the text filter, then facet rows */
.filters { display: flex; flex-direction: column; gap: 8px; }
.textf { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--card); max-width: 420px; }
.textf input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 15px var(--sans); min-height: 40px; outline: none; }
.facet { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.facet .fl { font-size: var(--small); color: var(--muted); min-width: 84px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 2px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--card); cursor: pointer; font-size: 14px; color: var(--ink); white-space: nowrap; }
.fchip .n { font-family: var(--mono); color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.fchip[aria-pressed="true"] .n { color: var(--bg); }
.band .fchip { background: transparent; border-color: var(--hl-line); }
.band .fchip[aria-pressed="true"] { background: var(--ink); }
.sel { min-height: 44px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--card); color: var(--ink); font: 400 15px var(--sans); max-width: 100%; }
.active { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: var(--small); color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 4px; font-size: var(--small); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; }
.seg button { min-height: 36px; padding: 2px 10px; border: 0; border-left: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 14px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.deskOnly { display: none !important; }

/* a panel of cards: one column */
.list { display: flex; flex-direction: column; gap: 8px; }

/* group heading: same gutter, same chevron */
.ghead { display: grid; grid-template-columns: var(--gut) minmax(0, 1fr); align-items: center; padding: 6px 0 2px; margin-top: 8px; border-top: 2px solid var(--line-strong); cursor: pointer; user-select: none; }
.ghead:first-child { margin-top: 0; }
.ghead h2, .ghead h3 { font: 600 18px/1.3 var(--serif); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.ghead .gsub { font: 400 14px/1.3 var(--sans); color: var(--muted); }
.gnote { font-size: var(--small); color: var(--muted); padding-left: var(--gut); }

/* the disclosure: a bare chevron in the gutter */
.disc { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -10px 0 0 -12px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 6px; }
.disc .ic { transition: transform 150ms ease; }
.disc[aria-expanded="true"] .ic { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .disc .ic { transition: none; } }
.ghead .disc { margin: -8px 0 -8px -12px; }

/* the card */
.card { position: relative; display: grid; grid-template-columns: var(--gut) minmax(0, 1fr); padding: 10px 12px 10px 8px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); cursor: pointer; }
.card.open { border-color: var(--line-strong); }
@media (hover: hover) { .card:hover, .ghead:hover { background: var(--sunk); } .ghead:hover { background: transparent; } .ghead:hover .disc { color: var(--ink); } .card:hover .disc { color: var(--ink); } }
.gutter { display: flex; flex-direction: column; align-items: flex-start; }
.spine { flex: 1; width: 0; margin: 4px 0 0 7px; border-left: 2px solid var(--line-strong); }
.cbody { min-width: 0; display: flex; flex-direction: column; gap: 3px; cursor: auto; }
.card .cbody { cursor: pointer; }
.r1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 24px; }
.r1 .end { margin-left: auto; font: 400 14px var(--mono); color: var(--muted); white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: var(--small); color: var(--muted); }
.meta .repo { font-family: var(--mono); }
.q { font-size: 15px; }
.q::before { content: "\201C"; } .q::after { content: "\201D"; }
.ask { font-size: 15px; }
.rec { font-size: var(--small); }
.rec b { font-weight: 600; }
.cmd { display: flex; gap: 6px; align-items: flex-start; margin-top: 2px; }
.cmd code { flex: 1; min-width: 0; font: 400 13px/1.5 var(--mono); padding: 6px 8px; background: var(--sunk); border-radius: var(--r); overflow-x: auto; white-space: nowrap; }
.detail { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); cursor: auto; }
.quote { padding: 8px 10px; background: var(--sunk); border-radius: var(--r); font: 400 14px/1.5 var(--mono); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.tools { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: var(--small); }
.tools a { display: inline-flex; align-items: center; min-height: 44px; }
.opt { padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.opt b { font-weight: 600; }
.more { align-self: flex-start; }

/* families of marks: told apart by their container */
.act { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 7px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 600 13px/1.5 var(--sans); white-space: nowrap; }
.act.Decide, .act.Authorize { background: var(--hl-line); color: var(--card); }
.stage { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r-tag); font: 400 13px/1.6 var(--mono); color: var(--ink); white-space: nowrap; }
.src { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border: 1px dashed var(--line-strong); border-radius: var(--r-tag); font: 400 13px/1.6 var(--sans); color: var(--ink); white-space: nowrap; }
.cause { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.who { font-family: var(--mono); }
.mk { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 20px; height: 20px; border: 1px solid currentColor; border-radius: 3px; font: 700 14px/1 var(--mono); }
.r-needs { color: var(--hl-line); }
.mk.r-needs { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mk.r-needs::before { content: ""; width: 12px; height: 13px; background: radial-gradient(circle at 50% 26%, currentColor 0 24%, transparent 26%), radial-gradient(ellipse 50% 44% at 50% 100%, currentColor 0 98%, transparent 100%); }
.r-working, .r-well { color: var(--accent); }
.r-waiting { color: var(--wait); }
.r-held, .r-stale, .r-unknown { color: var(--muted); }
.r-badly { color: var(--bad); }

/* the work identity: icon, key, copy, popover */
.wid { position: static; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.wtrig { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--ink); cursor: pointer; border-radius: 6px; }
.wid .key { font: 600 15px/1.3 var(--mono); display: inline-flex; align-items: center; min-height: 28px; }
.wid.lk .key { font-weight: 400; font-size: 14px; }
.wid.lk .wtrig { width: 24px; }
.st-merged { color: var(--wait); } .st-closed { color: var(--bad); } .st-open { color: var(--accent); } .st-draft, .st-unknown, .st-item { color: var(--muted); }
.links { display: inline-flex; align-items: center; gap: 2px 6px; flex-wrap: wrap; color: var(--muted); font-size: var(--small); }
.cbtn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 28px; height: 28px; padding: 0 4px; border: 1px solid var(--line); border-radius: var(--r-tag); background: transparent; cursor: pointer; color: var(--ink); font-size: 13px; }
.cbtn.ok { color: var(--accent); border-color: var(--accent); }
.cfield { width: 100%; font: 400 13px var(--mono); padding: 6px 8px; border: 2px solid var(--focus); border-radius: var(--r); background: var(--card); color: var(--ink); }
.pop { position: absolute; z-index: 30; top: auto; margin-top: 46px; left: 8px; right: 8px; max-width: 400px; white-space: normal; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 4px 16px light-dark(rgba(37,30,24,.14), rgba(0,0,0,.5)); font: 400 14px/1.4 var(--sans); color: var(--ink); cursor: auto; }
.pop .kind { color: var(--muted); }
.pop .kv { font-size: 13px; }

/* running: the load and the accounts */
.load { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); }
.loadHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.loadHead b { font: 600 20px/1.2 var(--serif); }
.gauges { display: flex; flex-direction: column; gap: 4px; }
.g { display: grid; grid-template-columns: 22px minmax(0, 1fr) 58px; grid-template-areas: "i n p" "b b b" "r r r"; align-items: center; gap: 2px 8px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 14px; }
.g .gi { grid-area: i; } .g .gn { grid-area: n; } .g .gp { grid-area: p; text-align: right; font-family: var(--mono); } .g .gb { grid-area: b; } .g .gr { grid-area: r; color: var(--muted); }
.g.binds .gn { font-weight: 700; }
.bar { position: relative; height: 10px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.bar .over { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--bad) 0 3px, transparent 3px 6px); }
.bar .lineMark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.bar.unread { border-style: dashed; background: transparent; }
.tagb { display: inline-flex; align-items: center; gap: 3px; padding: 0 5px; border: 1px solid var(--ink); border-radius: var(--r-tag); font: 600 12px/1.5 var(--sans); }
.tagb.over { border-color: var(--bad); color: var(--bad); }
.acct { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 10px; height: 10px; border: 1px solid var(--line-strong); border-radius: 2px; }
.pip.on { background: var(--ink); border-color: var(--ink); }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px 24px; }
.legend h3 { font: 600 16px var(--serif); margin-bottom: 4px; }
.legend li { list-style: none; display: flex; gap: 8px; align-items: center; min-height: 26px; font-size: 14px; }
.legend ul { padding: 0; }
.foot { max-width: 1200px; margin: 0 auto; padding: 8px 16px 32px; font: 400 13px/1.6 var(--mono); color: var(--muted); }
.empty { padding: 14px; border: 1px dashed var(--line-strong); border-radius: var(--r-card); color: var(--muted); font-size: var(--small); }
.hist { display: grid; grid-template-columns: minmax(0, 1fr); }

/* phone: tap targets and 14 px type */
.wtrig, .cbtn { min-width: 44px; min-height: 44px; }
.wid.lk .wtrig { width: 44px; }
.wid .key { min-height: 44px; min-width: 44px; justify-content: center; }
.r1 { min-height: 44px; }
.meta a.repo { display: inline-flex; align-items: center; min-height: 44px; }
.count, .act, .stage, .src, .tagb, .cmd code, .foot { font-size: 14px; }
.tools .cbtn { min-height: 44px; }

@container page (min-width: 700px) {
  .brand span { display: inline; }
  .fresh { display: inline-flex; }
  .flash a, .band .metrics a, .bandline a { min-height: 0; min-width: 0; }
  .bline .btn { min-height: 30px; }
  .filters { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 22px; }
  .filters .active { flex-basis: 100%; }
  .mi { min-height: 36px; }
  .band .facet { flex-wrap: wrap; overflow: visible; }
  .deskOnly { display: revert !important; }
  .phoneOnly { display: none !important; }
  .facet { flex-wrap: wrap; }
  .fchip { min-height: 30px; padding: 1px 9px; font-size: 13px; }
  .sel { min-height: 32px; font-size: 14px; }
  .textf { min-height: 36px; }
  .textf input { min-height: 32px; }
  .linkbtn { min-height: 28px; }
  .tab { min-height: 46px; }
  .btn { min-height: 34px; }
  .wtrig, .cbtn { min-width: 0; min-height: 0; }
  .wtrig { width: 26px; height: 26px; }
  .wid.lk .wtrig { width: 22px; }
  .cbtn { width: 26px; height: 26px; }
  .wid .key { min-height: 0; min-width: 0; }
  .r1 { min-height: 26px; }
  .meta a.repo { min-height: 0; }
  .pop { margin-top: 30px; left: 38px; right: auto; width: 380px; }
  .count { font-size: 12px; }
  .act, .stage, .src, .tagb, .cmd code, .foot { font-size: 13px; }
  .tools .cbtn { min-height: 26px; }
  .disc { width: 30px; height: 30px; margin: -3px 0 0 -6px; }
  .ghead .disc { margin: -4px 0 -4px -6px; }
  .tools a { min-height: 26px; }
