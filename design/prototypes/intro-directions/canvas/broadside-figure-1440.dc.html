  <!-- thick-thin rule opening entry No. 1 -->

      <p style="margin:18px 0 0; font-size:18px; font-style:italic; color:#59514a;">The line</p>
      <h2 id="t1" style="margin:10px 0 0; font-size:40px; line-height:1.08; font-weight:700; letter-spacing:-0.005em;">Seven stations, run as a loop.</h2>
      <p style="margin:22px 0 0; font-size:19px; line-height:1.55;">Every change passes the same stations: pick up, build, open, drive, repair, merge, follow up. A person merges at the sixth. The follow-up sends what the merge owes back to the first.</p>
      <p style="margin:24px 0 0;"><span style="display:inline-block; padding:2px 14px 3px; border:1.5px solid #1a6444; border-bottom-width:5px; border-radius:7px; background:#dbf2e4; color:#251e18; font-size:24px; font-weight:700; font-variant-caps:small-caps; letter-spacing:0.04em; line-height:1.3;">Merge</span></p>
    </div>
    <figure style="position:absolute; left:580px; top:0; margin:0; width:960px;">
      <img src="/_blob/ab86ece52ca4920c9a94dcd39d56ca28" width="960" height="540" alt="Isometric engraving of the line: seven stations on a loop, pick up, build, open, drive, repair, merge and follow up, with a person at the merge station." style="display:block; width:960px; height:540px;">

  <div style="position:absolute; left:0; right:0; top:708px; text-align:center;">
