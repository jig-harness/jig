<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheet Set: hero, dark, 390</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#82d2a8}a:hover{color:#a6e2c2}
.ss-start{color:#ebe7e0}
.ss-start:hover{color:#82d2a8}
</style>
</helmet>
<!-- dark tokens: surround sunk #13100d ; sheet card #23201c ; drawing field bg #1a1713 (matches the figure's paper) ; boundaries ink #ebe7e0 -->
<div style="width:390px; height:844px; box-sizing:border-box; padding:8px; background:#13100d; font-family:system-ui,-apple-system,'Segoe UI',Ubuntu,Cantarell,'Noto Sans',sans-serif; color:#ebe7e0; overflow:hidden;">
 <main style="box-sizing:border-box; border:2px solid #ebe7e0; background:#23201c; padding:5px;">
  <div style="box-sizing:border-box; border:1px solid #ebe7e0;">

   <!-- on a phone the cover's title block stacks above its drawing field -->
   <div style="display:flex; align-items:center; height:48px; padding:0 14px; border-bottom:1px solid #ebe7e0;">
    <span style="font-size:22px; font-weight:800; letter-spacing:-0.01em;">Jig</span>
   </div>

   <div style="padding:16px 14px 18px; border-bottom:1px solid #ebe7e0;">
    <h1 style="margin:0; font-size:44px; line-height:1.02; font-weight:800; letter-spacing:-0.025em;">A work item goes in. A pull request you can merge, or a question for you, comes out.</h1>
   </div>

   <p style="margin:0; padding:14px 14px 16px; font-size:16px; line-height:1.45; color:#ebe7e0; border-bottom:1px solid #ebe7e0;">Give an agent a work item; it builds the change, runs the checks and works through review until the pull request is ready or needs your decision.</p>

   <div style="display:flex; border-bottom:2px solid #ebe7e0;">
    <!-- the person's moment: double-bordered cell -->
    <div style="width:140px; box-sizing:border-box; padding:6px; border-right:1px solid #ebe7e0; display:flex;">
     <p style="flex:1; margin:0; min-height:44px; border:5px double #ebe7e0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;">You merge.</p>
    </div>
    <div style="flex:1; display:flex; align-items:center; padding:0 14px;">
     <a class="ss-start" href="#audit" style="display:flex; align-items:center; min-height:48px; font-size:17px; font-weight:700; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:5px;">Start with an audit</a>
    </div>
   </div>

   <!-- drawing field: the complete engraving, continuing below the first screen -->
   <div style="position:relative; background:#1a1713; padding:22px 9px 22px;">
    <span aria-hidden="true" style="position:absolute; top:0; left:50%; margin-left:-6px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid #ebe7e0;"></span>
    <img src="/_blob/9ec8c365df6ec3c55cfe94b69fce4f97" width="340" height="406" alt="An isometric engraving of the line: seven stations on a looped track (pick up, build, open, drive, repair, merge, follow up), with a person standing at the merge station." style="display:block; width:340px; height:406px; margin:0 auto;">
   </div>

  </div>
 </main>
</div>
</x-dc>
