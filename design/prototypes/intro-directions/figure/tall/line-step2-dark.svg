<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" width="360" height="430" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif" role="img" aria-labelledby="jig-line-tall-s2-dark-title jig-line-tall-s2-dark-desc"><title id="jig-line-tall-s2-dark-title">Jig&#39;s line: seven stations in a loop, then two slots and the wall</title><desc id="jig-line-tall-s2-dark-desc">An engraved isometric floor. Seven stations stand around a closed track: Pick up, Build, Open, Drive, Repair, Merge and Follow up, which feeds back to Pick up. Merge is a person&#39;s station. One work item travels the track and waits at Merge. Then the floor is set again: one account pad with two slots, each holding a work item, and a third item waiting in front of a wall across the lane.</desc><rect width="100%" height="100%" fill="#1a1713"/><defs><pattern id="jig-line-tall-s2-dark-h0" patternUnits="userSpaceOnUse" width="3.6" height="3.6" patternTransform="rotate(30)"><rect width="3.6" height="3.6" fill="#1a1713"/><path d="M0 1.8H3.6" stroke="#ebe7e0" stroke-width="0.5" fill="none"/></pattern><pattern id="jig-line-tall-s2-dark-h1" patternUnits="userSpaceOnUse" width="1.75" height="1.75" patternTransform="rotate(150)"><rect width="1.75" height="1.75" fill="#1a1713"/><path d="M0 0.88H1.75" stroke="#ebe7e0" stroke-width="0.5" fill="none"/></pattern><pattern id="jig-line-tall-s2-dark-h2" patternUnits="userSpaceOnUse" width="2.5" height="2.5" patternTransform="rotate(0)"><path d="M0 1.25H2.5" stroke="#ebe7e0" stroke-width="0.5" fill="none"/></pattern><pattern id="jig-line-tall-s2-dark-h3" patternUnits="userSpaceOnUse" width="3.6" height="3.6" patternTransform="rotate(30)"><rect width="3.6" height="3.6" fill="#1b3427"/><path d="M0 1.8H3.6" stroke="#82d2a8" stroke-width="0.5" fill="none"/></pattern><pattern id="jig-line-tall-s2-dark-h4" patternUnits="userSpaceOnUse" width="1.75" height="1.75" patternTransform="rotate(150)"><rect width="