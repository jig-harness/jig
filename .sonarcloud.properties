# SonarQube Cloud's automatic analysis reads this file from the default branch.
#
# A design prototype is an external design session's export, kept for review:
# the raw export stays as delivered, its pages are generated from it, and
# nothing serves them to anyone. A finding in one has nothing to fix.
#
# The dispatch dashboard's built page is generated too: its source is
# dashboard/, which is analysed, and the page is that source bundled and
# minified, with the same stylesheet inlined in both of its documents.
sonar.exclusions=design/prototypes/**,plugin/dispatch/dashboard-page/**
