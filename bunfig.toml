[install]
# The release cooldown of .config/supply-chain-policy.yaml, in seconds: a
# `bun add` or `bun update` does not resolve a release younger than this.
# A frozen-lockfile install is not affected. Checked against the policy by
# scripts/check-supply-chain-lockstep.ts.
minimumReleaseAge = 259200

[test]
# Fixtures are input data, including deliberate .test.ts examples.
pathIgnorePatterns = ["**/fixtures/**", "**/fixture/**", ".context/**", "dist/**", "seeds/**"]
preload = ["./lib/test-tmpdir-bun-preload.ts", "./lib/test-jig-config-preload.ts", "./plugin/skills/resolve-review-comments/__tests__/preload.ts"]
