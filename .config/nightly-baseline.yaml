# The nightly run's known-failure baseline: the tests known to fail on macOS
# or Windows, each group with the reason they fail and the issue that owns
# the fix. The nightly workflow (.github/workflows/nightly.yml) names this
# file to `bun run test` (scripts/test.ts): a test stage that fails only on
# tests recorded here for its platform passes; a failure not recorded here
# fails it, and the run's tracking issue names the test. A recorded test that
# passes is reported as stale in the run, and its entry is removed, so the
# list only shrinks: add an entry only for a test that already fails on main,
# with the issue that will fix it. A test that cannot pass on a platform for
# want of a capability the platform lacks is skipped through the shared skip
# helpers (lib/test-helpers/windows-skip.ts) instead.
#
# Each group holds a platform (linux, macos or windows), the owning issue as
# "#<number>", the reason, and the tests: each test file's path from the
# repository root, with the full names of its failing tests as bun prints
# them, `describe` titles first, joined by " > ". A hook that fails outside
# any test is "(unnamed)". `bun run gates` checks the format and that every
# entry still names a test in its file (scripts/check-nightly-baseline.ts).
version: 1
