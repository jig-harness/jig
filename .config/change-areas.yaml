  modules:
    title: "The practice modules: reference, templates and module pages"
    category: docs
    paths: ["modules/**"]
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: docs

  plugin:
    title: "The plugin: other skills, agents, manifests and documentation"
    category: skill
    paths: ["plugin/**", ".claude-plugin/**", ".agents/**"]
    workspace: []
    impliedBy: [plugin-shared, shared-lib, toolchain]
    deployTier: plugin
    validation:
      profile: area
    generated:
      - outputs:
          - "plugin/dispatch/dashboard-page/index.html"
          - "plugin/dispatch/dashboard-page/refused.html"
          - "plugin/dispatch/dashboard-page/bundle.LICENSE"
        source:
          - "package.json"
          - "bun.lock"
          - "mise.toml"
          - "dashboard/**"
          - "website/public/brand/jig-mark-adaptive.svg"
          - "plugin/dispatch/lib/dashboard-contract.ts"
        command: "bun dashboard/build.ts"
        check: "bun dashboard/build.ts --check"
        notes: >-
          The page jig dispatch dashboard serves. The plugin runs from a copy
          without node_modules, so it carries the page as one HTML document
          with its script and styles inline, built by Bun from the source in
          dashboard/src and the pinned packages, minified since
          a phone loads it (ADR-0001), with the licence of each package the
          bundler read. dashboard/build.test.ts rebuilds and
          compares the files as well.
      - outputs: ["plugin/consumer-actions.json"]
        source:
          - "CHANGELOG.md"
          - ".config/jig.yaml"
          - "plugin/skills/changelog/scripts/consumer-actions.ts"
          - "plugin/skills/changelog/scripts/consumer-actions-record.ts"
          - "plugin/skills/changelog/scripts/markdown-blocks.ts"
          - "plugin/skills/changelog/scripts/formats.ts"
          - "plugin/skills/changelog/scripts/config.ts"
        command: "bun plugin/skills/changelog/scripts/consumer-actions-record.ts --write"
        check: "bun plugin/skills/changelog/scripts/consumer-actions-record.ts --check"
        notes: >-
          The consumer-actions record the plugin ships: every consumer action
          the changelog's released sections declare, with its id
          (changes/README.md § Consumer actions). The release step rewrites it
          in the release commit, so a branch changes it only by correcting a
          released entry's declaration. JSON cannot carry a generated header,
          so its "$comment" field names its generator; it is laid out as Biome
          formats JSON, so the formatter leaves it as derived.
      - outputs: ["plugin/LICENSE", "plugin/NOTICE"]
        source: ["LICENSE", "NOTICE"]
        command: "cp LICENSE NOTICE plugin/"
        check: "git diff --no-index --exit-code LICENSE plugin/LICENSE && git diff --no-index --exit-code NOTICE plugin/NOTICE"
        notes: >-
          The plugin installs only plugin/, so it carries byte copies of the
          root licence files; scripts/check-licences.ts compares them as well.
      - outputs:
          - "plugin/skills/docs/__tests__/fixtures/index/docs/INDEX.md"
          - "plugin/skills/docs/__tests__/fixtures/index/docs/.orphans.md"
        source:
          - "plugin/skills/docs/scripts/index/generate-index.ts"
          - "plugin/skills/docs/__tests__/fixtures/index/docs/**/*.md"
        command: "bun exec \"DOCS_DIR=plugin/skills/docs/__tests__/fixtures/index/docs bun plugin/skills/docs/scripts/index/generate-index.ts\""
        check: "bun exec \"DOCS_DIR=plugin/skills/docs/__tests__/fixtures/index/docs bun plugin/skills/docs/scripts/index/generate-index.ts --check\""
        notes: >-
          The docs skill's index generator over its test fixture. One
          generator writes both (Bun's shell sets the variable on every
          operating system); the orphan report's date is sticky, so it changes
          only when the report's content does.

  plugin-shared:
    title: "The plugin's shared code: what more than one skill imports"
    category: library
    paths: ["plugin/shared/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: plugin
    validation:
      profile: deep
    generated:
      - outputs:
          - "plugin/shared/vendor/js-yaml.mjs"
          - "plugin/shared/vendor/js-yaml.LICENSE"
        source: ["package.json", "bun.lock"]
        command: "cp node_modules/js-yaml/dist/js-yaml.mjs plugin/shared/vendor/js-yaml.mjs && cp node_modules/js-yaml/LICENSE plugin/shared/vendor/js-yaml.LICENSE"
        check: "git diff --no-index --exit-code node_modules/js-yaml/dist/js-yaml.mjs plugin/shared/vendor/js-yaml.mjs && git diff --no-index --exit-code node_modules/js-yaml/LICENSE plugin/shared/vendor/js-yaml.LICENSE"
        notes: >-
          The plugin runs from a copy without node_modules, so the plugin ships
          js-yaml's own build, byte for byte (no generated header: the file
          must stay what its generator writes). After updating js-yaml, copy
          it again. tools/plugin/vendored.test.ts compares both files with the
          installed js-yaml as well.
      - outputs:
          - "plugin/shared/vendor/optique.mjs"
          - "plugin/shared/vendor/optique.d.mts"
          - "plugin/shared/vendor/optique.LICENSE"
        source:
          - "package.json"
          - "bun.lock"
          - "mise.toml"
          - "tools/plugin/optique-entry.ts"
          - "tools/plugin/vendor-optique.ts"
        command: "bun tools/plugin/vendor-optique.ts"
        check: "bun tools/plugin/vendor-optique.ts --check"
        notes: >-
          Optique, the parser the jig command line is written with, ships no
          single-file build, so the plugin carries Bun's unminified bundle of
          the parts the command imports (tools/plugin/optique-entry.ts), the
          declarations that name the package's own types, and its licence.
          The bundle is what the pinned Bun writes for the pinned package, so
          an update of either (mise.toml, package.json) is followed by a run
          of the command. tools/plugin/vendored.test.ts rebuilds and compares
          the three files as well.

