# Jig's change-area catalog (module M3): the one place that maps this
# repository's paths to named change-areas. The CI workflow reads area names
# and its test legs from scripts/change-areas.ts, never these globs: the
# drive-pr suite runs when the `drive-pr` area is affected or holds a test
# that depends on the change, and the gate set's test legs run the own tests
# of the areas a change reaches and the test files that depend on it (every
# shard, and every separate suite, when its plan is the deepest profile). A
# push to main runs every suite, and the nightly workflow runs them on macOS
# and Windows without reading this catalog.
#
# Every tracked file belongs to at least one area (`bun run gates` fails
# otherwise). `impliedBy` says that a change to the listed areas also affects
# this one. CI finds the tests that import a changed file, or name it, by
# itself (scripts/test-reach.ts), so an edge is not needed for those; it is
# for what that walk cannot see, such as a script production code starts by
# path or a file a suite reads, and for what follows from an area beyond its
# tests (reviews, CI jobs). When unsure whether one area depends on another,
# add the edge: a redundant CI job is cheap, a skipped one is not.
#
# Its schema, resolver and invariants are the plugin's change-areas skill
# (plugin/skills/change-areas/README.md); scripts/change-areas.ts adds Jig's
# policy on top. Field reference: modules/M3-change-area-catalog/reference/catalog/README.md.
# `vocabularies:` closes the open fields: `category` is one of skill,
# library, tooling, infra, docs; `deployTier` is `plugin` for what ships in a
# plugin version and `none` otherwise. A value outside them fails the gates.
# `reviewRisk: high` (optional, a field Jig's script adds to the schema) puts
# the area's paths in the AI reviewer's high-risk list: scripts/review-risk.ts
# writes them into .config/ai-review.yaml, and the gates fail when the two
# differ. A file may belong to several areas, so a narrow area can mark part
# of a broader one.
# An area's `generated:` list declares the derived files it owns, in M2's
# inventory format (outputs, source, command, check): scripts/check-generated-files.ts
# runs every declared check through M2's runner, so a derived file is added
# with its check or not at all (CONTRIBUTING.md § Derived files). A change to
# an entry's `source` seeds the area too.

vocabularies:
  category: [skill, library, tooling, infra, docs]
  deployTier: [plugin, none]

# Validation profiles, shallowest first (M3 § Agent gate depth): the checks
# a change owes before commit (`localChecks`) and to verify the committed
# tree (`verificationChecks`). Each area names its profile and its own tests
# (`validation.ownTests`, always `bun run test` and the directories its
# suites live in); scripts/validation-plan.ts derives the plan from the
# areas a change touches, and scripts/change-areas.ts builds CI's test legs
# from the same resolution and the tests that depend on the changed files.
# An own-tests directory must hold a test file (`--check` fails otherwise).
# The deepest profile is the fail-closed fallback:
# a changed file no area matches selects it, and so does a file outside the
# `docs` profile whose areas declare no own tests (a file only the broad
# `plugin` area holds), since nothing narrower tests it.
# `validation.separateSuite: true` (a field Jig's script adds) marks an own
# suite CI runs in a job of its own: the gate set leaves its directories out
# (scripts/gates.ts reads them from here), the job runs for the deepest profile
# and whenever a test in it depends on the change, and gates.test.ts fails while
# a workflow does not run it.
profiles:
  docs:
    notes: >-
      Prose and configuration: the repository checks hold it, and CI still runs
      any test that names a changed YAML, JSON or TOML file.
    localChecks: ["bun run gates --fast"]
    verificationChecks: ["bun run gates --fast"]
  area:
    notes: >-
      Code an area's own suites test: the quick gates, then the slower
      whole-repository checks, beside the touched areas' own tests and
      generated-file checks.
    localChecks: ["bun run gates --fast"]
    verificationChecks:
      - "bun run gates --fast"
      - "bun run deadcode"
      - "bun run audit"
      - "bun run quality"
      - "bun run build"
  deep:
    notes: The whole gate set, every suite included.
    localChecks: ["bun run gates"]
    verificationChecks: ["bun run gates"]

areas:
  drive-pr:
    title: "drive-pr skill"
    category: skill
    paths:
      - "plugin/skills/drive-pr/**"
      - "tools/protocol/drive-exit-gate.ts"
      - "tools/protocol/chapters/drive-exits.ts"
    workspace: []
    # Its scripts import the plugin's shared code and spawn the other two
    # skills' scripts, and its tests run with the shared test preloads and
    # the toolchain.
    impliedBy: [resolve-review-comments, do-item, plugin-shared, shared-lib, toolchain]
    deployTier: plugin
    validation:
      profile: area
      ownTests: "bun run test ./plugin/skills/drive-pr/"
      separateSuite: true

  resolve-review-comments:
    title: "resolve-review-comments skill"
    category: skill
    paths: ["plugin/skills/resolve-review-comments/**"]
    workspace: []
    impliedBy: [plugin-shared, shared-lib, toolchain]
    deployTier: plugin
    validation:
