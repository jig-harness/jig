    category: skill
    paths: ["plugin/skills/do-item/**"]
    workspace: []
    impliedBy: [resolve-review-comments, plugin-shared, shared-lib, toolchain]
    deployTier: plugin
    validation:
      profile: area
      ownTests: "bun run test ./plugin/skills/do-item/"

  # The areas below name the tracker's other `area:` labels, so
  # `/jig:work-batch` can draw a batch from them (do_item.agents.codearea_areas
  # in jig.yaml). They sit inside `plugin` and add no CI job of their own:
  # only `website` and `drive-pr` select one, and no edge below leads to
  # either; their own tests join the gate set's test legs. Each lists the
  # areas whose changes should also run its own tests; a test that imports a
  # changed file runs whether listed or not. An area the catalog does not name
  # (`adr`, `docs`, `change-areas`) is reached through `plugin`, whose files no
  # own tests cover, so a change to them runs the whole gate set.
  dispatch:
    title: "The dispatcher (jig dispatch) and its dashboard server"
    category: skill
    paths: ["plugin/dispatch/**"]
    workspace: []
    impliedBy: [drive-pr, do-item, reflect, plugin-shared, shared-lib, toolchain]
    deployTier: plugin
    validation:
      profile: area
      ownTests: "bun run test ./plugin/dispatch/"

  gc:
    title: "Resource garbage collection (jig gc)"
    category: skill
