# Jig's change-area catalog (module M3): the one place that maps this
# repository's paths to named change-areas. The CI workflow reads area names
# from scripts/change-areas.ts, never these globs: the drive-pr suite runs
# when the `drive-pr` area is affected. The gate set runs on Linux for every
# change whatever its areas, and the nightly workflow runs it on macOS and
# Windows without reading this catalog.
#
# Every tracked file belongs to at least one area (`bun run gates` fails
# otherwise). When unsure whether one area depends on another, add the
# `impliedBy` edge: a redundant CI job is cheap, a skipped one is not.
#
# Field reference: modules/M3-change-area-catalog/reference/catalog/README.md.
# `category` is one of skill, library, tooling, infra, docs; `deployTier` is
# `plugin` for what ships in a plugin version and `none` otherwise.
# `reviewRisk: high` (optional, Jig's own) puts the area's paths in the AI
# reviewer's high-risk list: scripts/review-risk.ts writes them into
# .config/ai-review.yaml, and the gates fail when the two differ. A file may
# belong to several areas, so a narrow area can mark part of a broader one.

areas:
  drive-pr:
    title: "drive-pr skill"
    category: skill
    paths: ["plugin/skills/drive-pr/**"]
    workspace: []
    # Its scripts import the plugin's shared code and spawn the other two
    # skills' scripts, and its tests run with the shared test preloads and
    # the toolchain.
    impliedBy: [resolve-review-comments, do-item, plugin-shared, shared-lib, toolchain]
    deployTier: plugin

  resolve-review-comments:
    title: "resolve-review-comments skill"
    category: skill
    paths: ["plugin/skills/resolve-review-comments/**"]
    workspace: []
    impliedBy: [plugin-shared, shared-lib, toolchain]
    deployTier: plugin

  do-item:
    title: "do-item skill"
    category: skill
    paths: ["plugin/skills/do-item/**"]
    workspace: []
    impliedBy: [resolve-review-comments, plugin-shared, shared-lib, toolchain]
    deployTier: plugin

  plugin:
    title: "The plugin: other skills, agents, manifests and documentation"
    category: skill
    paths: ["plugin/**", ".claude-plugin/**", ".agents/**"]
    workspace: []
    impliedBy: [plugin-shared, shared-lib, toolchain]
    deployTier: plugin

  plugin-shared:
    title: "The plugin's shared code: what more than one skill imports"
    category: library
    paths: ["plugin/shared/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: plugin

  plugin-manifests:
    title: "The plugin manifests: name, version and description"
    category: skill
    paths: ["plugin/.claude-plugin/**", "plugin/.codex-plugin/**"]
    workspace: []
    impliedBy: []
    deployTier: plugin
    reviewRisk: high

  audit-scoring:
    title: "How the audit scores: its scripts, criteria, schema and method"
    category: skill
    paths:
      - "plugin/skills/audit/scripts/**"
      - "plugin/skills/audit/config-schema.yaml"
      - "plugin/skills/audit/references/methodology.md"
      - "plugin/skills/audit/references/survey-prompts/**"
      - "plugin/skills/audit/criteria/M*.yaml"
    workspace: []
    impliedBy: []
    deployTier: plugin
    reviewRisk: high

  shared-lib:
    title: "Shared library and test preloads"
    category: library
    paths: ["lib/**", "plugin/shared/**"]
    workspace: []
    impliedBy: []
    deployTier: none

  gates:
    title: "Repository gates and their self-tests"
    category: tooling
    paths: ["scripts/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none
    reviewRisk: high

  repo-skills:
    title: "Jig's own skills, for work on this repository"
    category: docs
    paths: [".claude/**"]
    workspace: []
    # Their scripts live in scripts/, with the repository's other tooling.
    impliedBy: []
    deployTier: none
    reviewRisk: high

  tools:
    title: "Machine-level tools"
    category: tooling
    paths: ["tools/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none

  module-reference:
    title: "Module reference code"
    category: tooling
    paths: ["modules/*/reference/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none
    reviewRisk: high

  module-templates:
    title: "Module templates"
    category: tooling
    paths: ["modules/*/templates/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none

  toolchain:
    title: "Toolchain, configuration and CI"
    category: infra
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "lefthook.yml"
      - "tsconfig.json"
      - "tsconfig.ratchet.json"
      - "biome.json"
      - ".fallowrc.jsonc"
      - "renovate.json5"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - ".config/**"
    workspace: []
    impliedBy: []
    deployTier: none

  ci:
    title: "CI workflows"
    category: infra
    paths: [".github/workflows/**"]
    workspace: []
    impliedBy: []
    deployTier: none
    reviewRisk: high

  review-config:
    title: "The AI reviewer's configuration and the catalog it is derived from"
    category: infra
    paths: [".config/ai-review.yaml", ".config/change-areas.yaml"]
    workspace: []
    impliedBy: []
    deployTier: none
    reviewRisk: high

  instructions:
    title: "Agent instruction files"
    category: docs
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "modules/AGENTS.md"
      - "modules/CLAUDE.md"
      - "plugin/AGENTS.md"
      - "plugin/CLAUDE.md"
    workspace: []
    impliedBy: []
    deployTier: none
    reviewRisk: high

  website:
    title: "The jig-harness.dev website"
    # Published documentation: a change here or in what the site renders
    # runs the website job, not the gate set on every operating system.
    category: docs
    paths: ["website/**"]
    workspace: []
    # The site renders the documents, the skills' pages and the audit sheet,
    # so a change to any of them can break its build.
    impliedBy:
      [docs, instructions, plugin, plugin-manifests, drive-pr, resolve-review-comments, do-item, audit-scoring, toolchain]
    deployTier: none

  docs:
    title: "Documentation and vendored seed material"
    category: docs
    paths:
      - "*.md"
      - "LICENSE"
      - "LICENSE-MIT-0"
      - "NOTICE"
      - "modules/*.md"
      - "modules/*/*.md"
      - "adoption/**"
      - "assets/**"
      - "audit/**"
      - "changes/**"
      - "design/**"
      - "docs/**"
      - "principles/**"
      - "profiles/**"
      - "seeds/**"
    workspace: []
    impliedBy: []
    deployTier: none
