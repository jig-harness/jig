      ownTests: "bun run test ./plugin/gc/"

  # The tracker also imports file-issue's helpers; that edge is left out
  # because file-issue imports the tracker back and the catalog allows no
  # cycle. file-issue lists do-item, which holds these paths too.
  tracker:
    title: "The tracker interface and its adapters"
    category: library
    paths: ["plugin/skills/do-item/scripts/lib/tracker/**"]
    workspace: []
    impliedBy: [drive-pr, plugin-shared, shared-lib, toolchain]
