        command: "bun tools/protocol/generate.ts"
        check: "bun tools/protocol/generate.ts --check"
        notes: >-
          Each chapter's prose outside its markers, and the index page's
          introduction, are written by hand: only the title, the status line
          and the sections between `<!-- protocol:generated source=… -->` and
          `<!-- /protocol:generated -->` are derived. The JSON data files
          carry no generated header, so this entry is their marker. The
          check also compares each chapter the integration branch holds as
          stable with its data file at the merge base, so a clone too shallow
          to hold the merge base fails it until fetched. The source lists
          every file a chapter's sections import, directly or through the
          files they import, which tools/protocol/__tests__/sources.test.ts
          holds to the code.
          The check also reads the drive's held restatements and code
          bindings through its compiler-backed consistency check; these
          inputs are listed alongside the generated tables' sources.

  dashboard:
    title: "The source of the page jig dispatch dashboard serves"
    # Built into plugin/dispatch/dashboard-page/, whose generated-file entry
    # lists this source; the page reads the dispatcher's types.
    category: tooling
    paths: ["dashboard/**"]
    workspace: []
    impliedBy: [plugin, shared-lib, toolchain]
    deployTier: none
    validation:
      profile: area
      ownTests: "bun run test ./dashboard/"

  module-reference:
    title: "Module reference code"
    category: tooling
    paths: ["modules/*/reference/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none
    validation:
      profile: area
      ownTests: "bun run test ./modules/"
    reviewRisk: high
    generated:
      - outputs: ["modules/M2-generated-artifact-freshness/reference/triad/fixture/docs/index.md"]
        source:
          - "modules/M2-generated-artifact-freshness/reference/triad/generate-index.ts"
          - "modules/M2-generated-artifact-freshness/reference/triad/fixture/docs/**/*.md"
        command: "bun modules/M2-generated-artifact-freshness/reference/triad/generate-index.ts modules/M2-generated-artifact-freshness/reference/triad/fixture/docs"
        check: "bun modules/M2-generated-artifact-freshness/reference/triad/check-index-fresh.ts modules/M2-generated-artifact-freshness/reference/triad/fixture/docs"
        notes: "The triad's worked example: its fixture index is itself a derived file."

  module-templates:
    title: "Module templates"
    category: tooling
    paths: ["modules/*/templates/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none
    validation:
      profile: area
      ownTests: "bun run test ./modules/"

  toolchain:
    title: "Toolchain, configuration and CI"
    category: infra
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "lefthook.yml"
      - "tsconfig.json"
      - "tsconfig.ratchet.json"
      - "biome.json"
      - ".fallowrc.jsonc"
      - "renovate.json5"
      - ".sonarcloud.properties"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - ".config/**"
      - "label-taxonomy.yaml"
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: deep
    generated:
      - outputs: ["bun.lock"]
        source: ["package.json"]
        command: "bun install"
        check: "bun install --frozen-lockfile --dry-run --silent"
        notes: >-
          Fails when the lockfile no longer matches package.json (CI installs
          with --frozen-lockfile as well); an edit that keeps the two in
          agreement passes. No generated header: the file must stay what bun
          writes.

  ci:
    title: "CI workflows"
    category: infra
    paths: [".github/workflows/**"]
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: deep
    reviewRisk: high

  scanner-policy:
    title: "What the code scanners analyse and skip"
    category: infra
    paths: [".sonarcloud.properties", ".github/codeql/**"]
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: deep
    reviewRisk: high

  review-config:
    title: "The AI reviewers' configuration and the catalog it is derived from"
    category: infra
    paths: [".config/ai-review.yaml", ".config/change-areas.yaml", ".coderabbit.yaml"]
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: deep
    reviewRisk: high
    generated:
      - outputs: [".config/ai-review.yaml"]
        source: [".config/change-areas.yaml", "scripts/review-risk.ts"]
        command: "bun scripts/review-risk.ts --write"
        check: "bun scripts/review-risk.ts --check"
        notes: >-
          Only its high_risk_path_patterns block is derived (one pattern per
          path glob of every reviewRisk: high area); the rest of the file is
          written by hand.

  instructions:
    title: "Agent instruction files"
    category: docs
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "modules/AGENTS.md"
      - "modules/CLAUDE.md"
      - "plugin/AGENTS.md"
      - "plugin/CLAUDE.md"
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: docs
    reviewRisk: high

  website:
    title: "The jig-harness.dev website"
    # A change here or in what the site reads runs the website steps of the
    # gate-set job.
    category: docs
    paths: ["website/**"]
    workspace: []
    # The site reads the files `site-sources` lists, imports the shared
    # library, and builds with the toolchain.
    impliedBy: [site-sources, plugin-manifests, shared-lib, plugin-shared, toolchain]
    deployTier: none
    validation:
      profile: area
      ownTests: "bun run test ./website/"
      separateSuite: true
    generated:
      - outputs: ["website/bun.lock"]
        source: ["website/package.json"]
        command: "bun install --cwd website"
        check: "bun install --cwd website --frozen-lockfile --dry-run --silent"
        notes: >-
          The website steps in gates.yml and the deploy in website.yml install
          with --frozen-lockfile in website/, with the same limit as the root
          lockfile's entry.

  site-sources:
    title: "What the website reads from the rest of the repository"
    # Part of `docs`, `plugin` and the module areas: the documents the site
    # renders or parses (website/src/content.config.ts and
    # website/src/lib/data/index.ts), and the audit skill with the code its
    # renderer imports, whose criteria, profiles and fixtures the build
    # renders the module pages with, and the code-stats skill's script with
    # the configuration it reads, which the build runs for the code
    # statistics page. A document's
    # link to any other file is checked by the gate set's link check, not by
    # the site's build. website/scripts/site-inputs.test.ts fails when the site's
    # build imports, or its content collection or a read takes in, a
    # file that does not select the website.
    category: docs
    paths:
      - "README.md"
      - "FACTORY.md"
      - "FEATURES.md"
      - "GLOSSARY.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "adoption/*.md"
      - "profiles/README.md"
      - "principles/*.md"
      - "modules/README.md"
      - "modules/M*/README.md"
      - "modules/M*/mappings.md"
      - "plugin/README.md"
      - "plugin/CONFIGURATION.md"
      - "plugin/EXTENDING.md"
      - "plugin/MECHANISMS.md"
      - "plugin/protocol/**"
      - "plugin/skills/*/SKILL.md"
      - "plugin/skills/*/README.md"
      - "plugin/skills/audit/**"
      - "plugin/skills/decide/scripts/sheet-kit/**"
      - "plugin/skills/adr/scripts/locate.ts"
      - "plugin/skills/code-stats/scripts/**"
      - ".config/jig.yaml"
      - "plugin/agents/*.md"
      - "tools/*/README.md"
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: docs

