# Jig's change-area catalog (module M3): the one place that maps this
# repository's paths to named change-areas. The CI workflow reads area names
# from scripts/change-areas.ts, never these globs: the drive-pr suite runs
# when the `drive-pr` area is affected. The gate set runs on Linux for every
# change whatever its areas, and the nightly workflow runs it on macOS and
# Windows without reading this catalog.
#
# Every tracked file belongs to at least one area (`bun run gates` fails
# otherwise). When unsure whether one area depends on another, add the
# `impliedBy` edge: a redundant CI job is cheap, a skipped one is not.
#
# Its schema, resolver and invariants are the plugin's change-areas skill
# (plugin/skills/change-areas/README.md); scripts/change-areas.ts adds Jig's
# policy on top. Field reference: modules/M3-change-area-catalog/reference/catalog/README.md.
# `vocabularies:` closes the open fields: `category` is one of skill,
# library, tooling, infra, docs; `deployTier` is `plugin` for what ships in a
# plugin version and `none` otherwise. A value outside them fails the gates.
# `reviewRisk: high` (optional, a field Jig's script adds to the schema) puts
# the area's paths in the AI reviewer's high-risk list: scripts/review-risk.ts
# writes them into .config/ai-review.yaml, and the gates fail when the two
# differ. A file may belong to several areas, so a narrow area can mark part
# of a broader one.
# An area's `generated:` list declares the derived files it owns, in M2's
# inventory format (outputs, source, command, check): scripts/check-generated-files.ts
# runs every declared check through M2's runner, so a derived file is added
# with its check or not at all (CONTRIBUTING.md § Derived files). A change to
# an entry's `source` seeds the area too.

vocabularies:
  category: [skill, library, tooling, infra, docs]
  deployTier: [plugin, none]

areas:
  drive-pr:
    title: "drive-pr skill"
    category: skill
    paths: ["plugin/skills/drive-pr/**"]
    workspace: []
    # Its scripts import the plugin's shared code and spawn the other two
    # skills' scripts, and its tests run with the shared test preloads and
    # the toolchain.
    impliedBy: [resolve-review-comments, do-item, plugin-shared, shared-lib, toolchain]
    deployTier: plugin

  resolve-review-comments:
    title: "resolve-review-comments skill"
    category: skill
    paths: ["plugin/skills/resolve-review-comments/**"]
    workspace: []
    impliedBy: [plugin-shared, shared-lib, toolchain]
    deployTier: plugin

  do-item:
    title: "do-item skill"
    category: skill
    paths: ["plugin/skills/do-item/**"]
    workspace: []
    impliedBy: [resolve-review-comments, plugin-shared, shared-lib, toolchain]
    deployTier: plugin

  plugin:
    title: "The plugin: other skills, agents, manifests and documentation"
    category: skill
    paths: ["plugin/**", ".claude-plugin/**", ".agents/**"]
    workspace: []
    impliedBy: [plugin-shared, shared-lib, toolchain]
    deployTier: plugin
    generated:
      - outputs: ["plugin/LICENSE", "plugin/NOTICE"]
        source: ["LICENSE", "NOTICE"]
        command: "cp LICENSE NOTICE plugin/"
        check: "git diff --no-index --exit-code LICENSE plugin/LICENSE && git diff --no-index --exit-code NOTICE plugin/NOTICE"
        notes: >-
          The plugin installs only plugin/, so it carries byte copies of the
          root licence files; scripts/check-licences.ts compares them as well.

  plugin-shared:
    title: "The plugin's shared code: what more than one skill imports"
    category: library
    paths: ["plugin/shared/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: plugin
    generated:
      - outputs:
          - "plugin/shared/vendor/js-yaml.mjs"
          - "plugin/shared/vendor/js-yaml.LICENSE"
        source: ["package.json", "bun.lock"]
        command: "cp node_modules/js-yaml/dist/js-yaml.mjs plugin/shared/vendor/js-yaml.mjs && cp node_modules/js-yaml/LICENSE plugin/shared/vendor/js-yaml.LICENSE"
        check: "git diff --no-index --exit-code node_modules/js-yaml/dist/js-yaml.mjs plugin/shared/vendor/js-yaml.mjs && git diff --no-index --exit-code node_modules/js-yaml/LICENSE plugin/shared/vendor/js-yaml.LICENSE"
        notes: >-
          The plugin runs from a copy without node_modules, so the plugin ships
          js-yaml's own build, byte for byte (no generated header: the file
          must stay what its generator writes). After updating js-yaml, copy
          it again. tools/plugin/plugin.test.ts compares both files with the
          installed js-yaml as well.

  plugin-manifests:
    title: "The plugin manifests: name, version and description"
    category: skill
    paths: ["plugin/.claude-plugin/**", "plugin/.codex-plugin/**"]
    workspace: []
    impliedBy: []
    deployTier: plugin
    reviewRisk: high

  audit-scoring:
    title: "How the audit scores: its scripts, criteria, schema and method"
    category: skill
    paths:
      - "plugin/skills/audit/scripts/**"
      - "plugin/skills/audit/config-schema.yaml"
      - "plugin/skills/audit/references/methodology.md"
      - "plugin/skills/audit/references/survey-prompts/**"
      - "plugin/skills/audit/criteria/M*.yaml"
    workspace: []
    impliedBy: []
    deployTier: plugin
    reviewRisk: high

  shared-lib:
    title: "Shared library and test preloads"
    category: library
    paths: ["lib/**", "plugin/shared/**"]
    workspace: []
    impliedBy: []
    deployTier: none
    generated:
      - outputs: ["lib/vendor/js-yaml.mjs", "lib/vendor/js-yaml.LICENSE"]
        source: ["package.json", "bun.lock"]
        command: "cp node_modules/js-yaml/dist/js-yaml.mjs lib/vendor/js-yaml.mjs && cp node_modules/js-yaml/LICENSE lib/vendor/js-yaml.LICENSE"
        check: "git diff --no-index --exit-code node_modules/js-yaml/dist/js-yaml.mjs lib/vendor/js-yaml.mjs && git diff --no-index --exit-code node_modules/js-yaml/LICENSE lib/vendor/js-yaml.LICENSE"
        notes: >-
          A second copy of the plugin's vendored parser, because lib/ is
          vendored without plugin/; lib/module-gates.test.ts compares both
          files with the installed js-yaml as well.

  gates:
    title: "Repository gates and their self-tests"
    category: tooling
    paths: ["scripts/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none
    reviewRisk: high

  repo-skills:
    title: "Jig's own skills, for work on this repository"
    category: docs
    paths: [".claude/**"]
    workspace: []
    # Their scripts live in scripts/, with the repository's other tooling.
    impliedBy: []
    deployTier: none
    reviewRisk: high

  tools:
    title: "Machine-level tools"
    category: tooling
    paths: ["tools/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none

  module-reference:
    title: "Module reference code"
    category: tooling
    paths: ["modules/*/reference/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none
    reviewRisk: high
    generated:
      - outputs: ["modules/M2-generated-artifact-freshness/reference/triad/fixture/docs/index.md"]
        source:
          - "modules/M2-generated-artifact-freshness/reference/triad/generate-index.ts"
          - "modules/M2-generated-artifact-freshness/reference/triad/fixture/docs/**/*.md"
        command: "bun modules/M2-generated-artifact-freshness/reference/triad/generate-index.ts modules/M2-generated-artifact-freshness/reference/triad/fixture/docs"
        check: "bun modules/M2-generated-artifact-freshness/reference/triad/check-index-fresh.ts modules/M2-generated-artifact-freshness/reference/triad/fixture/docs"
        notes: "The triad's worked example: its fixture index is itself a derived file."
      - outputs:
          - "modules/M4-docs-governance/reference/index/fixtures/docs/INDEX.md"
          - "modules/M4-docs-governance/reference/index/fixtures/docs/.orphans.md"
        source:
          - "modules/M4-docs-governance/reference/index/generate-index.ts"
          - "modules/M4-docs-governance/reference/index/fixtures/docs/**/*.md"
        command: "bun exec \"DOCS_DIR=modules/M4-docs-governance/reference/index/fixtures/docs bun modules/M4-docs-governance/reference/index/generate-index.ts\""
        check: "bun exec \"DOCS_DIR=modules/M4-docs-governance/reference/index/fixtures/docs bun modules/M4-docs-governance/reference/index/generate-index.ts --check\""
        notes: >-
          One generator writes both (Bun's shell sets the variable on every
          operating system); the orphan report's date is sticky, so it changes
          only when the report's content does.

  module-templates:
    title: "Module templates"
    category: tooling
    paths: ["modules/*/templates/**"]
    workspace: []
    impliedBy: [shared-lib, toolchain]
    deployTier: none

  toolchain:
    title: "Toolchain, configuration and CI"
    category: infra
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "lefthook.yml"
      - "tsconfig.json"
      - "tsconfig.ratchet.json"
      - "biome.json"
      - ".fallowrc.jsonc"
      - "renovate.json5"
      - ".gitattributes"
      - ".gitignore"
      - ".github/**"
      - ".config/**"
    workspace: []
    impliedBy: []
    deployTier: none
    generated:
      - outputs: ["bun.lock"]
        source: ["package.json"]
        command: "bun install"
        check: "bun install --frozen-lockfile --dry-run --silent"
        notes: >-
          Fails when the lockfile no longer matches package.json (CI installs
          with --frozen-lockfile as well); an edit that keeps the two in
          agreement passes. No generated header: the file must stay what bun
          writes.

  ci:
    title: "CI workflows"
    category: infra
    paths: [".github/workflows/**"]
    workspace: []
    impliedBy: []
    deployTier: none
    reviewRisk: high

  review-config:
    title: "The AI reviewers' configuration and the catalog it is derived from"
    category: infra
    paths: [".config/ai-review.yaml", ".config/change-areas.yaml", ".coderabbit.yaml"]
    workspace: []
    impliedBy: []
    deployTier: none
    reviewRisk: high
    generated:
      - outputs: [".config/ai-review.yaml"]
        source: [".config/change-areas.yaml", "scripts/review-risk.ts"]
        command: "bun scripts/review-risk.ts --write"
        check: "bun scripts/review-risk.ts --check"
        notes: >-
          Only its high_risk_path_patterns block is derived (one pattern per
          path glob of every reviewRisk: high area); the rest of the file is
          written by hand.

  instructions:
    title: "Agent instruction files"
    category: docs
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "modules/AGENTS.md"
      - "modules/CLAUDE.md"
      - "plugin/AGENTS.md"
      - "plugin/CLAUDE.md"
    workspace: []
    impliedBy: []
    deployTier: none
    reviewRisk: high

  website:
    title: "The jig-harness.dev website"
    # A change here or in what the site reads runs the website steps of the
    # gate-set job.
    category: docs
    paths: ["website/**"]
    workspace: []
    # The site reads the files `site-sources` lists, imports the shared
    # library, and builds with the toolchain.
    impliedBy: [site-sources, plugin-manifests, shared-lib, plugin-shared, toolchain]
    deployTier: none
    generated:
      - outputs: ["website/bun.lock"]
        source: ["website/package.json"]
        command: "bun install --cwd website"
        check: "bun install --cwd website --frozen-lockfile --dry-run --silent"
        notes: >-
          The website steps in gates.yml and the deploy in website.yml install
          with --frozen-lockfile in website/, with the same limit as the root
          lockfile's entry.

  site-sources:
    title: "What the website reads from the rest of the repository"
    # Part of `docs`, `plugin` and the module areas: the documents the site
    # renders or parses (website/src/content.config.ts and
    # website/src/lib/data/index.ts), and the audit skill with the code its
    # renderer imports, whose criteria, profiles and fixtures the build
    # renders the module pages with. A document's
    # link to any other file is checked by the gate set's link check, not by
    # the site's build. website/scripts/site-inputs.test.ts fails when the site's
    # build imports, or its content collection or a read takes in, a
    # file that does not select the website.
    category: docs
    paths:
      - "README.md"
      - "FACTORY.md"
      - "FEATURES.md"
      - "GLOSSARY.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "adoption/*.md"
      - "profiles/README.md"
      - "principles/*.md"
      - "modules/README.md"
      - "modules/M*/README.md"
      - "modules/M*/mappings.md"
      - "plugin/README.md"
      - "plugin/CONFIGURATION.md"
      - "plugin/EXTENDING.md"
      - "plugin/skills/*/SKILL.md"
      - "plugin/skills/*/README.md"
      - "plugin/skills/audit/**"
      - "plugin/skills/decide/scripts/sheet-kit/**"
      - "plugin/skills/adr/scripts/locate.ts"
      - "plugin/agents/*.md"
      - "tools/*/README.md"
    workspace: []
    impliedBy: []
    deployTier: none

  docs:
    title: "Documentation and vendored seed material"
    category: docs
    paths:
      - "*.md"
      - "LICENSE"
      - "LICENSE-MIT-0"
      - "NOTICE"
      - "modules/*.md"
      - "modules/*/*.md"
      - "adoption/**"
      - "assets/**"
      - "audit/**"
      - "changes/**"
      - "design/**"
      - "docs/**"
      - "principles/**"
      - "profiles/**"
      - "seeds/**"
    workspace: []
    impliedBy: []
    deployTier: none
