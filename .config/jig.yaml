# Jig's own values for its skills, read at run time by the plugin
# (plugin/README.md § Configure a repository). Jig uses its own skills
# on its pull requests like any other consumer.
gc:
  # What the machine-level resource collector (`jig gc`) may inspect here:
  # the worktrees Orca opens, in the one root every clone on a machine uses.
  # Relative roots resolve from the clone's primary checkout. The audit and
  # the collector skip a root that does not exist on a machine, but
  # `drive-pr` creates the working tree for a pull request that has none
  # under the first root, creating the root too. A machine laid out
  # differently adds its root to this list on the base branch and reinstalls
  # `jig gc`: collection reads only this declaration, within the bounds
  # install confirmed, so a root named only in the environment layer would
  # hold trees it never collects.
  kinds: [tool-state, worktrees]
  worktree_roots:
    - ../../orca/workspaces/jig
    - .claude/worktrees # Claude Code's isolated subagent worktrees, inside the clone
dispatch:
  # What `jig dispatch` wants after a merge here: Jig's own post-merge pass.
  followup_command: /followup
  # The dispatcher's state on every pull request it manages (`jig:driving`,
  # `jig:converged`, `jig:parked`, `jig:stale`, `jig:held`, `jig:followed-up`), and a
  # person's commands: `jig:drive` arms a drive on a pull request with
  # no ledger, `jig:hold` keeps every stage off one. The host's
  # `jig install dispatch --repo <clone> --yes` creates the labels.
  labels:
    enabled: true
  # Drive the maintainers' own recent pull requests (updated within a week,
  # drafts included) without waiting for a `jig:drive` label; `jig:hold`
  # keeps one out. The authors are named because the host opens pull
  # requests under one login and reads the forge under another.
  adopt:
    enabled: true
    authors: [liqweed, ophir-docomply]
design_brief:
  # Where finished design bundles land, one folder per flow, and what the
  # design-handback landing check needs. The browser script finds the
  # machine's Chromium; `JIG_CHROMIUM`, or the environment layer's
  # `JIG__design_brief__handback__browser_executable`, names another.
  prototypes: design/prototypes
  handback:
    widths: [390, 1440]
    rubric: design/prototypes/rubric.md
    scorecard: design/prototypes/dispatch-dashboard.scorecard.md
    browser_executable: tools/design/chromium.sh
gates:
  command: bun run gates
review:
  bots: ["docomply-review[bot]", "coderabbitai[bot]", "github-advanced-security[bot]"]
  # Naming the reviewer's app is what makes drive-pr wait for its review.
  reviewer_app: docomply-review
  repo_label: jig
  repo_slug: jig-harness/jig
  # The labels a deferred review finding may carry, from label-taxonomy.yaml.
  taxonomy:
    types: [bug, feature, infra, docs, chore]
    repos: [jig]
    sizes: [xs, small]
    context_prefixes: ["area:"]
    ownership_prefixes: ["area:"]
    categories:
      [correctness, data-integrity, security, compliance, ux, performance, tests, docs, drift, style]
issue_tracker:
  # Jig's work is the repository's own GitHub Issues: keys are `#<n>`, an
  # open state is a `state:` label; facets use GitHub's own fields below.
  adapter: github
  states:
    triage: "state:triage"
    backlog: "state:backlog"
    in_progress: "state:in-progress"
    in_review: "state:in-review"
    ops_pending: "state:ops-pending"
  file_command: /jig:file-issue
  # The work types do-item derives from an issue's native type: the taxonomy's
  # types, the docs, chore and infra ones all being Task work.
  types:
    bug: [bug]
    feature: [feature]
    task: [docs, chore, infra]
  # Declared, not left to the default, so fleet health measures follow-ups.
  labels:
    followup: pr-followup
    epic: epic
  # Type, priority and size are kept in the organization's issue types and
  # its Priority and Effort fields, whose options are the taxonomy's types
  # and sizes (design/tracker-facets.md, "Jig's own repository"). Named, so
  # no read waits on detecting the stores.
  facets:
    type: { store: native }
    priority: { store: native }
    size: { store: field, field: Effort }
do_item:
  agents:
    # The tracker's `area:` labels that name one catalog area, so
    # `/jig:work-batch` can draw a batch from an area. A label whose subject
    # has no area of its own in the catalog (the other skills, `area:tracker`,
    # `area:dispatch`, `area:modules`, which spans the reference, templates and
    # module pages) is left out: mapping it to one broader or narrower
    # area would pool unrelated issues or miss related ones.
    codearea_areas:
      "area:drive-pr": drive-pr
      "area:do-item": do-item
      "area:resolve-review-comments": resolve-review-comments
      "area:plugin": plugin
      "area:shared": plugin-shared
      "area:gates": gates
      "area:tools": tools
      "area:website": website
pull_requests:
  # One pull request per change against main; a person merges.
  stacking: none
drive:
  # Rounds a drive may spend before it stops unconverged. Jig's pull requests
  # are large and the AI reviewer keeps finding things in them, so the
  # built-in 10 is too tight.
  max_rounds: 30
  # The same catalog selects CI jobs (.github/workflows/gates.yml).
  change_areas_catalog: .config/change-areas.yaml
  # Review and drive use Jig's wrapper to validate its catalog extensions.
  validation_plan_command: bun scripts/validation-plan.ts
  # The AI reviewer reviews drafts, so pull requests open as drafts and
  # drive-pr marks them Ready after the first round
  # (CONTRIBUTING.md § Pull-request lifecycle).
  reviews_drafts: true
ci:
  # The check main's ruleset requires; the drive waits for it on the
  # converged head.
  required_checks: [gates]
  # While a pull request carries this label, gates.yml skips its jobs and
  # fails `gates`: drive-pr holds CI between review rounds and releases it at
  # convergence, so the expensive jobs run on the head the merge waits for.
  hold_label: ci:hold
changelog:
  # Jig keeps its changelog from change notes (changes/README.md): a pull
  # request a team using Jig would notice adds a note, and the release step
  # writes it after the merge.
  file: CHANGELOG.md
  format: keep-a-changelog
  # The plugin is the released artifact: both manifests carry its version.
  version:
    files:
      - { path: plugin/.claude-plugin/plugin.json, key: version }
      - { path: plugin/.codex-plugin/plugin.json, key: version }
  # A change under plugin/ ships only in a release.
  release_paths: [plugin/]
  # A criterion or configuration field records the version that added it; its
  # branch writes `since: next` and the release names the version.
  placeholders:
    - files:
        - plugin/skills/audit/criteria/*.yaml
        - plugin/skills/audit/config-schema.yaml
      from: "since: next"
      to: "since: {version}"
code_stats:
  # What Jig is made of, for `/jig:code-stats` and the report the website
  # renders from its JSON. The default areas assume a product in the root
  # folders; Jig's product is the plugin, the practice modules, the website
  # and the template seeds, so those four are the `production` area, and
  # everything that supports them has an area of its own. First match wins.
  areas:
    - name: scaffolding
      description: Agent instructions and skills for working on this repository
      paths:
        - ".claude/**"
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
    - name: production
      description: What Jig ships, the plugin, the practice modules, the website and the template seeds
      paths:
        - ".claude-plugin/**"
        - ".agents/plugins/**"
        - "plugin/**"
        - "dashboard/**"
        - "modules/**"
        - "website/**"
        - "seeds/**"
        - "assets/**"
    - name: ci
      description: Pipelines, workflows and the actions they share
      paths: [".github/workflows/**", ".github/actions/**"]
    - name: repo-config
      description: Repository settings, manifests, lockfiles and linter configuration
      paths:
        - ".config/**"
        - ".github/**"
        - ".*"
        - "*.json"
        - "*.jsonc"
        - "*.json5"
        - "*.toml"
        - "*.yaml"
        - "bun.lock"
        - "lefthook.yml"
    - name: tools
      description: Gates, scripts and test helpers that develop Jig and do not ship
      paths: ["tools/**", "scripts/**", "lib/**"]
    - name: design
      description: Design records and the design prototypes
      paths: ["design/**"]
    - name: docs
      description: Documents about Jig, its principles, decisions and how to adopt it
      paths:
        - "docs/**"
        - "principles/**"
        - "adoption/**"
        - "profiles/**"
        - "audit/**"
        - "changes/**"
        - "*.md"
        - "LICENSE*"
        - "NOTICE"
  default_area: production
  kinds:
    docs: ["**/LICENSE*", "**/NOTICE"]
    # Built from dashboard/src by `bun dashboard/build.ts`.
    generated: ["plugin/dispatch/dashboard-page/**"]
  # The plugin's skills and runtime components, each practice module, and the
  # root folders that are a unit of their own.
  modules:
    - "plugin/skills/*"
    - "plugin/*"
    - "modules/*"
    - "tools/*"
    - "design/*"
    - "*"
