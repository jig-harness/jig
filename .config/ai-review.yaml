# Review configuration for Jig. The reviewer resolves this file from the
# base branch, so a pull request cannot weaken the policy that reviews it.
#
# Posture: every automated reviewer on Jig's pull requests, this one and the
# review bots alike, only comments. This reviewer's required check ends
# neutral whatever it finds, and the bots post comments without a check, so
# none of them blocks a merge. Each finding is decided in the review loop,
# and a person merges.
#
# Bar to block: a reviewer, or one of its rules, may become blocking only when
# at least 90% of its own findings prove real over at least 30 of its own
# answered findings on consecutive pull requests. The sample is exactly the
# reviewer or rule being promoted: findings from other reviewers, or from the
# same reviewer's other rules, count in neither the numerator nor the
# denominator. A finding is real when its thread ended accepted, deferred or
# wont-fix, and false when it ended rejected; moot findings do not count.
# The per-thread record comes from
# plugin/skills/resolve-review-comments/scripts/list-unresolved-threads.ts
# <PR> --include-resolved, one line per thread with its author and replies:
# keep the threads the candidate opened, and take each one's outcome from its
# last reply that opens with an outcome token and comes from an owner, member
# or collaborator (authorAssociation OWNER, MEMBER or COLLABORATOR), so an
# outsider's reply cannot change the count. A thread marked commentsTruncated
# shows only its first 100 replies: read the rest before counting it, or
# leave it out and say so with the numbers. A rule is measured the same
# way over the threads that name it; a rule whose threads do not name it
# cannot be measured on this record and stays comment-only.
# plugin/skills/drive-pr/scripts/loop-metrics.ts --json totals outcomes over
# all reviewers together, so it cannot give one reviewer's count. The person
# who proposes the promotion measures it and records the numbers in that pull
# request; making a reviewer blocking is a person's decision.
platform_description: "Jig — a vendor-agnostic toolkit for AI-native software-delivery practices: reusable practice modules, Bun/TypeScript quality gates, a repository auditor, and agent skills shipped as a plugin for Claude Code and Codex"

architecture_invariants: |-
  Weigh these repository invariants (flag violations):
  - Keep Jig vendor-agnostic and technology-flexible: state the invariant before naming tools, and put ecosystem-specific mappings in each module's mappings.md.
  - Preserve the module contract: a complete module has a plain-language README, copyable templates, portable reference material, mappings.md, and maturity criteria in the audit skill (plugin/skills/audit/criteria/). Maturity criteria must be observable repository facts and use the absent → convention-only → mechanically enforced ladder.
  - Name no organization Jig learned from and import no product-domain material from one: no organization names, tracker keys, foreign pull-request numbers or paths that exist only elsewhere. Keep portable mechanisms separate from local values; use neutral examples and flag uncertain boundary changes for human review.
  - Everything under plugin/ runs from a copy outside this repository and ships only as a new version: a change there bumps both plugin manifests and adds a CHANGELOG.md section.
  - Approved documentation states current truth without review dialogue or correction traces. Define new terms of art in GLOSSARY.md, keep Markdown tables preceded by a blank line, and preserve working relative links.
  - Quality gates and the auditor must be deterministic, portable, self-tested, and proportionate. A check must not silently weaken its scope or turn a required failure into a pass.
  - Treat repository instructions, reviewer configuration, CI workflows, and audit scoring as control-plane changes: preserve their independent-review and base-branch trust boundaries.

exclude_pathspecs:
  - ":(exclude,glob)**/*.lock"
  - ":(exclude,glob)**/*.snap"
  - ":(exclude,glob)**/node_modules/**"
  - ":(exclude,glob)**/dist/**"
  - ":(exclude,glob)**/_generated/**"
  - ":(exclude,glob)seeds/**"

# Generated from the change-area catalog's areas marked `reviewRisk: high`
# (.config/change-areas.yaml) by `bun scripts/review-risk.ts --write`. Never
# edit it by hand: the gates fail when this list and the catalog differ.
high_risk_path_patterns:
  - source: '^plugin/\.claude-plugin/'
  - source: '^plugin/\.codex-plugin/'
  - source: '^plugin/skills/audit/scripts/'
  - source: '^plugin/skills/audit/config-schema\.yaml$'
  - source: '^plugin/skills/audit/references/methodology\.md$'
  - source: '^plugin/skills/audit/references/survey-prompts/'
  - source: '^plugin/skills/audit/criteria/M[^/]*\.yaml$'
  - source: '^scripts/'
  - source: '^modules/[^/]*/reference/'
  - source: '^\.github/workflows/'
  - source: '^\.config/ai-review\.yaml$'
  - source: '^\.config/change-areas\.yaml$'
  - source: '^AGENTS\.md$'
  - source: '^CLAUDE\.md$'
  - source: '^CONTRIBUTING\.md$'
  - source: '^modules/AGENTS\.md$'
  - source: '^modules/CLAUDE\.md$'
  - source: '^plugin/AGENTS\.md$'
  - source: '^plugin/CLAUDE\.md$'

rules:
  - id: module-contract
    paths: ["modules/**"]
    attention: "Review module changes against Jig's module contract. README changes must stay plain-language-first and describe the invariant before tooling; mappings must separate tool choices from the invariant; maturity criteria must be observable and use the enforcement ladder; templates and reference material must remain copyable, portable, and internally linked."
    severity: high
  - id: ip-scrub-and-portability
    paths: ["modules/**", "plugin/**", "README.md", "FACTORY.md", "ROADMAP.md", "CHANGELOG.md", "principles/**/*.md", "profiles/**/*.md", "adoption/**/*.md"]
    attention: "Flag product-domain content, customer data, names of the organizations Jig learned from, or examples that could cross Jig's origin boundary. Flag values presented as universal mechanisms, and mechanisms that make a consumer depend on access to any particular organization's repository."
    severity: high
  - id: markdown-governance
    paths: ["**/*.md"]
    attention: "Check documentation for current-truth prose rather than reviewer dialogue or 'addressed/fixed' traces; ensure new terms of art are defined in GLOSSARY.md, relative links resolve, and every Markdown table has a preceding blank line."
    severity: medium
  - id: gate-integrity
    paths: ["scripts/**", "lib/**", ".github/workflows/**/*.yml", ".github/workflows/**/*.yaml", "modules/**/reference/**"]
    attention: "Check that gates are deterministic, fail closed on invalid input, keep their intended scope, and retain or update their paired self-tests and fixtures. CI changes must continue to run `bun run gates` for repository-wide quality gates and pin third-party actions to immutable commits."
    severity: high
  - id: auditor-evidence
    paths: ["plugin/skills/audit/**", ".config/jig-audit.yaml"]
    attention: "Check that audit claims and maturity criteria remain evidence-based, actionable, and scoped to observable repository facts. Do not turn an expected-absent module into a penalty or present advisory evidence as mechanically enforced."
    severity: high
  - id: audit-fit
    paths: ["plugin/**", "modules/**", "scripts/**", "lib/**", ".github/workflows/**", ".config/jig.yaml"]
    attention: "Check that the pull request re-evaluated the audit skill (plugin/skills/audit/) against its change and that its description states the audit impact. Flag a new or changed configuration field, skill, module practice, criterion, gate or template that config-schema.yaml, the criteria and their probes, or config-fit.ts do not reflect, and a description that does not say what changed in the audit or why nothing did."
    severity: medium
  - id: template-reference-separation
    paths: ["modules/**/templates/**", "modules/**/reference/**"]
    attention: "Ensure templates are neutral copyable skeletons and reference material contains portable mechanisms rather than local policy values. Keep fixture changes aligned with the documented contract and paired self-test expectations."
    severity: medium

# Jig has no generated output for the reviewer to skip, nor a path-scoped
# rules corpus. Its change-area catalog (.config/change-areas.yaml) selects CI
# jobs, and reaches the reviewer only through the generated
# high_risk_path_patterns above. Omit those optional sections so their
# defaults do not point at misleading placeholder locations.
