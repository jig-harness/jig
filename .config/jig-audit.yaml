    score: convention
    evidence: "The check-* scripts have fixture self-tests in scripts/gates.test.ts and Jig's GritQL rules have fixtures in tools/quality/grit/fixtures; all run in required CI, but no pre-push hook runs them, so the local half is convention only"
  M1/escape-hatch-documented:   # standard, requires convention
