    score: mechanical
    evidence: ".github/workflows/gates.yml (pull_request) runs bun run gates on ubuntu/macos/windows plus drive-pr shards; its gates job is a required check on main (gh api branches/main/protection, strict)"
  M1/precommit-autofix-hooks:   # standard, requires mechanical
