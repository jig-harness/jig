# Jig audit record: written by /jig:audit, read by its next run.
# Each criterion carries its level, pass bar and statement as comments.
version: 1
plugin_version: 0.15.0
date: "2026-10-12"
commit: 02b4184ad72b9c446c9e7a8647a2b42f7b5940f0
shape: toolkit   # practice modules, Bun gates and an agent plugin released from main
profile: team-standard   # Jig is maintained by people and agents together
profile_conditions: [M12]   # several agents work it in parallel workspaces
criteria:
  # M0 instruction-architecture
  M0/universal-instruction-file:   # lite, requires convention
    # A vendor-neutral universal instruction file (AGENTS.md or equivalent) exists at the repo root and stays small (on the order of 150 lines).
    score: convention
    evidence: "AGENTS.md at root (134 lines), vendor-neutral ('Compatible with Claude Code, Codex, Cursor'); root CLAUDE.md (9 lines) is an @AGENTS.md pointer"
  M0/gates-and-guardrails-listed:   # lite, requires convention
    # The universal instruction file lists the quality gates (runnable commands) and the critical guardrails.
    score: convention
    evidence: "AGENTS.md 'Ways of working' lists `bun run gates` with ordered set matching scripts/gates.ts; guardrails: writing conventions, origin-reference rule, HITL list; plugin/AGENTS.md adds verify commands"
  M0/glossary-exists:   # lite, requires convention
    # A one-page domain glossary exists with canonical terms and explicit avoid-aliases, and the universal instruction file points to it.
    score: absent
    evidence: "GLOSSARY.md (519 lines) exists, is linked from AGENTS.md and gated by scripts/check-glossary-coverage.ts, but carries no 'avoid' aliases (grep -ci avoid GLOSSARY.md = 0), so the criterion as stated is not met"
  M0/tool-deltas-are-pointers:   # standard, requires convention
    # Every tool-specific instruction file (CLAUDE.md, .cursor rules, copilot-instructions.md, ...) carries only runtime-specific content and points back to the universal file, duplicating none of it.
    score: convention
    evidence: "CLAUDE.md, modules/CLAUDE.md, plugin/CLAUDE.md are only `@AGENTS.md` plus a no-delta note; no other tool files (no .cursor/, copilot-instructions, GEMINI.md in git ls-files)"
  M0/per-directory-instructions:   # standard, requires convention
    # Directories whose conventions differ from the repo default carry their own nested instruction file, and the universal file states the closest-file-wins policy.
    score: convention
    evidence: "modules/AGENTS.md and plugin/AGENTS.md add to the root file; AGENTS.md 'Read in this order' step 2 sends agents to the instructions closest to what they change"
  M0/conditional-rules-documented:   # standard, requires convention
    # If a conditional-rules directory exists, its README documents the loading semantics — path-frontmatter rules load on match, frontmatter-less rules always load — and each rule is scoped to the narrowest paths that cover it.
    score: expected-absent
    evidence: "No conditional-rules directory: git ls-files has no .claude/rules, .cursor/rules or .agents/rules; the criterion applies only where such rules exist"
  M0/dispositions-with-flip-conditions:   # standard, requires convention
    # Behavioral defaults (dispositions) are written down, and every disposition states the condition under which it flips.
    score: absent
    evidence: "git grep -il disposition outside templates/reference/fixtures hits only module docs, GLOSSARY.md, criteria yaml; no dispositions doc of Jig's own, none linked from AGENTS.md"
  M0/instruction-freshness-checked:   # strict, requires mechanical
    # Countable facts and referenced paths in instruction files are verified against reality by a CI check that fails on drift.
    score: convention
    evidence: "scripts/check-md-links.ts in `bun run gates` (required check 'gates') fails on broken Markdown links, but nothing re-derives countable facts such as AGENTS.md's ordered gate list against scripts/gates.ts, so the mechanical bar is not met"
  M0/instruction-set-owned:   # strict, requires convention
    # The instruction set has a named owner and a stated review cadence.
    score: absent
    evidence: "No CODEOWNERS (git ls-files), no owner or review cadence in or near AGENTS.md (git grep 'owner:|review cadence|last.review' on AGENTS files/README/ROADMAP: none)"
  # M1 gates-enforcement-ladder
  M1/gate-set-documented:   # lite, requires convention
    # An ordered gate set (format, lint, types, tests, build) is stated in one canonical place and runnable with a single command.
    score: convention
    evidence: "AGENTS.md § Ways of working lists the ordered set (format, lint, types, gate self-tests, build, links, tables, glossary, origin refs, changelog); package.json script gates runs scripts/gates.ts in that order"
  M1/ci-runs-gates-on-pr:   # lite, requires mechanical
    # CI runs the gate set on every pull request and a failing run blocks the merge.
