  M1/third-party-automation-pinned-and-updated:   # standard, requires mechanical
    # Third-party CI automation is pinned to immutable revisions and an automated updater proposes pin changes through the normal gate set.
    score: mechanical
    evidence: "gates.yml pins actions/checkout and jdx/mise-action to full SHAs; renovate.json5 pins digests for GitHub Actions, mise and Bun; Renovate's pull requests run the required gates check"
  M1/suppression-token-registry:   # strict, requires convention
    # A single registry page lists every suppression token a live gate honors, with syntax, consuming gate, placement, and justification requirement, plus a registration rule for new tokens.
    score: absent
    evidence: "No registry page; live tokens are scattered: biome-ignore comments, ! allow lines in scripts/tracker-key-patterns.txt, scripts/glossary-allowlist.txt (named only in passing in AGENTS.md)"
  M1/commit-msg-process-markers:   # strict, requires mechanical
    # Mandatory-review areas are enforced by a commit-msg hook requiring a review-marker tag when protected paths are staged, re-checked by a gate the committer cannot skip.
    score: absent
    evidence: "No commit-msg hook and no marker convention; AGENTS.md § HITL names protected areas in prose; .config/ai-review.yaml high_risk_path_patterns only steer the AI reviewer"
  M1/gate-self-tests-in-ci:   # strict, requires mechanical
    # CI runs each grep gate's self-test alongside the gate, so a silently broken gate fails the pipeline.
    # probe found: .github/workflows/gates.yml
    score: mechanical
    evidence: "scripts/gates.test.ts runs each check-* script against pass and fail fixtures in scripts/tests/fixtures/, in the bun run gates test step under the required gates check"
  M1/advisory-gates-carry-promotion-conditions:   # strict, requires convention
    # Every advisory (non-blocking) gate states its promotion condition and a review date; none is advisory indefinitely without one.
    score: convention
    evidence: "No continue-on-error/allow_failure in .github/workflows/gates.yml; rules at warn in biome.json and the flags in tsconfig.ratchet.json are ratcheted, and AGENTS.md § Ways of working states their promotion condition (promote at zero, which the ratchet reports)"
  M1/existing-findings-ratcheted:   # strict, requires mechanical
    # A rule that still has findings is ratcheted rather than left advisory: a required gate fails a change that adds a finding to it or loosens its configuration, measured against the merge base, and a rule whose count reaches zero is promoted to blocking.
    score: mechanical
    evidence: "bun run quality (modules/M1-gates-enforcement-ladder/reference/ratchet/ratchet.ts with tools/quality/ratchet.jsonc) runs inside bun run gates, the required gates check; it counts Biome warnings, GritQL rules, ratcheted compiler flags and suppression comments against the merge base and needs a Ratchet-Loosen trailer to loosen a rule"
