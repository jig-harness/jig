# Jig repository priorities record (`priorities/v1`).
# Read from `main` by the owner host's `jig dispatch` and validated against
# plugin/CONFIGURATION.md#the-priorities-record.
format: priorities/v1
level: repository
scope: jig-harness/jig
revision: 1
objectives:
  - id: upstream-issues
    class: core
    purpose: Route eligible issues reported from consumer repositories (labeled source:upstream) into the core lane so field friction is prioritized ahead of unallocated backlog work
    endState: Open source:upstream issues outside the urgent and assigned-bug lanes are ranked in the core lane ahead of unallocated non-upstream backlog items
    owner: jig maintainers
    epics:
      - scope: jig-harness/jig
        labels: ["source:upstream"]
