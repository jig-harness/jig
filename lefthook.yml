        - "plugin/skills/drive-pr/scripts/lib/driver/**"
        - "plugin/skills/drive-pr/scripts/lib/state/lease.ts"
        - "plugin/skills/drive-pr/scripts/lib/state/lease-model.ts"
        - "plugin/skills/drive-pr/__tests__/terminal-states-consistency.ts"
        - "plugin/skills/drive-pr/__tests__/terminal-states-dispatch.ts"
        - "plugin/skills/drive-pr/__tests__/terminal-state-source-files.ts"
        - "plugin/skills/drive-pr/__tests__/protocol-check.ts"
