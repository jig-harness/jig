# TEMPLATE — copy to your repo (e.g. metrics-registry.yaml) and replace the
# examples with the process metrics YOU roll up. This is the registry of process
# metrics: each one names the wired event/query behind it (`source`) and who is
# accountable for it (`owner`). Jig's no-dark-instruments gate
# (modules/M11-process-observability/reference/no-dark-instruments/) FAILS if
# any `source` is missing, empty, or
# a placeholder (TODO / tbd / dark / none / fixme) — a metric CLAIMED but not
# wired is a "dark instrument", and a dark instrument is worse than none.
#
# Every metric here should trace to an event_type in event-schema.yaml (or to a
# derived query over those events). Keep the registry the SSoT for "what we
# measure about our own process"; dashboards render from it.
#
#   id           stable kebab-case metric id (referenced by dashboards)
#   description   one line: what the number means
#   source        the WIRED event or query that computes it — the field the
#                 no-dark-instruments gate checks. NEVER leave this as TODO.
#   owner         the team/role accountable for keeping it lit
#   threshold     OPTIONAL — a target/alert value. The VALUE is repo-specific and
#                 stays with your repo (Jig ships the mechanism, not the
#                 number); omit or set per your context.

version: 1

metrics:
  # --- review outcomes + cost (M7 / M8) ---
  - id: review-adoption-rate
    description: share of merged PRs that received at least one automated review
    source: query:reviews_over_merges
    owner: <platform-team>

  - id: reviewer-cost-vs-catches
    description: review cost_unit against confirmed findings, per reviewer — the
      evidence for keeping, promoting, or dropping a reviewer (feeds M8 parity)
    source: join:review_completed+corpus_outcomes
    owner: <review-guild>

  # --- gate health (M1) ---
  - id: gate-pass-rate
    description: share of gate_result events with result=pass, per gate — a gate
      that fails constantly is noise; one that never fails may be theater
    source: event:gate_result
    owner: <platform-team>

  - id: ci-duration-trend
    description: rolling median of gate_result.duration_ms — catches CI slowdown
      before it becomes a tax on every PR
    source: event:gate_result.duration_ms
    owner: <build-team>

  # --- pipeline economy (M13) ---
  - id: ci-runner-minutes
    description: minutes a runner was held, summed per job and per pipeline over
      the window, from the provider's job records — where the time goes, and the
      number a resize or a dropped leg is measured in
    source: query:runner_minutes_per_job
    owner: <build-team>

  - id: ci-sandbox-minutes-share
    description: the remote-sandbox leg's runner-minutes over all runner-minutes
      in the window, a fraction from 0 to 1 — the leg a per-area opt-in is
      meant to keep small, read from the same job records as ci-runner-minutes
    source: query:sandbox_runner_minutes_share
    owner: <build-team>

  - id: ci-cost-per-change
    description: runner-minutes of every run on a change's heads and its
      post-merge run, over the merged changes of the window — the number that
      makes a per-push leg comparable with CI
    source: query:runner_minutes_over_merged_changes
    owner: <build-team>

  - id: ci-queue-wait
    description: minutes between a job's creation and its start, per job, from
      gate_result.queue_wait_ms over 60 000 — the queue-stall watchdog bounds
      the worst case, this trend sizes the pool
    source: query:queue_wait_minutes_per_job
    owner: <build-team>

  - id: ci-cache-hit-rate
    description: cache hits over hits plus misses per run, from the hit rate each
      run writes to its summary — a run at zero while others hit shows a cache
      that stores nothing or a namespace split, which nothing else reports
    source: event:gate_result.cache_hit_rate
    owner: <build-team>

  # --- delivery (M10) ---
  - id: promotion-gap-items
    description: work items whose commits the earlier environment's pointer
      holds and the later one's lacks, per environment pair
      (production..verified, what waits to be promoted to production),
      counted from git ancestry by M10's promotion-gap report rather than
      kept by hand in tracker fields
    source: query:promotion_gap_items
    owner: <delivery-lead>

  # --- scheduled automation (M11 heartbeat) ---
  - id: scheduled-jobs-red-or-stale
    description: scheduled jobs the heartbeat watcher classified red or stale
      at its last run — a stale job stopped running, which its last green
      result hides; the external monitor pages on the watcher's own silence
    source: event:heartbeat.red_or_stale_jobs
    owner: <platform-team>

  # --- flow (cycle time) ---
  - id: open-to-ready-cycle-time
    description: median elapsed_ms for cycle_time events at stage=open-to-ready
    source: event:cycle_time
    owner: <delivery-lead>
