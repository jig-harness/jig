# One output declared by two entries: a derived file is declared once.
generated:
  - outputs: ["out/report.txt"]
    source: ["src/*.txt"]
    command: "echo regenerate report"
    check: "exit 0"
  - outputs: ["out/report.txt"]
    source: ["src/a.txt"]
    command: "echo regenerate report again"
    check: "exit 0"
