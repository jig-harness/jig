name: CI
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha>
      - uses: oven-sh/setup-bun@<sha>
      # - uses: oven-sh/setup-bun@<sha>
      #   with:
      #     bun-version: 1.4.3
      - run: bun test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@<sha>
        with:
          bun-version: ""
      - uses: oven-sh/setup-bun@<sha>
        with:
          bun-version-file: .bun-version
      - run: bun run lint
