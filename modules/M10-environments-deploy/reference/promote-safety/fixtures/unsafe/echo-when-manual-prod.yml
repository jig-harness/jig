# UNSAFE (a): the production deploy fires on every push. The only `when: manual`
# is text inside a command string, which gates nothing.
name: deploy-production
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        run: echo 'when: manual' && ./deploy --target production
