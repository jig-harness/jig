# UNSAFE (a): production deploy fires automatically on every push to main, with
# no workflow_dispatch, no environment: approval, and no when: manual. Any merge
# ships straight to production. (No explicit mutable ref, so only (a) trips.)
name: deploy-production
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: ./deploy --target production
