# SAFE: quoted keys throughout; the production deploy job carries a protected
# environment, so the push run is gated.
name: deploy-production
"on":
  "push":
    branches: [main]
jobs:
  "deploy-prod":
    runs-on: ubuntu-latest
    "environment": production
    steps:
      - name: Deploy to production
        run: ./deploy --target production --ref refs/tags/verified
