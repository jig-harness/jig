# SAFE: a GitLab production-deploy job whose push rule is a flow mapping with
# quoted `"when": "manual"` and a quoted string containing commas.
deploy-production:
  stage: deploy
  script:
    - ./deploy --target production --ref refs/tags/verified
  rules:
    - { "if": '$CI_PIPELINE_SOURCE == "push" && $X == "a, b"', "when": "manual" }
