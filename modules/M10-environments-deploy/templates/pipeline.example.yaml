# pipeline.example.yaml — a provider-neutral sketch of the four-stage delivery
# spine (see ./CI-ARCHITECTURE.md). It is NOT a runnable config for any one CI
# provider; it is the shape, so you can see how the four workflows relate before
# you translate it to GitHub Actions / GitLab CI / etc. (per-provider wiring is
# in Jig's modules/M10-environments-deploy/mappings.md). Replace
# <placeholders> and the tool names with yours.

# ---------------------------------------------------------------------------
# STAGE 1 — PR gates. Runs on every pull request. Fast, diff-scoped, no secrets
# for fork PRs. These INFORM the human merge; they do not certify production.
# ---------------------------------------------------------------------------
pr_gates:
  on: pull_request
  runs:
    - format-and-lint
    - unit-tests
    - type-check
    - change-area-reviews        # M7: reviews selected by what changed (M3 catalog)
    - repo-gates                 # M1: links, tables, glossary, promote-safety lint, ...
    - heavy-suite-proxies        # cheap stand-ins for the scheduled suites, e.g. "the e2e images still build"
  # Optional but recommended: a disposable preview environment per PR.
  preview_environment:
    create: on_open              # spin up a full running copy at this commit
    url: https://pr-<number>.preview.<your-domain>
    seed: test-data-factory --tenant "pr-<number>"   # seeded + isolated per PR
    destroy: on_close            # cattle, not pets — torn down with the PR

# ---------------------------------------------------------------------------
# STAGE 2 — Post-merge verification. Runs on every push to the default branch.
# Heavy, integrated, and the ONLY thing allowed to advance the verified pointer.
# "Merged" is not "verified": this stage re-checks the integrated branch.
# ---------------------------------------------------------------------------
verify_default_branch:
  on:
    push:
      branches: [<default-branch>]
    dispatch: true               # the watchdog's heal, and a person, can start it
  # One run at a time per branch; a superseded pending run is dropped safely
  # because every run checks the WHOLE verified..HEAD range, never the tip alone.
  concurrency:
    one_at_a_time: true
    keyed_by: branch             # a dispatch from another ref gets its own slot
  changed_paths: git diff --name-only verified HEAD
  # Everything the pointer must wait for, and nothing else: this runs on every push.
  runs:
    - integration-tests-against-real-services
    - build-deployable-artifacts
    - e2e-critical-journeys        # when no other check covers a journey users depend on
    - migration-against-prod-like-db
    - smoke-deploy-to-throwaway-env
  on_success:
    # Advance the explicit `verified` pointer to this commit. Deploys read this.
    advance_pointer:
      name: verified             # e.g. `git tag -f verified <sha> && git push --force origin verified`
      to: ${commit_sha}

# ---------------------------------------------------------------------------
# STAGE 2b — The watchdog. Scheduled, not per-PR, on a runner pool other than
# stage 2's. Decides WHY the verified pointer lags: nothing to verify, verifying,
# blocked by failed gates, within the grace window, a dropped trigger (healed by
# dispatching stage 2 at the tip, the one cause it heals, until a budget of heals
# at that tip has ended without a verdict), ran but stale, or diverged; and whether a stage-2 run is stalled waiting for a runner (cancelled,
# and failed). See Jig's modules/M10-environments-deploy/reference/verified-pointer/.
# ---------------------------------------------------------------------------
verified_watchdog:
  on:
    schedule: "*/15 * * * *"     # every 15 minutes
  runs:
    - name: observe the pointer, the tip and the queue
      outputs: observation.txt   # ANCESTOR, CODE_AHEAD, UNVERIFIED_AGE_SECONDS, VERIFICATION, QUEUE_WAIT_SECONDS, HEAL_ATTEMPTS
    - name: decide by cause
      run: bun ./modules/M10-environments-deploy/reference/verified-pointer/check-verified-fresh.ts --max-heal-attempts 3 --output verdict observation.txt
  on_verdict:
    queue=stalled: cancel-the-run-holding-the-slot   # no gate bypassed: the next run covers the whole gap
    pointer=dropped-trigger: dispatch-verify_default_branch-at-tip
    anything-else-that-failed: page-on-call           # ran-but-stale, diverged, heal-exhausted, a stall, a check that could not decide

# ---------------------------------------------------------------------------
# Scheduled and on-demand suites. Slow suites no merge and no pointer move
# waits for run here, never per change; a dispatch runs one now when a change
# needs it. Their failures go where someone will see them.
# ---------------------------------------------------------------------------
scheduled_suites:
  on:
    schedule: "0 3 * * *"        # nightly
    dispatch: true               # on demand
  runs:
    - full-e2e-against-deployed-env   # the sweep beyond the critical journeys
  weekly:
    - coverage-trend             # published as a trend, not a per-change gate

# ---------------------------------------------------------------------------
# STAGE 3 — Deploy verified artifacts. Triggered when the verified pointer moves.
# Deploys WHAT THE POINTER POINTS AT — never a raw branch, never :latest — and is
# done only when the live environment reports that identity (verify_identity).
# ---------------------------------------------------------------------------
deploy_verified:
  on:
    pointer_advanced: verified
  jobs:
    resolve:
      # Resolve the pointer ONCE; every later job takes the commit from here.
      outputs:
        sha: $(git rev-parse refs/tags/verified)
    deploy:
      needs: resolve
      checkout:
        ref: ${needs.resolve.outputs.sha}   # the resolved commit, not a name
      # The artifact verification built, by digest; settings come at deploy time.
      run: deploy --target staging --image <registry>/<app>@<verified-digest> --config staging
    verify_identity:
      needs: deploy
      # Done only when the live environment reports what was shipped.
      runs:
        - live-identity-equals: <registry>/<app>@<verified-digest>
        - rollouts-ready: true              # e.g. kubectl rollout status
        - readiness-check: https://staging.<your-domain>/ready   # its critical dependencies, e.g. the database
      outputs:
        manifest: deploy-manifest.json      # what actually deployed: identities, rollout results

# ---------------------------------------------------------------------------
# STAGE 4 — Promotion to production. MANUAL + GATED. Never auto-fires. Ships the
# already-verified, already-deployed build — the exact commit and digest the
# gate approved. Enforced by Jig's promote-safety lint
# (modules/M10-environments-deploy/reference/promote-safety/).
# ---------------------------------------------------------------------------
promote_to_production:
  on:
    workflow_dispatch:           # a deliberate human action — not `push`
      from_ref: verified         # run the workflow's own definition from the trusted ref
  concurrency:
    one_at_a_time: true          # serialize promotions to production...
    drop_pending: false          # ...without discarding a queued request
  environment:
    name: production             # attach protection rules: required reviewers / wait timer
  jobs:
    gate:
      checkout:
        ref: refs/tags/verified  # gate code AND the commit, from the trusted pointer
      run: |
        ./gates/check-promotion
        # Refuse a stale promotion early: --ff-only alone accepts a commit
        # older than the release pointer as a no-op. Checked again under the lock.
        git merge-base --is-ancestor origin/<release-branch> HEAD
      outputs:
        sha: $(git rev-parse HEAD)          # the commit the gate approved
    lock:
      needs: gate
      # Held until earlier runs finish; fails a re-run, which keeps its earlier place.
      run: wait-until-earliest-active-promotion
    migrate:
      needs: [gate, lock]
      checkout:
        ref: ${needs.gate.outputs.sha}
      run: |
        check-still-earliest-active-promotion   # fail, don't wait: the lock again
        # An earlier promotion may have advanced the release pointer while this
        # one waited: refuse a gated commit older than it, before the first change.
        git fetch origin <release-branch> && git merge-base --is-ancestor FETCH_HEAD HEAD
        migrate --target production
    promote:
      needs: [gate, migrate]
      checkout:
        ref: ${needs.gate.outputs.sha}      # never `verified` again: it may have moved
      # Re-tag or copy the verified digest; never rebuild.
      run: promote --image <registry>/<app>@<verified-digest> --to production
    publish_rendered_state:
      needs: [gate, promote]
      # Rendered manifests: their own ref, written by one dedicated machine identity.
      run: |
        render --target production --image <registry>/<app>@<verified-digest> \
          | commit-to <release-state-ref> --as <release-state-writer>
    verify_identity:
      needs: publish_rendered_state
      runs:
        - live-identity-equals: <registry>/<app>@<verified-digest>
        - rollouts-ready: true
        - readiness-check: https://<your-domain>/ready   # its critical dependencies, e.g. the database
      outputs:
        manifest: deploy-manifest.json      # what actually deployed: identities, rollout results
    advance_release_pointer:
      needs: [gate, verify_identity]
      # Only once production runs the gated commit: a pure fast-forward to it.
      run: |
        git fetch origin <release-branch> && git checkout -B <release-branch> FETCH_HEAD
        git merge --ff-only ${needs.gate.outputs.sha}
        test "$(git rev-parse HEAD)" = "${needs.gate.outputs.sha}"
        git push origin HEAD:<release-branch>
