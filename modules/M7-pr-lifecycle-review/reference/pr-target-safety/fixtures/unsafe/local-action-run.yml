# UNSAFE: pull_request_target + an untrusted head-sha checkout + a LOCAL action
# (`uses: ./...`) and NO `run:` key. The local action is loaded and executed
# from the attacker-controlled checkout — the same secret-exfiltration path as a
# run: step — so the gate must catch it.
name: shadow-review
on: pull_request_target

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/review
