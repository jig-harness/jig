on: push
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4
      - run: make build
  expression:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT) }}
    steps:
      - run: make
  reusable:
    # A reusable-workflow call cannot carry timeout-minutes.
    uses: ./.github/workflows/called.yml
