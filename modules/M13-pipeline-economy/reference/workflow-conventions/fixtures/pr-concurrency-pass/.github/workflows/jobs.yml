on: pull_request_target
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: label-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4
      - run: make label
