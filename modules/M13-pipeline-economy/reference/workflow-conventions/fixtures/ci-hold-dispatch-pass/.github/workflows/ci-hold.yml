on:
  pull_request:
    types: [labeled, unlabeled]
concurrency:
  group: ci-hold-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true
jobs:
  dispatch:
    if: ${{ github.event.label.name == 'ci:hold' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          HELD: ${{ contains(github.event.pull_request.labels.*.name, 'ci:hold') }}
        run: gh workflow run ci.yml --ref "$HEAD_REF" -f pr="$PR" -f held="$HELD"
