# Machine-evaluable criteria for M3 (change-area catalog).
# Schema: modules/README.md § "maturity.yaml schema". Each criterion is an
# observable repo fact, scored absent -> convention -> mechanical.
module: M3
name: change-area-catalog
criteria:
  - id: catalog-is-single-source
    level: lite
    requires: convention
    statement: >-
      One catalog file is the single place that maps path patterns to named
      change-areas and their implications; consumers reference area names
      rather than re-listing the path patterns.
    observe:
      - "a single catalog file (yaml/json/toml) lists areas with their path globs"
      - "at least one consumer (CI, review docs, deploy) refers to area names, not copied globs"

  - id: catalog-schema-validated
    level: lite
    requires: mechanical
    statement: >-
      A check validates the catalog's structure: area ids are well-formed,
      every implied-by reference names an existing area, and no area implies
      itself.
    observe:
      - "a script/schema validates area-id format and rejects unknown fields"
      - "a check fails on a dangling impliedBy reference or a self-implication"

  - id: catalog-graph-validated
    level: standard
    requires: mechanical
    statement: >-
      A CI check enforces the graph invariants of the implied-by relation:
      referential integrity and no cycles.
    observe:
      - "a CI job runs the catalog checker (referential integrity + cycle detection)"
      - "a cycle or dangling reference fails the build"

  - id: workspace-coverage-gated
    level: standard
    requires: mechanical
    statement: >-
      Every workspace directory on disk maps to at least one area, and each
      area's declared workspace exists and is matched by one of its own globs;
      a new unmapped workspace fails CI.
    observe:
      - "a check maps each apps/* and packages/* dir to an area's workspace"
      - "a check fails when a workspace is absent, unglobbed, or uncovered"

  - id: consumer-view-generated
    level: standard
    requires: mechanical
    statement: >-
      At least one consumer view (CI job selection, review-gate table, or
      component directory) is a projection generated from the catalog and
      carries a freshness gate that fails when the committed copy is stale.
    observe:
      - "a generator emits a consumer view from the catalog"
      - "a CI drift check fails when the committed projection is out of date"

  - id: ci-selection-resolver-driven
    level: strict
    requires: mechanical
    statement: >-
      CI job selection is driven by the resolver (seed match + implied-by
      closure), so a change to a shared area mechanically triggers the jobs of
      every area that depends on it.
    observe:
      - "a CI setup step resolves changed files to areas and gates downstream jobs on the result"
      - "a shared-area change triggers dependent-area jobs whose own paths did not change"

  - id: all-consumers-generated
    level: strict
    requires: mechanical
    statement: >-
      Every consumer view is a generated projection with a freshness gate; no
      consumer re-hardcodes the catalog's path patterns.
    observe:
      - "each consumer (CI, review table, labels, deploy tiers, post-deploy) is generated and drift-gated"
      - "no consumer file contains a hand-maintained copy of the area path globs"

  - id: regex-shortcut-sync-checked
    level: strict
    requires: mechanical
    statement: >-
      Any hand-maintained CI shortcut regex is checked against the catalog in
      both directions and against the union of files tracked at the current
      and base refs (the two directional checks alone can pass while a
      whole unmapped tracked file still slips through — see
      reference/regex-mirror/README.md).
    observe:
      - "no hand-maintained CI shortcut regex exists — CI job selection is driven entirely by the resolver (see ci-selection-resolver-driven) — in which case this criterion is vacuously satisfied"
      - "checkFilterSegmentCoverage asserts every regex alternative's prefix matches a component-boundary literal head of some area's parsed paths: value — never a substring scan of the catalog file's raw text, which a notes: field's prose could satisfy"
      - "checkFilterCoverage asserts every area whose impliedBy closure reaches the shortcut's target area class has its paths: glob matched by some regex alternative, compared the same parsed-values way"
      - "a check asserts every tracked file the regex calls code-bearing matches at least one catalog area, checked against the union of current- and base-ref tracked files (checkFilterFileCoverage)"
      - "if the shortcut gates deployment specifically rather than answering the general \"did any code change?\" question, a check also asserts every matching tracked file's area closure reaches a deploy-critical area (checkFilterCodeAreaCoverage)"
