# TEMPLATE — copy this to your repo (e.g. tools/change-areas/catalog.yaml) and
# replace the single example area with your own. This is the single source of
# truth mapping path patterns -> change-areas -> implications; every consumer
# (CI selection, review gates, tracker labels, deploy tiers) is generated from
# it. See the module README and reference/catalog/ for the full field spec,
# the resolver algorithm, and a worked multi-area example. As written, it
# loads under the schema of Jig's change-areas skill.

# --- optional: close the open fields, and declare the validation profiles ---
# vocabularies:                    # each a non-empty list; a field without one takes any text
#   category: [<group>, ...]
#   deployTier: [<tier>, none]
# profiles:                        # shallowest first; the LAST is the deepest and the default
#   <shallow>:
#     localChecks: ["<pre-commit command>"]
#     verificationChecks: ["<verification command>"]
#   <deep>:
#     localChecks: ["<pre-commit command>", "<test command>"]
#     verificationChecks: ["<verification command>", "<test command>"]

areas:
  # One area per "kind of change." The id is a kebab-case slug used by every
  # consumer — they reference this name, never re-hardcode the globs below.
  # Rename `my-area` to your own.
  my-area:
    title: "<Human Name>"
    category: <group>            # grouping tag only — NOT a build/deploy lane
    paths: ["<glob>/**"]         # globs that define membership (>=1)
    workspace: ["<apps-or-packages-dir>"]  # owning dir(s); [] if path-only
    impliedBy: []                # ids whose change also implies THIS area
    deployTier: <tier|none>      # which deploy lane applies
    # --- optional projection blocks: add only when the consumer exists ---
    # review:
    #   skills: [<review-skill>]
    #   notes: "when this review applies"
    # postDeploy:
    #   - action: "<operational step>"
    #     when: "<trigger>"
    #     envs: [staging, prod]
    # tracker:
    #   labels: [<tracker-label>]
    # agent: <owning-agent>
    # validation:
    #   profile: <profile>             # a name under `profiles`: what a coding agent must run
    #                                  # pre-commit/push (omitting this block, or `profile`,
    #                                  # defaults to the deepest profile)
    #   ownTests: "<test command>"     # the area's own suite, run before commit and in verification
    #   notes: "why this depth"
    # generated:                        # the derived files this area owns, in M2's inventory format
    #   - outputs: ["<derived-file>"]   # each declared once, matched by this area's `paths`
    #     source: ["<source-glob>/**"]  # must match a file — checked, not just glob-shaped;
    #                                   # matching this activates THIS area's freshness check,
    #                                   # even when the source lives under a different area's `paths`
    #     command: "<regenerate command>"
    #     check: "<freshness check>"    # exits 0 fresh, 1 stale; M2's runner runs every one
    #     notes: "what this generates and why it lives on this area"
