# Change-area catalog — worked generic example.
#
# This is the single source of truth mapping path patterns -> named
# change-areas -> everything that must happen because of a change. Every
# consumer (CI job selection, review gates, tracker labels, deploy tiers,
# post-deploy actions) is a projection generated from this file and references
# area *names*, never re-hardcoding the globs.
#
# The areas below are neutral placeholders — a web app that consumes a shared
# library, a deployable API service, a generated schema owned by that service,
# the shared library itself, a CI-infra area, a docs area, and a throwaway
# prototype area — chosen only to exercise every field, both shapes of the
# `impliedBy` relation, and both `validation:` profiles. Replace them with
# your repo's real areas.
#
# Field reference: see ./README.md § "Entry schema".

areas:
  # ---- A deployable app that fans out from the shared library -------------
  web-app:
    title: "Web App"
    category: app                 # grouping tag only — never a build/deploy lane
    paths: ["apps/web-app/**"]    # globs that DEFINE membership
    workspace: ["apps/web-app"]   # owning workspace dir(s); must exist and be glob-covered
    impliedBy: [core-lib, ci-infra]  # a change to any listed area also implies THIS area
    deployTier: primary
    notes: "Rebuilt whenever the shared library or CI infra changes."
    review:
      skills: [ui-review]
      notes: "Applies when user-facing components change."
    tracker:
      labels: [area:web]
    agent: frontend

  # ---- A deployable service with a post-deploy action --------------------
  api-service:
    title: "API Service"
    category: service
    paths: ["apps/api-service/**"]
    workspace: ["apps/api-service"]
    impliedBy: [core-lib, ci-infra]
    deployTier: primary
    validation:
      profile: deep
      needsSandbox: true
      notes: "Route/contract changes need integration coverage against a CI-identical sandbox."
    review:
      skills: [api-review]
      notes: "Applies when request/response contracts change."
    postDeploy:
      - action: "warm read-through cache"
        when: "after new instances are healthy in each env"
        envs: [staging, prod]
        notes: "Runs against the deployed image, not the repo."
    tracker:
      labels: [area:api]
    agent: backend

  # ---- A generated-artifact area coupling M3 to M2's freshness gate -------
  api-schema:
    title: "Generated API Schema"
    category: generated
    paths: ["packages/api-schema/**"]
    workspace: ["packages/api-schema"]
    impliedBy: [api-service]     # an api-service change adds this area to the resolved closure
    deployTier: none
    validation:
      profile: shallow
      needsSandbox: false
      notes: "Generated output; the source (api-service routes) carries the real code gates."
    generated:                   # M2's inventory entries: the derived files this area owns
      - outputs: ["packages/api-schema/openapi.json"]
        source: ["apps/api-service/src/routes/**"]
        command: "npm run generate:api-schema"
        check: "npm run generate:api-schema -- --check"
        notes: "Regenerated from route definitions; M2's generic runner runs the check, its triad wires the hook."
    tracker:
      labels: [area:api]

  # ---- A path-only library area that fans OUT to its consumers -----------
  core-lib:
    title: "Core Shared Library"
    category: library
    paths: ["packages/core-lib/**"]
    workspace: ["packages/core-lib"]
    impliedBy: []                 # nothing implies it; it implies consumers via THEIR impliedBy
    deployTier: none
    tracker:
      labels: [area:shared]
    agent: architect

  # ---- An infra area every deployable consumes ---------------------------
  ci-infra:
    title: "CI & Build Infra"
    category: infra
    paths: [".github/workflows/**", "turbo.json", "package.json"]
    workspace: []                 # path-only area, no owning workspace dir
    impliedBy: []
    deployTier: none
    tracker:
      labels: [area:infra]
    agent: platform

  # ---- A docs area with no deploy or review implications -----------------
  docs:
    title: "Documentation"
    category: docs
    paths: ["docs/**"]
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: shallow
      needsSandbox: false
      notes: "No code to gate — shallow because there's nothing to run, not because prose is inherently shallow."
    tracker:
      labels: [area:docs]

  # ---- Real code on the shallow validation profile, deliberately ---------
  # Demonstrates that `shallow` means "skips the code gates," not "is prose":
  # this is real code, kept shallow because it never ships.
  spike:
    title: "Prototype / Spike Code"
    category: prototype
    paths: ["spikes/**"]
    workspace: []
    impliedBy: []
    deployTier: none
    validation:
      profile: shallow
      needsSandbox: false
      notes: "Real code, not prose — shallow because it never ships, not because it isn't code."
