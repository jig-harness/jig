# PR quality gates — GitHub Actions skeleton (groundwork module M1).
#
# Copy to .github/workflows/pr-gates.yml, replace every <placeholder>, delete
# jobs you don't need. The SHAPE is the point:
#
#   - CI is the AUTHORITY: every check the local hooks run is mirrored here,
#     so `--no-verify` and unfamiliar tooling cannot change what merges.
#   - Grep gates run first and cheap, WITH their self-tests, so a broken
#     gate fails loudly instead of passing silently.
#   - A detect-changes step gates the expensive steps on whether relevant
#     files actually changed (docs-only PRs stay fast).
#   - Concurrency-cancel: a new push to the PR cancels the superseded run.
#
# Make the jobs required status checks in branch protection — that, not the
# workflow file, is what makes them blocking.
# GitLab CI equivalent: see ../mappings.md.
name: PR quality gates

on:
  pull_request:
    branches: [<default-branch>]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One runner: cheap gates → toolchain setup → quality gate set → build.
  # Sequential on purpose — the grep gates fail in seconds, before any
  # dependency install is paid for.
  gates-and-build:
    runs-on: <runner, e.g. ubuntu-latest>
    outputs:
      code-changed: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@<pinned-sha>
        with:
          fetch-depth: 0    # grep gates that diff against the base need history

      # Install the pinned gate runtime before the first gate runs. This step is
      # unconditional: the gates below run on every PR, including docs-only ones,
      # so they cannot rely on the change-gated "Setup toolchain" step later.
      - uses: jdx/mise-action@<pinned-sha>    # reads the Bun pin from mise.toml
      # --- Cheap grep gates (mirrors of the pre-push hook; see lefthook.yml).
      # Run each gate AND its paired self-test. Keep one step per rule so a
      # failure names the rule in the check UI.
      - name: Gate — <rule-1>
        run: bun scripts/check-<rule-1>.ts
      - name: Gate self-test — <rule-1>
        run: bun test scripts/check-<rule-1>.test.ts

      - name: Gate — review markers on protected commits
        # CI-side re-check of the commit-msg marker (closes --no-verify):
        # every PR commit touching protected paths must carry the tag.
        run: |
          for c in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            # -m: for merge commits, diff against each parent individually —
            # without it, diff-tree emits no paths for a merge commit at all,
            # so a conflict resolution touching a protected path goes unchecked.
            if git diff-tree --no-commit-id --name-only -r -m "$c" | grep -qE '<^regex/for/protected/paths$>'; then
              git log -1 --format=%B "$c" | grep -qF '<[reviewed:your-process] tag>' || {
                echo "ERROR: commit $c touches protected paths without the review marker"; exit 1; }
            fi
          done

      # --- Detect changes: skip the expensive phase for docs-only PRs.
      # Keep the path regex in ONE place (a sourced script) if more than one
      # workflow needs it — inline copies drift.
      - name: Detect file changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -E '<regex matching code paths>' | grep -vE '<regex matching docs/markdown>' > /dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Toolchain + the canonical gate set (same order as everywhere:
      # format → lint → types → build; tests run on the parallel runner).
      - name: Setup toolchain
        if: steps.changes.outputs.code == 'true'
        run: <install language runtime + dependencies>
      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: <format check command>
      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: <lint command>
      - name: Type check
        if: steps.changes.outputs.code == 'true'
        run: <type check command>
      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: <build command, scoped to changed packages + dependents if your task runner supports it>

  # Tests on a separate runner, in parallel with the build job.
  tests:
    runs-on: <runner, e.g. ubuntu-latest>
    steps:
      - uses: actions/checkout@<pinned-sha>
        with:
          fetch-depth: 0
      - name: Detect file changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -E '<regex matching code paths>' | grep -vE '<regex matching docs/markdown>' > /dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup toolchain
        if: steps.changes.outputs.code == 'true'
        run: <install language runtime + dependencies>
      - name: Run tests
        if: steps.changes.outputs.code == 'true'
        run: <test command, scoped to changed packages + dependents if your task runner supports it>

  # Advisory job pattern: a gate being trialed runs with continue-on-error so
  # it reports without blocking. Every advisory gate carries a promotion
  # condition + date in its comment — advisory-forever is a tracked smell.
  # advisory-<new-gate>:
  #   runs-on: <runner>
  #   continue-on-error: true
  #   steps: ...   # promote to blocking when: <condition>, review by <date>

  # Digest into the run's Job Summary (not a PR comment — pass/fail is
  # already a required status check; this avoids notification noise).
  summary:
    runs-on: <runner, e.g. ubuntu-latest>
    needs: [gates-and-build, tests]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## PR quality gates"
            echo ""
            echo "- gates-and-build: ${{ needs.gates-and-build.result }}"
            echo "- tests: ${{ needs.tests.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
