# PR quality gates — GitHub Actions skeleton (Jig module M1).
#
# Copy to .github/workflows/pr-gates.yml, replace every <placeholder>, delete
# jobs you don't need. The SHAPE is the point:
#
#   - CI is the AUTHORITY: every check the local hooks run is mirrored here,
#     so `--no-verify` and unfamiliar tooling cannot change what merges.
#   - Grep gates run first and cheap, WITH their self-tests, so a broken
#     gate fails loudly instead of passing silently.
#   - ONE resolver job decides what this change needs, from the change-area
#     catalog (Jig module M3). Every other job reads its outputs; no job
#     re-derives "what changed" with its own path pattern, because copies of
#     that pattern drift apart.
#   - ONE aggregator job, `pr-gates`, is the only required status check. It
#     runs whenever the run was not cancelled, fails when any selected job
#     failed or was cancelled, and names the jobs that did. A job skipped
#     because the change did not need it passes; a job skipped because the
#     job it needs failed does not.
#   - Every job has a timeout of about two to three times its slowest healthy
#     run, at most 60 minutes, and never the provider's default (Jig module
#     M13, Bound).
#   - Concurrency-cancel: a new push to the PR cancels the superseded run.
#
# Make `pr-gates`, and only it, the required status check in branch
# protection. Never filter this workflow with `on.pull_request.paths`: a
# workflow that does not run never reports, so the PR waits on it forever,
# and GitHub counts a SKIPPED required job as passing. Selection happens
# inside the workflow, and the aggregator turns it into one honest verdict.
# GitLab CI equivalent: see ../mappings.md.
name: PR quality gates

on:
  pull_request:
    branches: [<default-branch>]
    types: [opened, synchronize, reopened]
    # CI hold (opt in; Jig module M13, piece 7): with a hold label, list both
    # label transitions too. Applying the label fires only `labeled`, so
    # without it the held head keeps its pre-hold result; removing it fires
    # only `unlabeled`, so without it nothing runs again on the released head.
    # Listing any type replaces the three defaults, so they stay listed:
    #   types: [opened, synchronize, reopened, labeled, unlabeled]

# Cancel in-progress runs for the same PR when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What does this change need? Answered once, on the smallest runner, before
  # anything is installed beyond the resolver and its runtime. Fail closed: a
  # changed file that matches no area counts as code, so every job gated on
  # `code` runs. A job gated on one area's membership does not see an
  # unmatched file; gate it on `code` as well, or make every file belong to an
  # area (Jig's own gates check that).
  changes:
    runs-on: <smallest runner, e.g. ubuntu-latest>
    timeout-minutes: 5
    outputs:
      code: ${{ steps.resolve.outputs.code }}
    steps:
      - uses: actions/checkout@<pinned-sha>
        with:
          fetch-depth: 0    # the resolver diffs against the merge base
      # The resolver's runtime: this job's environment is its own, so the
      # install in gates-and-build below does not reach it.
      - uses: jdx/mise-action@<pinned-sha>    # reads the Bun pin from mise.toml
      - name: Resolve the changed files to areas
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Writes `code=true|false` (and any per-area outputs your jobs need)
        # to $GITHUB_OUTPUT, from the catalog. Jig's own resolver is
        # scripts/change-areas.ts; any command that reads the catalog works.
        run: <resolver command, e.g. bun scripts/change-areas.ts --base "$BASE_SHA">

  # One runner: cheap gates → toolchain setup → quality gate set → build.
  # Sequential on purpose: the grep gates fail in seconds, before any
  # dependency install is paid for.
  gates-and-build:
    needs: changes
    runs-on: <runner, e.g. ubuntu-latest>
    timeout-minutes: <2-3x the slowest healthy run, at most 60, e.g. 20>
    steps:
      - uses: actions/checkout@<pinned-sha>
        with:
          fetch-depth: 0    # grep gates that diff against the base need history

      # Install the pinned gate runtime before the first gate runs. This step is
      # unconditional: the gates below run on every PR, including docs-only ones,
      # so they cannot rely on the change-gated "Setup toolchain" step later.
      - uses: jdx/mise-action@<pinned-sha>    # reads the Bun pin from mise.toml
      # --- Cheap grep gates (mirrors of the pre-push hook; see lefthook.yml).
      # Run each gate AND its paired self-test. Keep one step per rule so a
      # failure names the rule in the check UI.
      - name: Gate — <rule-1>
        run: bun scripts/check-<rule-1>.ts
      - name: Gate self-test — <rule-1>
        run: bun test scripts/check-<rule-1>.test.ts

      - name: Gate — review markers on protected commits
        # CI-side re-check of the commit-msg marker (closes --no-verify):
        # every PR commit touching protected paths must carry the tag.
        # Event values reach the script through env:, never by expanding
        # ${{ }} inside run:, which would splice them into the shell source.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          for c in $(git rev-list "origin/$BASE_REF..HEAD"); do
            # -m: for merge commits, diff against each parent individually —
            # without it, diff-tree emits no paths for a merge commit at all,
            # so a conflict resolution touching a protected path goes unchecked.
            if git diff-tree --no-commit-id --name-only -r -m "$c" | grep -qE '<^regex/for/protected/paths$>'; then
              git log -1 --format=%B "$c" | grep -qF '<[reviewed:your-process] tag>' || {
                echo "::error::commit $c touches protected paths without the review marker"; exit 1; }
            fi
          done

      # --- Toolchain + the canonical gate set (same order as everywhere:
      # format → lint → types → build; tests run on the parallel runner).
      # Skipped when the resolver found nothing these steps check.
      - name: Setup toolchain
        if: needs.changes.outputs.code == 'true'
        run: <install language runtime + dependencies>
      # Cache (opt in; Jig module M13, piece 8): the provider substitutes an
      # empty string for a secret that is absent or rotated out rather than
      # failing, and the task runner rarely fails on it either, so a job with
      # an empty credential splits off silently: it runs without the shared
      # cache, or, where the value selects the store, writes a cache
      # namespace of its own that no other job reads. Fail before the first
      # task instead. The secrets context is unavailable in `if:`, so the
      # values go through env:. Only a trusted run is held to this: a pull
      # request from a fork, or one Dependabot opened, receives no secrets by
      # design and runs uncached (M13's trust boundary), so the condition
      # leaves it out, and the task runner's remote cache must be switched
      # off for it explicitly (for example its remote-cache setting set to
      # off under the negated condition), so its gates still run.
      # - name: Require the cache credentials
      #   if: >-
      #     needs.changes.outputs.code == 'true' &&
      #     (github.event_name != 'pull_request' ||
      #      (github.event.pull_request.head.repo.full_name == github.repository &&
      #       github.actor != 'dependabot[bot]'))
      #   env:
      #     CACHE_TOKEN: ${{ secrets.<cache token> }}
      #     CACHE_TEAM: ${{ secrets.<cache team> }}
      #   run: |
      #     for v in CACHE_TOKEN CACHE_TEAM; do
      #       [ -n "${!v}" ] || { echo "::error::cache credential $v is empty: this job would run apart from the shared cache"; exit 1; }
      #     done
      - name: Check formatting
        if: needs.changes.outputs.code == 'true'
        run: <format check command>
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: <lint command>
      - name: Type check
        if: needs.changes.outputs.code == 'true'
        run: <type check command>
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: <build command, scoped to changed packages + dependents if your task runner supports it>
      # Cache (opt in): the hit rate from the task runner's run summary, into
      # the job summary, so a cache that stores nothing or a namespace split
      # shows as a zero beside the other jobs' numbers (M11's
      # ci-cache-hit-rate metric reads it).
      # - name: Report the cache hit rate
      #   if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
      #   run: <command that prints hits, misses and the rate from the run summary> >> "$GITHUB_STEP_SUMMARY"

  # Tests on a separate runner, in parallel with the build job. Skipped as a
  # whole when the change needs no tests; the aggregator tells that skip apart
  # from a failure.
  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # CI hold (opt in): on each job the hold may skip, add the guard as an
    # &&-joined term of its condition. It tests the pull request's labels,
    # never the event's action: with label events starting runs, a job that
    # skipped on any `labeled` event would let an unrelated label turn a
    # failing head into a passing skip, while this one skips only a held
    # pull request and runs real CI on any other label event.
    #   if: needs.changes.outputs.code == 'true' && !contains(github.event.pull_request.labels.*.name, '<hold label>')
    runs-on: <runner, e.g. ubuntu-latest>
    timeout-minutes: <2-3x the slowest healthy run, at most 60, e.g. 30>
    steps:
      - uses: actions/checkout@<pinned-sha>
      - name: Setup toolchain
        run: <install language runtime + dependencies>
      - name: Run tests
        run: <test command, scoped to changed packages + dependents if your task runner supports it>

  # Advisory job pattern: a gate being trialed runs with continue-on-error so
  # it reports without blocking. Every advisory gate carries a promotion
  # condition + date in its comment — advisory-forever is a tracked smell.
  # Leave it out of the aggregator's `needs` until it is promoted.
  # advisory-<new-gate>:
  #   needs: changes
  #   runs-on: <runner>
  #   timeout-minutes: <minutes>
  #   continue-on-error: true
  #   steps: ...   # promote to blocking when: <condition>, review by <date>

  # The single required check. `!cancelled()` rather than `always()`:
  # `always()` also runs when a newer push cancelled this run, and then reports
  # a failure for a head that is already superseded. The verdict and the list
  # of failed jobs also go to the run's Job Summary (not a PR comment: the
  # required check already carries pass/fail, and comments add noise).
  pr-gates:
    needs: [changes, gates-and-build, tests]
    if: ${{ !cancelled() }}
    runs-on: <smallest runner, e.g. ubuntu-latest>
    timeout-minutes: 5
    steps:
      # CI hold (opt in): the held-head check. It fails this required check
      # while the label is present, so a held head is visibly not mergeable
      # from the moment the label lands, and its message says how to release
      # it. Keep it first, in this job (which runs on `!cancelled()`, so a
      # heavy job the hold skipped cannot skip it too), with no
      # continue-on-error: a tolerated failure fails nothing. To have the
      # held run listed as cancelled rather than failed once the release
      # passes, cancel the run before failing: M13's mappings.md, § Hold.
      # - name: Fail while held
      #   if: contains(github.event.pull_request.labels.*.name, '<hold label>')
      #   run: |
      #     echo "::error::CI is held between review rounds: remove the <hold label> label to run every check on this head"
      #     exit 1
      - name: Require every selected job
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          GATES_AND_BUILD: ${{ needs.gates-and-build.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          failed=""
          [ "$CHANGES" = success ] || failed="$failed changes($CHANGES)"
          [ "$GATES_AND_BUILD" = success ] || failed="$failed gates-and-build($GATES_AND_BUILD)"
          # tests may be skipped only when the resolver said no code changed;
          # a missing answer is a failure, not a reason to skip.
          case "$CODE" in
            true) [ "$TESTS" = success ] || failed="$failed tests($TESTS)" ;;
            false) [ "$TESTS" = skipped ] || failed="$failed tests($TESTS)" ;;
            *) failed="$failed changes(no code output)" ;;
          esac
          {
            echo "## PR quality gates"
            echo ""
            echo "- changes: $CHANGES (code: ${CODE:-unknown})"
            echo "- gates-and-build: $GATES_AND_BUILD"
            echo "- tests: $TESTS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not pass:$failed"
            exit 1
          fi
