# Secret scan — GitHub Actions skeleton (Jig module M1, core piece 7).
#
# Copy to .github/workflows/secret-scan.yml and replace every <placeholder>.
# The SHAPE is the point:
#
#   - It is the blocking layer of a layered secret scan: the pre-commit hook
#     catches a secret on the committer's machine, this job catches what was
#     committed with --no-verify or from a machine without the hook, and the
#     forge's push protection catches a push that reaches neither.
#   - It scans exactly the commits the change introduced (merge base to the
#     head), never the whole history, so a finding is always the author's own
#     and a pull request is never blocked on an old leak. A push to the
#     default branch scans the pushed range (its whole history when the push
#     creates it); a manual run scans from the commit it is given, or the
#     full history when given none.
#   - It refuses an empty range. A scanner handed no commits exits 0 having
#     examined nothing, which looks exactly like a clean scan; the step fails
#     instead (M1's fail-closed rule).
#   - The scanner binary is pinned by version AND checksum, since a scanner
#     fetched at run time is itself a dependency on the credential path.
#   - A finding's remedy is printed with it: remove and rewrite, rotate, or
#     mark a known false positive in the scanner's configuration with a
#     reason.
#   - Least privilege: it reads the repository and nothing else.
#
# The practice, and the hook and push-protection layers per scanner:
#   https://github.com/docomply/jig/blob/main/modules/M1-gates-enforcement-ladder/README.md
#   https://github.com/docomply/jig/blob/main/modules/M1-gates-enforcement-ladder/mappings.md
name: Secret scan

on:
  pull_request:
    branches: [<default-branch>]
  push:
    branches: [<default-branch>]
  workflow_dispatch:
    inputs:
      since:
        description: >-
          Scan the commits after this commit or ref (the ref itself is not
          scanned). Empty: scan everything reachable from the checked-out ref.
        required: false
        type: string

# One group per pull request, so a newer run supersedes the older one; one
# per pushed commit, since each push run covers a range of its own and
# cancelling it would leave those commits unscanned; one per manual run.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCANNER_VERSION: "<scanner version>"
  SCANNER_SHA256: "<sha256 of the release archive>"

jobs:
  secret-scan:
    name: Scan the change's commits for leaked secrets
    runs-on: <smallest runner, e.g. ubuntu-latest>
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@<pinned-sha>
        with:
          # The range scan needs the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Install the scanner (pinned version, verified checksum)
        run: |
          set -euo pipefail
          ARCHIVE="<scanner archive name for linux x64>"
          curl -fsSL -o "$ARCHIVE" "<scanner release URL for version ${SCANNER_VERSION}>"
          echo "${SCANNER_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          tar xzf "$ARCHIVE" <scanner binary name>
          chmod +x <scanner binary name>

      # Produces one output, `range`: a revision range the scanner is handed
      # as is. Either "<from>..<head>" (the commits the change introduced) or
      # "<head>" alone (every commit reachable from the head).
      - name: Resolve what to scan
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.base_ref }}
          PUSHED_FROM: ${{ github.event.before }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          from=""
          case "$EVENT" in
            pull_request)
              # Everything the pull request adds on top of its target.
              from=$(git merge-base "$HEAD_SHA" "origin/${TARGET_BRANCH}")
              ;;
            push)
              # The tip before the push. The push filter names only the
              # default branch, so an all-zero tip is that branch being
              # created: there is no earlier tip, and its whole history is
              # new, so it is scanned whole.
              case "$PUSHED_FROM" in
                ''|0000000000000000000000000000000000000000)
                  from=""
                  ;;
                *)
                  from="$PUSHED_FROM"
                  ;;
              esac
              ;;
            workflow_dispatch)
              # A manual run names its own start, or scans everything. It never
              # derives one from the default branch: run on that branch, the
              # derivation would yield a range of zero commits.
              if [ -n "$SINCE" ]; then
                from=$(git rev-parse --verify --quiet "${SINCE}^{commit}") \
                  || { echo "::error::'${SINCE}' is not a commit in this clone"; exit 2; }
              fi
              ;;
          esac
          range="${from:+${from}..}${HEAD_SHA}"
          count=$(git rev-list --count "$range")
          # A range of zero commits is refused rather than scanned: the scanner
          # would pass it, and a pass over nothing is not a clean scan.
          if [ "$count" -eq 0 ]; then
            echo "::error::'${range}' holds no commits; refusing to report a scan that examined none"
            exit 1
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "scanning ${count} commit(s): ${range}"

      - name: Scan the commits
        env:
          RANGE: ${{ steps.scope.outputs.range }}
        run: |
          set -euo pipefail
          # The scanner's git mode over exactly that range, redacting the
          # secret in its output and exiting non-zero on a finding, e.g.
          #   ./<scanner> git . --config <scanner config> --log-opts="$RANGE" --redact --exit-code 1
          <scanner command over "$RANGE">

      - name: Say what to do about a finding
        if: failure()
        run: |
          echo "A potential secret is in the scanned commits. Either:"
          echo "  1. remove it and rewrite the branch's history (git rebase -i), then force-push;"
          echo "  2. rotate the credential now: a secret that was pushed is compromised;"
          echo "  3. for a false positive, mark the line or add a rule in <scanner config>, with a reason."
