# BAD — `types:` is declared twice. A YAML consumer resolving duplicate keys
# last would see an empty type vocabulary; the gate must fail closed on the
# repeated top-level key rather than counting the first list.
version: 1

types:
  - id: feature
  - id: chore

types: []

statuses:
  - id: todo
  - id: done

flags:
  - id: has-migration
    fires: migration-review
