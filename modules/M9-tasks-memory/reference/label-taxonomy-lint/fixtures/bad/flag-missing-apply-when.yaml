# BAD — the `has-migration` flag declares no `apply_when:`, so applying it is
# habit rather than a rule. The folded notes must not count as a condition.
version: 1

types:
  - id: feature
  - id: chore

statuses:
  - id: todo
  - id: done

flags:
  - id: has-migration
    scope: shipping-item
    fires: migration-review
    notes: >-
      a schema or data migration is present;
      apply_when: this line is folded text, not a field
